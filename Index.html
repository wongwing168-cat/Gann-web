<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width,
    initial-scale=1.0">
<meta
  name="theme-color"
  content="#0b0d12">
<title>江恩時空共振與和諧分析</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  background: #090b10;
  color: #f1f5f9;
  font-family: -apple-system,
    BlinkMacSystemFont,
    "Segoe UI", sans-serif;
  padding: 10px;
}
.app {
  max-width: 1440px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  background: #141821;
  padding: 8px 10px;
  border-radius: 10px;
  border: 1px solid #242b38;
}
.seg {
  display: inline-flex;
  background: #0b0d12;
  border-radius: 7px;
  padding: 2px;
  border: 1px solid #283040;
}
.seg button {
  background: transparent;
  color: #94a3b8;
  border: none;
  padding: 5px 8px;
  font-size: 12px;
  border-radius: 5px;
  cursor: pointer;
}
.seg button.on {
  background: #2563eb;
  color: #fff;
  font-weight: 600;
}
.btn {
  background: #1e2533;
  color: #e2e8f0;
  border: 1px solid #334155;
  padding: 5px 8px;
  font-size: 12px;
  border-radius: 6px;
  cursor: pointer;
}
.btn:hover {
  background: #2a3447;
}
.btn.on {
  background: #0f766e;
  border-color: #14b8a6;
  color: #fff;
}
.btn-hi {
  background: #ea580c;
  border-color: #f97316;
  color: #fff;
  font-weight: 600;
}
.btn-y {
  color: #facc15;
  border-color: #854d0e;
}
.btn-c {
  color: #38bdf8;
  border-color: #075985;
}
.btn-m {
  color: #34d399;
  border-color: #065f46;
}
.btn-del {
  color: #f87171;
  border-color: #7f1d1d;
  padding: 5px 7px;
}
.ac-wrap {
  position: relative;
  display: inline-block;
}
.ac-box {
  position: absolute;
  top: 100%;
  left: 0;
  margin-top: 4px;
  width: 295px;
  max-height: 280px;
  overflow-y: auto;
  background: #181e29;
  border: 1px solid #38bdf8;
  border-radius: 8px;
  box-shadow: 0 8px 24px #000;
  z-index: 99;
  display: none;
}
.ac-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  padding: 7px 9px;
  border-bottom: 1px solid #242b38;
  cursor: pointer;
  font-size: 12px;
}
.ac-item:hover {
  background: #253042;
}
.ac-sym {
  font-weight: 700;
  color: #facc15;
  min-width: 62px;
}
.ac-nm {
  color: #f1f5f9;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ac-bdg {
  font-size: 10px;
  padding: 2px 5px;
  border-radius: 4px;
  background: #064e3b;
  color: #34d399;
  white-space: nowrap;
}
.ac-otc {
  background: #27272a;
  color: #a1a1aa;
}
input, select {
  background: #0b0d12;
  color: #fff;
  border: 1px solid #334155;
  padding: 5px 8px;
  border-radius: 6px;
  font-size: 13px;
}
input {
  width: 106px;
  text-transform: uppercase;
}
select {
  max-width: 150px;
}
.lbl {
  font-size: 12px;
  color: #94a3b8;
}
.src-tag {
  font-size: 11px;
  color: #34d399;
  background: #064e3b;
  padding: 2px 7px;
  border-radius: 5px;
}
.sp {
  flex: 1;
}
.err {
  background: #7f1d1d;
  color: #fecaca;
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 12px;
  display: none;
}
.warn {
  background: #78350f;
  color: #fde68a;
}
.main {
  display: grid;
  grid-template-columns: 1.68fr 1fr;
  gap: 10px;
  min-height: 76vh;
}
@media (max-width: 860px) {
  .main {
    grid-template-columns: 1fr;
  }
}
.chart-box {
  background: #12161f;
  border: 1px solid #242b38;
  border-radius: 12px;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-height: 480px;
}
.hud {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
  font-size: 12px;
}
.hud-txt {
  color: #f8fafc;
  font-weight: 500;
}
.c-wrap {
  position: relative;
  flex: 1;
  min-height: 420px;
  touch-action: none;
}
canvas {
  width: 100%;
  height: 100%;
  display: block;
  border-radius: 8px;
  cursor: crosshair;
}
.load {
  position: absolute;
  inset: 0;
  background: rgba(9, 11, 16, 0.78);
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  color: #38bdf8;
  border-radius: 8px;
}
.side {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 82vh;
  overflow-y: auto;
}
.card {
  background: #141821;
  border: 1px solid #242b38;
  border-radius: 12px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.c-hd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-weight: 700;
  font-size: 14px;
}
.c-org { color: #fb923c; }
.c-mnt { color: #34d399; }
.c-yel { color: #facc15; }
.c-pnk {
  color: #f472b6;
  font-size: 12px;
  font-weight: 700;
}
.c-cyn {
  color: #38bdf8;
  font-size: 12px;
  font-weight: 700;
}
.c-big {
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  line-height: 1.45;
}
.c-sub {
  font-size: 12px;
  color: #fde047;
}
.c-val {
  font-size: 13px;
  color: #38bdf8;
}
.rep {
  font-size: 13px;
  line-height: 1.55;
  color: #e2e8f0;
  white-space: pre-wrap;
}
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.78);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
  padding: 12px;
}
.modal-box {
  background: #141821;
  border: 1px solid #334155;
  border-radius: 14px;
  width: 100%;
  max-width: 460px;
  max-height: 88vh;
  overflow-y: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.al-row {
  background: #1e2533;
  border-radius: 8px;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="seg" id="mktSeg">
      <button
        data-v="us">美股</button>
      <button
        class="on"
        data-v="hk">港股</button>
    </div>
    <button
      class="btn btn-y"
      id="btnHsi">恒指</button>
    <button
      class="btn btn-c"
      id="btnIxic">納指</button>
    <select id="presetSel">
      <option value="">自選紀錄</option>
    </select>
    <button
      class="btn btn-del"
      id="btnDelSaved"
      title="從自選移除目前標的">
      刪
    </button>
    <button
      class="btn btn-y"
      id="btnAlerts">🔔 到價</button>
    <div class="ac-wrap">
      <input
        id="codeInp"
        value="^HSI"
        autocomplete="off"
        placeholder="代碼/名稱">
      <div
        class="ac-box"
        id="acBox"></div>
    </div>
    <button
      class="btn btn-hi"
      id="btnGo">分析</button>
    <span
      class="src-tag"
      id="srcTag">線路就緒</span>
    <div class="sp"></div>
    <div class="seg" id="stySeg">
      <button
        class="on"
        data-v="candle">陰陽燭</button>
      <button
        data-v="line">折線圖</button>
    </div>
    <div class="seg" id="intSeg">
      <button
        data-v="15m">15分</button>
      <button
        data-v="30m">30分</button>
      <button
        data-v="60m">1時</button>
      <button
        data-v="1d">日線</button>
      <button
        class="on"
        data-v="1wk">週線</button>
      <button
        data-v="1mo">月線</button>
    </div>
  </div>

  <div class="bar">
    <span class="lbl">延伸:</span>
    <div class="seg" id="horSeg">
      <button
        data-v="30">30期</button>
      <button
        class="on"
        data-v="60">60期</button>
      <button
        data-v="90">90期</button>
      <button
        data-v="120">120期</button>
      <button
        data-v="252">252期</button>
    </div>
    <span class="lbl">方向:</span>
    <div class="seg" id="dirSeg">
      <button
        class="on"
        data-v="auto">自動</button>
      <button
        data-v="up">向上</button>
      <button
        data-v="down">向下</button>
    </div>
    <div class="seg" id="tModeSeg">
      <button
        class="on"
        data-v="trading">交易日</button>
      <button
        data-v="calendar">自然日</button>
    </div>
    <button
      class="btn on"
      id="togSwing">擺動線</button>
    <button
      class="btn on"
      id="togGrid">八分網格</button>
    <button
      class="btn"
      id="togFib">黃金位</button>
    <button
      class="btn on"
      id="togHarm">和諧形態</button>
    <div class="sp"></div>
    <span
      class="lbl"
      id="volLbl">波動:1.0x</span>
    <button
      class="btn"
      id="volDn">-</button>
    <button
      class="btn"
      id="volUp">+</button>
  </div>

  <div class="err" id="errBox"></div>

  <div class="main">
    <div class="chart-box">
      <div class="hud">
        <span
          class="hud-txt"
          id="hudTxt">載入中...</span>
        <div class="sp"></div>
        <button
          class="btn on"
          id="btnLocHarm"
          style="display:none">
          定位形態
        </button>
        <button
          class="btn btn-m"
          id="btnHistBack"
          style="display:none">
          ◀ 向前
        </button>
        <button
          class="btn btn-m"
          id="btnHistFwd"
          style="display:none">
          向後 ▶
        </button>
        <button
          class="btn btn-hi"
          id="btnLatest"
          style="display:none">
          回最新
        </button>
        <button
          class="btn btn-hi"
          id="btnMode">移動時間線</button>
        <button
          class="btn btn-c"
          id="btnZoomIn">+</button>
        <button
          class="btn btn-c"
          id="btnZoomOut">-</button>
        <button
          class="btn btn-hi"
          id="btnSetAnc"
          style="display:none">
          設為起點
        </button>
        <button
          class="btn btn-y"
          id="btnAutoAnc">自動起點</button>
      </div>
      <div
        class="c-wrap"
        id="cWrap">
        <canvas id="cv"></canvas>
        <div
          class="load"
          id="loadBox">
          切換線路抓取報價中...
        </div>
      </div>
    </div>

    <div class="side">
      <div class="card">
        <div class="c-hd c-org">
          <span id="turnCardTitle">
            大級別圓周與轉勢窗口
          </span>
        </div>
        <div
          class="c-cyn"
          id="dailyHintBadge"
          style="display:none">--</div>
        <div
          class="c-pnk"
          id="turnBadge"
          style="display:none">
          ◎ 命中核心時空共振
        </div>
        <div
          class="c-big"
          id="turnDate">--</div>
        <div
          class="c-sub"
          id="turnWhy">--</div>
        <div
          class="c-val"
          id="turnPrice">--</div>
      </div>

      <div class="card">
        <div class="c-hd c-mnt">
          <span>和諧交易形態推演</span>
        </div>
        <div
          class="c-cyn"
          id="harmBadge"
          style="display:none">
          ◎ 已自動向前推移鎖定歷史形態
        </div>
        <div
          class="c-big"
          id="harmName">--</div>
        <div
          class="c-sub"
          id="harmDate">--</div>
        <div
          class="c-val"
          id="harmPrz">--</div>
      </div>

      <div class="card">
        <div class="c-hd c-yel">
          <span id="repTitle">
            江恩策略建議
          </span>
          <button
            class="btn"
            id="btnCopy">複製報告</button>
        </div>
        <div
          class="rep"
          id="repBody">載入中...</div>
      </div>
    </div>
  </div>
</div>

<div
  class="modal-bg"
  id="alertModal">
  <div class="modal-box">
    <div class="c-hd c-org">
      <span>🔔 江恩到價作戰計劃與響鬧</span>
      <div style="display:flex;gap:5px;align-items:center">
        <select
          id="ringToneSel"
          style="width:108px;font-size:11px">
          <option value="alarm">
            急促鬧鈴(Alarm)
          </option>
          <option value="bell">
            清脆鐘聲(Bell)
          </option>
          <option value="electronic">
            雷達雙音(Radar)
          </option>
          <option value="minuet">
            柔和琴音(Soft)
          </option>
        </select>
        <button
          class="btn btn-y"
          id="btnTestRing">測鈴聲</button>
        <button
          class="btn"
          id="btnCloseAlert">關閉</button>
      </div>
    </div>

    <div
      style="background:#1e2533;
      padding:8px;border-radius:8px;
      display:flex;flex-direction:column;
      gap:6px">
      <div
        class="lbl"
        style="color:#38bdf8">
        iPhone 鎖屏背景響鬧（填入免費 Bark App Key）：
      </div>
      <div style="display:flex;gap:6px">
        <input
          id="barkKeyInp"
          style="flex:1;
          text-transform:none"
          placeholder="貼上 iPhone Bark Key">
        <button
          class="btn on"
          id="btnSaveBark">儲存Key</button>
      </div>
    </div>

    <div
      style="background:#1e2533;
      padding:10px;border-radius:8px;
      display:flex;flex-direction:column;
      gap:7px">
      <div
        style="display:flex;
        justify-content:space-between;
        font-size:13px">
        <span
          id="alCurSym"
          style="color:#facc15;
          font-weight:700">--</span>
        <span
          id="alCurP"
          style="color:#38bdf8">--</span>
      </div>
      <div style="display:flex;gap:6px">
        <select
          id="alCondSel"
          style="width:110px">
          <option value="向下跌破">
            向下跌破
          </option>
          <option value="向上突破">
            向上突破
          </option>
        </select>
        <input
          id="alTargetInp"
          type="number"
          step="0.01"
          style="flex:1;
          text-transform:none"
          placeholder="目標價位">
      </div>
      <div
        id="alQuickFill"
        style="display:flex;
        flex-wrap:wrap;gap:5px">
      </div>
      <div
        style="display:flex;
        align-items:center;
        gap:6px;flex-wrap:wrap">
        <span class="lbl">
          提醒時機:
        </span>
        <select
          id="alModeSel"
          style="width:112px">
          <option value="immediate">
            即時響鬧
          </option>
          <option value="scheduled">
            定時通知
          </option>
        </select>
        <input
          id="alTimeInp"
          type="time"
          value="08:30"
          style="width:105px;
          display:none;
          text-transform:none">
        <span
          id="alModeTip"
          class="lbl"
          style="color:#fb923c">
          到價立刻響鬧
        </span>
      </div>
      <textarea
        id="alNoteInp"
        rows="4"
        style="width:100%;
        background:#0b0d12;
        color:#fff;
        border:1px solid #334155;
        border-radius:6px;
        padding:7px 8px;
        font-size:13px;
        line-height:1.45;
        resize:vertical"
        placeholder="輸入詳細交易作戰方案（支援多行：進場條件、分批倉位、機械止損與目標位...）"
      ></textarea>
      <button
        class="btn btn-hi"
        id="btnAddAlert">
        新增並同步雲端監控
      </button>
    </div>

    <div
      style="display:flex;
      justify-content:space-between;
      font-size:12px">
      <span
        id="alListCnt"
        style="font-weight:700">
        監控清單 (0)
      </span>
      <span
        id="alScanInfo"
        style="color:#34d399">
        雲端每2分鐘自動巡檢
      </span>
    </div>
    <div
      id="alListBox"
      style="display:flex;
      flex-direction:column;gap:6px">
    </div>
  </div>
</div>

<div
  class="modal-bg"
  id="trigModal">
  <div
    class="modal-box"
    style="border:2px solid #f97316;
    text-align:center">
    <div
      class="c-big"
      style="color:#facc15;
      font-size:18px">
      🔔 江恩到價作戰警報觸發！
    </div>
    <div
      id="trigSym"
      class="c-big">--</div>
    <div
      id="trigDetail"
      class="c-val">--</div>
    <div
      style="background:#1e2533;
      padding:10px;border-radius:8px;
      text-align:left">
      <div
        class="lbl"
        style="color:#fb923c">
        預寫交易作戰方案：
      </div>
      <div
        id="trigPlan"
        style="font-size:14px;
        font-weight:600;
        margin-top:4px;
        white-space:pre-wrap">--</div>
    </div>
    <button
      class="btn btn-hi"
      id="btnAckTrig">
      停止響鬧並執行計劃
    </button>
  </div>
</div>

function isIntraIv(iv) {
  return iv === "15m" ||
    iv === "30m" ||
    iv === "60m";
}

function ivTitle(iv) {
  if (iv === "15m") return "15分";
  if (iv === "30m") return "30分";
  if (iv === "60m") return "1時";
  if (iv === "1d") return "日線";
  if (iv === "1wk") return "週線";
  return "月線";
}

function unitNameOf(iv, tm) {
  if (iv === "15m") return "期(15m)";
  if (iv === "30m") return "期(30m)";
  if (iv === "60m") return "小時";
  if (iv === "1mo") return "月";
  if (iv === "1wk") return "週";
  return tm === "calendar"
    ? "自然日" : "日";
}

function barMinsOf(iv) {
  if (iv === "15m") return 15;
  if (iv === "30m") return 30;
  if (iv === "60m") return 60;
  return 1440;
}

function barTimeDelta(
  candles,
  fromIdx,
  toIdx,
  iv,
  tm
) {
  if (isIntraIv(iv) ||
    tm === "trading") {
    return toIdx - fromIdx;
  }
  const d1 = dateForIndex(
    candles,
    fromIdx,
    iv
  );
  const d2 = dateForIndex(
    candles,
    toIdx,
    iv
  );
  const calDays =
    (d2.getTime() - d1.getTime()) /
    86400000;
  if (iv === "1d") return calDays;
  if (iv === "1wk") {
    return calDays / 7.0;
  }
  return calDays / 30.4375;
}

function dateForIndex(
  candles,
  idx,
  iv
) {
  if (!candles.length) {
    return new Date();
  }
  const lastI = candles.length - 1;
  if (idx >= 0 && idx <= lastI) {
    return candles[idx].date;
  }
  const diff = idx - lastI;
  if (isIntraIv(iv)) {
    const mins = barMinsOf(iv);
    let cur = new Date(
      candles[lastI].date.getTime()
    );
    let left = Math.abs(diff);
    const dir = diff >= 0 ? 1 : -1;
    while (left > 0) {
      cur = new Date(
        cur.getTime() +
        dir * mins * 60000
      );
      const wd = cur.getDay();
      if (wd === 0 || wd === 6) {
        continue;
      }
      left -= 1;
    }
    return cur;
  }
  const step = iv === "1mo"
    ? 30.44
    : (iv === "1wk" ? 7.0 : 1.45);
  return addDays(
    candles[lastI].date,
    diff * step
  );
}

function fmt(v) {
  return Number(v).toFixed(2);
}

function fmtDate(d, withTime) {
  const y = d.getFullYear();
  const m = String(
    d.getMonth() + 1
  ).padStart(2, "0");
  const day = String(
    d.getDate()
  ).padStart(2, "0");
  if (!withTime) {
    return y + "-" + m + "-" + day;
  }
  const hh = String(
    d.getHours()
  ).padStart(2, "0");
  const mm = String(
    d.getMinutes()
  ).padStart(2, "0");
  return m + "-" + day +
    " " + hh + ":" + mm;
}

function addDays(d, days) {
  return new Date(
    d.getTime() + days * 86400000
  );
}

function normSym(raw, mkt) {
  let s = raw.trim().toUpperCase();
  if (!s) {
    return mkt === "hk"
      ? "^HSI" : "^IXIC";
  }
  if (
    s === "HSI" ||
    s === "HSCE" ||
    s === "IXIC" ||
    s === "GSPC" ||
    s === "DJI"
  ) {
    return "^" + s;
  }
  if (s === "BRK.B") s = "BRK-B";
  if (s === "BRK.A") s = "BRK-A";
  if (
    mkt === "hk" &&
    !s.endsWith(".HK") &&
    !s.startsWith("^")
  ) {
    const d = s.replace(/\D/g, "");
    if (d) {
      return d.padStart(4, "0") +
        ".HK";
    }
  }
  return s;
}

  if (iv === "15m") return "30d";
  if (iv === "30m") return "60d";
  if (iv === "60m") return "180d";
  if (iv === "1d") return "5y";
  if (iv === "1wk") return "15y";
  return "max";
}

function parseYahooObj(json, iv) {
  const res =
    json?.chart?.result?.[0];
  if (!res || !res.timestamp) {
    return null;
  }
  const ts = res.timestamp;
  const q = res.indicators.quote[0];
  const reg =
    res.meta?.currentTradingPeriod
      ?.regular;
  const rStart = reg?.start;
  const rEnd = reg?.end;
  const out = [];
  let idx = 0;
  for (let i = 0; i < ts.length; i++) {
    const o = q.open[i];
    const h = q.high[i];
    const l = q.low[i];
    const c = q.close[i];
    if (
      o == null || h == null ||
      l == null || c == null
    ) {
      continue;
    }
    if (
      isIntraIv(iv) &&
      typeof rStart === "number" &&
      typeof rEnd === "number"
    ) {
      const dm = ts[i] % 86400;
      const sm = rStart % 86400;
      const em = rEnd % 86400;
      if (sm < em &&
        (dm < sm || dm > em)) {
        continue;
      }
    }
    const v = Array.isArray(q.volume)
      ? (q.volume[i] || 0) : 0;
    out.push({
      id: idx++,
      date: new Date(ts[i] * 1000),
      open: o,
      high: h,
      low: l,
      close: c,
      volume: v
    });
  }
  const nm =
    res.meta?.shortName ||
    res.meta?.longName || "";
  return { name: nm, candles: out };
}

async function fetchSeries(sym, iv) {
  const rng = getRange(iv);
  const proxyUrl =
    "/.netlify/functions/yahoo" +
    "?symbol=" +
    encodeURIComponent(sym) +
    "&interval=" + iv +
    "&range=" + rng;

  try {
    const r = await fetch(proxyUrl);
    if (r.ok) {
      const src =
        r.headers.get("X-Source") ||
        "Cloud-OK";
      const j = await r.json();
      const parsed = parseYahooObj(
        j,
        iv
      );
      if (parsed &&
        parsed.candles.length >= 15) {
        return { ...parsed, src };
      }
    }
  } catch (e) {}

  const yhBase =
    "https://query1.finance" +
    ".yahoo.com/v8/finance/chart/" +
    encodeURIComponent(sym) +
    "?range=" + rng +
    "&interval=" + iv +
    "&includePrePost=false";
  const c1 =
    "https://api.allorigins.win" +
    "/raw?url=" +
    encodeURIComponent(yhBase);
  const r2 = await fetch(c1);
  const j2 = await r2.json();
  const p2 = parseYahooObj(j2, iv);
  if (p2 && p2.candles.length >= 15) {
    return {
      ...p2,
      src: "Backup-CORS"
    };
  }
  throw new Error("無法取得足夠報價");
}

async function searchCandidates(q) {
  const up = q.trim().toUpperCase();
  if (!up) return [];
  const res = [];
  const seen = new Set();
  for (const c of CATALOG) {
    if (
      c.s.toUpperCase().includes(up) ||
      c.n.toUpperCase().includes(up)
    ) {
      res.push(c);
      seen.add(c.s);
    }
  }
  try {
    const url =
      "/.netlify/functions/yahoo" +
      "?action=search&q=" +
      encodeURIComponent(q);
    const r = await fetch(url);
    if (r.ok) {
      const j = await r.json();
      const qs = j?.quotes || [];
      for (const qt of qs) {
        const sym = qt.symbol;
        if (!sym || seen.has(sym)) {
          continue;
        }
        const ex = (
          qt.exchDisp ||
          qt.exchange || "US"
        ).toUpperCase();
        const isHK =
          sym.endsWith(".HK") ||
          ex.includes("HKG");
        const isOtc =
          ex.includes("OTC") ||
          ex.includes("PNK");
        const tp =
          qt.quoteType === "ETF"
            ? "ETF"
            : (qt.quoteType === "INDEX"
              ? "指數" : "股票");
        res.push({
          s: sym,
          n: NAMES[sym] ||
            qt.shortname ||
            qt.longname || sym,
          ex: isHK
            ? "HKEX"
            : (isOtc ? "OTC" : ex),
          tp,
          m: isHK ? "hk" : "us",
          otc: isOtc
        });
        seen.add(sym);
      }
    }
  } catch (e) {}
  res.sort((a, b) =>
    (a.otc === b.otc)
      ? 0 : (a.otc ? 1 : -1)
  );
  return res.slice(0, 8);
}

    "codeInp"

    raw,

  );

    "acBox"
  ).style.display = "none";
  st.name = NAMES[sym] || "";
  st.customAnc = null;
  st.selBar = null;
  st.panOff = 0;
  savePrefs();
  showMsg("");
  document.getElementById(
    "loadBox"
  ).style.display = "flex";
  try {
    const data = await fetchSeries(
      sym,
      st.interval
    );
    if (myId !== st.reqId) return;
    st.candles = data.candles;
    if (st.interval === "1d") {
      st.dailyCandles = data.candles;
    } else if (isIntraIv(
      st.interval
    )) {
      try {
        const dRes = await fetchSeries(
          sym,
          "1d"
        );
        if (myId === st.reqId) {
          st.dailyCandles =
            dRes.candles;
        }
      } catch (e) {}
    }
    if (NAMES[sym]) {
      st.name = NAMES[sym];
    } else if (data.name) {
      st.name = data.name;
    }
    recordSaved(
      sym,
      st.name,
      st.market
    );
    savePrefs();
    document.getElementById(
      "srcTag"
    ).textContent = data.src;
    runAnalysis();
  } catch (err) {
    if (myId !== st.reqId) return;
    showMsg(
      "無法讀取 " + sym +
      "，請檢查代碼或網絡。"
    );
  }
  if (myId === st.reqId) {
    document.getElementById(
      "loadBox"
    ).style.display = "none";
  }
}

function detectSwings(candles, iv) {
  let hi = -Infinity;
  let lo = Infinity;
  for (const c of candles) {
    if (c.high > hi) hi = c.high;
    if (c.low < lo) lo = c.low;
  }
  const span = (hi - lo) /
    Math.max(0.01, lo);
  const minTh = isIntraIv(iv)
    ? 0.006 : 0.025;
  const maxTh = isIntraIv(iv)
    ? 0.045 : 0.12;
  const mult = isIntraIv(iv)
    ? 0.10 : 0.14;
  const th = Math.max(
    minTh,
    Math.min(maxTh, span * mult)
  );
  const pts = [];
  let mode = 0;
  let cHi = candles[0].high;
  let cHiI = 0;
  let cLo = candles[0].low;
  let cLoI = 0;

  for (const c of candles) {
    if (c.high > cHi) {
      cHi = c.high;
      cHiI = c.id;
    }
    if (c.low < cLo) {
      cLo = c.low;
      cLoI = c.id;
    }
    if (mode === 0) {
      const up = (c.high - cLo) /
        Math.max(0.001, cLo);
      const dn = (cHi - c.low) /
        Math.max(0.001, cHi);
      if (up >= th) {
        pts.push({
          index: cLoI,
          date: candles[cLoI].date,
          price: cLo,
          isHigh: false
        });
        mode = 1;
        cHi = c.high;
        cHiI = c.id;
      } else if (dn >= th) {
        pts.push({
          index: cHiI,
          date: candles[cHiI].date,
          price: cHi,
          isHigh: true
        });
        mode = -1;
        cLo = c.low;
        cLoI = c.id;
      }
    } else if (mode === 1) {
      const drop = (cHi - c.low) /
        Math.max(0.001, cHi);
      if (drop >= th) {
        pts.push({
          index: cHiI,
          date: candles[cHiI].date,
          price: cHi,
          isHigh: true
        });
        mode = -1;
        cLo = c.low;
        cLoI = c.id;
      }
    } else {
      const rise = (c.high - cLo) /
        Math.max(0.001, cLo);
      if (rise >= th) {
        pts.push({
          index: cLoI,
          date: candles[cLoI].date,
          price: cLo,
          isHigh: false
        });
        mode = 1;
        cHi = c.high;
        cHiI = c.id;
      }
    }
  }
  return pts;
}

function buildMechSwings(
  candles,
  order
) {
  if (candles.length < 3) return [];
  const active = [candles[0]];
  for (let i = 1; i < candles.length; i++) {
    const cur = candles[i];
    const prev =
      active[active.length - 1];
    const inside =
      cur.high <= prev.high &&
      cur.low >= prev.low;
    if (!inside) active.push(cur);
  }
  if (active.length < 3) return [];
  const res = [];
  let dir = 0;
  let upCnt = 0;
  let dnCnt = 0;
  let extH = active[0];
  let extL = active[0];

  for (let i = 1; i < active.length; i++) {
    const c = active[i];
    const p = active[i - 1];
    const hh = c.high > p.high;
    const ll = c.low < p.low;
    if (hh && !ll) {
      upCnt++;
      dnCnt = 0;
    } else if (ll && !hh) {
      dnCnt++;
      upCnt = 0;
    }
    if (dir === 0) {
      if (upCnt >= order) {
        res.push({
          index: extL.id,
          date: extL.date,
          price: extL.low,
          isHigh: false
        });
        dir = 1;
        extH = c;
      } else if (dnCnt >= order) {
        res.push({
          index: extH.id,
          date: extH.date,
          price: extH.high,
          isHigh: true
        });
        dir = -1;
        extL = c;
      } else {
        if (c.high > extH.high) {
          extH = c;
        }
        if (c.low < extL.low) {
          extL = c;
        }
      }
    } else if (dir === 1) {
      if (c.high >= extH.high) {
        extH = c;
      }
      if (dnCnt >= order) {
        res.push({
          index: extH.id,
          date: extH.date,
          price: extH.high,
          isHigh: true
        });
        dir = -1;
        extL = c;
      }
    } else {
      if (c.low <= extL.low) {
        extL = c;
      }
      if (upCnt >= order) {
        res.push({
          index: extL.id,
          date: extL.date,
          price: extL.low,
          isHigh: false
        });
        dir = 1;
        extH = c;
      }
    }
  }
  const tail = dir >= 0 ? extH : extL;
  if (!res.length ||
    res[res.length - 1].index !==
    tail.id) {
    res.push({
      index: tail.id,
      date: tail.date,
      price: dir >= 0
        ? tail.high : tail.low,
      isHigh: dir >= 0
    });
  }
  return res;
}

function calcMechStop(
  candles,
  mechSwings,
  isUp,
  iv
) {
  const last =
    candles[candles.length - 1];
  const defUp = isIntraIv(iv)
    ? 0.985 : 0.96;
  const defDn = isIntraIv(iv)
    ? 1.015 : 1.04;
  const defLbl = isIntraIv(iv)
    ? "日內1.5%窄幅硬性止損"
    : "江恩4%標準保護止損";
  let stUp = 0;
  let stDn = 0;
  for (
    let i = candles.length - 1;
    i > 0;
    i--
  ) {
    const c = candles[i];
    const p = candles[i - 1];
    if (c.high > p.high &&
      c.low >= p.low && stDn === 0) {
      stUp++;
    } else if (c.low < p.low &&
      c.high <= p.high && stUp === 0) {
      stDn++;
    } else {
      break;
    }
  }
  const mid = (last.high + last.low) / 2;
  if (isUp) {
    if (stUp >= 7) {
      return {
        price: last.low * 0.996,
        reason: "連續" + stUp +
          "期單邊(7期法則收緊止損)"
      };
    }
    const prevH = candles.length >= 2
      ? candles[candles.length - 2].high
      : last.high;
    if (last.high > prevH &&
      last.close < last.open &&
      last.close < mid) {
      return {
        price: last.low * 0.996,
        reason: "出現三重信號頂部(" +
          "破低即止盈離場)"
      };
    }
    for (
      let i = mechSwings.length - 1;
      i >= 0;
      i--
    ) {
      const s = mechSwings[i];
      if (!s.isHigh &&
        s.price < last.close) {
        return {
          price: s.price * 0.995,
          reason: "機械擺動底(" +
            fmtDate(
              s.date,
              isIntraIv(iv)
            ) + ")"
        };
      }
    }
    return {
      price: last.close * defUp,
      reason: defLbl
    };
  } else {
    if (stDn >= 7) {
      return {
        price: last.high * 1.004,
        reason: "連續" + stDn +
          "期單邊(7期法則收緊止損)"
      };
    }
    const prevL = candles.length >= 2
      ? candles[candles.length - 2].low
      : last.low;
    if (last.low < prevL &&
      last.close > last.open &&
      last.close > mid) {
      return {
        price: last.high * 1.004,
        reason: "出現三重信號底部(" +
          "升破即空單平倉)"
      };
    }
    for (
      let i = mechSwings.length - 1;
      i >= 0;
      i--
    ) {
      const s = mechSwings[i];
      if (s.isHigh &&
        s.price > last.close) {
        return {
          price: s.price * 1.005,
          reason: "機械擺動頂(" +
            fmtDate(
              s.date,
              isIntraIv(iv)
            ) + ")"
        };
      }
    }
    return {
      price: last.close * defDn,
      reason: defLbl
    };
  }
}

function calcOverbalance(
  candles,
  swings,
  isUp,
  iv,
  tm
) {
  if (swings.length < 4) {
    return "波段數據累積中，平衡正常";
  }
  const last =
    candles[candles.length - 1];
  const u = unitNameOf(iv, tm);
  let maxDrop = 0;
  let maxBars = 0;
  for (let i = 1; i < swings.length; i++) {
    const a = swings[i - 1];
    const b = swings[i];
    const dt = Math.abs(barTimeDelta(
      candles,
      a.index,
      b.index,
      iv,
      tm
    ));
    if (isUp && a.isHigh && !b.isHigh) {
      maxDrop = Math.max(
        maxDrop,
        a.price - b.price
      );
      maxBars = Math.max(maxBars, dt);
    } else if (!isUp &&
      !a.isHigh && b.isHigh) {
      maxDrop = Math.max(
        maxDrop,
        b.price - a.price
      );
      maxBars = Math.max(maxBars, dt);
    }
  }
  const tail =
    swings[swings.length - 1];
  if (!tail || maxDrop <= 0) {
    return "時空平衡維持正常";
  }
  const curDt = Math.abs(barTimeDelta(
    candles,
    tail.index,
    last.id,
    iv,
    tm
  ));
  const curDp = isUp
    ? Math.max(0, tail.price - last.low)
    : Math.max(0, last.high - tail.price);
  const pOver = curDp > maxDrop;
  const tOver = curDt > maxBars &&
    curDp > maxDrop * 0.5;
  if (pOver || tOver) {
    return "⚠️已觸發平衡超越！當前" +
      "回調" + fmt(curDp) + "(" +
      Math.round(curDt) + u +
      ")已超前浪極值" +
      fmt(maxDrop) + "(" +
      Math.round(maxBars) + u +
      ")，防範反轉";
  }
  return "平衡正常（前浪最大回調" +
    fmt(maxDrop) + " / " +
    Math.round(maxBars) + u +
    "，當前" + fmt(curDp) + " / " +
    Math.round(curDt) + u + "）";
}

function calcVolumeDiag(candles) {
  const valid = candles.filter(
    c => c.volume > 0
  );
  if (valid.length < 60) {
    return "指數/無成交量數據，略過量能";
  }
  const n = candles.length;
  let r50 = 0;
  for (let i = n - 50; i < n; i++) {
    r50 += candles[i].volume || 0;
  }
  let p50 = 0;
  for (
    let i = Math.max(0, n - 100);
    i < n - 50;
    i++
  ) {
    p50 += candles[i].volume || 0;
  }
  let maxV = 1;
  for (
    let i = Math.max(0, n - 250);
    i < n;
    i++
  ) {
    if (candles[i].volume > maxV) {
      maxV = candles[i].volume;
    }
  }
  const curV =
    candles[n - 1].volume || 0;
  const shrink = curV / maxV;
  const tags = [];
  if (p50 > 0) {
    const ratio = r50 / p50;
    if (ratio >= 2.0) {
      tags.push(
        "50期吸籌動量比 " +
        ratio.toFixed(2) +
        "x(>2.0主力顯著放量)"
      );
    } else {
      tags.push(
        "50期量能動量比 " +
        ratio.toFixed(2) + "x"
      );
    }
  }
  if (shrink > 0 && shrink <= 0.25) {
    tags.push(
      "當前成交量僅區間峰值" +
      Math.round(shrink * 100) +
      "%（符合「地量見地價」特徵）"
    );
  }
  return tags.join("；");
}

function calcDailyGuide(
  dailyCandles,
  iv,
  isUpFan
) {
  if (!isIntraIv(iv)) return "";
  if (dailyCandles.length < 20) {
    return "日線定方向：載入日線結構中";
  }
  const dSw = detectSwings(
    dailyCandles,
    "1d"
  );
  const dAnc = pickAnchor(
    dailyCandles,
    dSw,
    null,
    "auto"
  );
  const dUp = !dAnc.isHigh;
  const dVol = calcVolatility(
    dailyCandles,
    dAnc,
    dSw,
    "1d",
    "trading"
  );
  const lastD = dailyCandles[
    dailyCandles.length - 1
  ];
  const dt = lastD.id - dAnc.index;
  const sign = dUp ? 1 : -1;
  const p1x1 = Math.max(
    0,
    dAnc.price + sign * dVol * dt
  );
  const above = lastD.close >= p1x1;
  const dirTxt = above
    ? "日線多頭強勢(1x1上方)"
    : "日線空頭弱勢(1x1下方)";
  const align = (above === isUpFan)
    ? "順應日線主趨勢"
    : "⚠️逆日線主方向(僅作短線反抽)";
  return dirTxt + "｜" + align;
}

function pickAnchor(
  candles,
  swings,
  customIdx,
  dir
) {
  if (
    customIdx != null &&
    customIdx >= 0 &&
    customIdx < candles.length
  ) {
    const c = candles[customIdx];
    let isH = false;
    if (dir === "up") {
      isH = false;
    } else if (dir === "down") {
      isH = true;
    } else {
      const mid =
        (c.high + c.low) / 2;
      isH = c.close < mid;
    }
    return {
      index: customIdx,
      date: c.date,
      price: isH ? c.high : c.low,
      isHigh: isH
    };
  }
  const start = Math.max(
    0,
    candles.length - 160
  );
  const recent = swings.filter(
    s => s.index >= start &&
      s.index < candles.length - 5
  );
  if (dir === "up") {
    const lows = recent.filter(
      s => !s.isHigh
    );
    if (lows.length) {
      return lows[lows.length - 1];
    }
  } else if (dir === "down") {
    const highs = recent.filter(
      s => s.isHigh
    );
    if (highs.length) {
      return highs[highs.length - 1];
    }
  } else if (recent.length) {
    return recent[recent.length - 1];
  }
  let best = candles[start];
  for (
    let i = start;
    i < candles.length;
    i++
  ) {
    if (dir === "down") {
      if (candles[i].high >
        best.high) {
        best = candles[i];
      }
    } else {
      if (candles[i].low <
        best.low) {
        best = candles[i];
      }
    }
  }
  const isH = dir === "down";
  return {
    index: best.id,
    date: best.date,
    price: isH ? best.high : best.low,
    isHigh: isH
  };
}

function calcVolatility(
  candles,
  anchor,
  swings,
  iv,
  tm
) {
  const effTm = isIntraIv(iv)
    ? "trading" : tm;
  const after = swings.filter(
    s => s.index > anchor.index + 3
  );
  if (after.length) {
    const n = after[0];
    const dp = Math.abs(
      n.price - anchor.price
    );
    const dt = Math.abs(barTimeDelta(
      candles,
      anchor.index,
      n.index,
      iv,
      effTm
    ));
    return dp / Math.max(1, dt);
  }
  const last =
    candles[candles.length - 1];
  const dp = Math.abs(
    last.close - anchor.price
  );
  const dt = Math.abs(barTimeDelta(
    candles,
    anchor.index,
    last.id,
    iv,
    effTm
  ));
  return dp / Math.max(1, dt);
}

function buildRays(
  candles,
  anchor,
  isUp,
  vol,
  endIdx,
  iv,
  tm
) {
  const specs = [
    ["8x1", 8],
    ["4x1", 4],
    ["3x1", 3],
    ["2x1", 2],
    ["1x1", 1],
    ["1x2", 0.5],
    ["1x3", 1 / 3],
    ["1x4", 0.25],
    ["1x8", 0.125]
  ];
  const sign = isUp ? 1 : -1;
  const step = Math.max(
    1,
    Math.floor(
      (endIdx - anchor.index) / 60
    )
  );
  return specs.map(([name, r]) => {
    const pts = [];
    for (
      let i = anchor.index;
      i <= endIdx;
      i += step
    ) {
      const dt = barTimeDelta(
        candles,
        anchor.index,
        i,
        iv,
        tm
      );
      const p = anchor.price +
        sign * vol * r * dt;
      if (p >= 0) {
        pts.push({ i, p });
      }
    }
    const dtEnd = barTimeDelta(
      candles,
      anchor.index,
      endIdx,
      iv,
      tm
    );
    const pEnd = Math.max(
      0,
      anchor.price +
        sign * vol * r * dtEnd
    );
    if (!pts.length ||
      pts[pts.length - 1].i < endIdx) {
      pts.push({
        i: endIdx,
        p: pEnd
      });
    }
    return {
      name,
      ratio: r,
      primary: name === "1x1",
      pts
    };
  });
}

function moonEvent(d) {
  const syn = 29.53058867;
  const diff =
    (d.getTime() / 1000 -
      947182440) / 86400;
  let ph = diff % syn;
  if (ph < 0) ph += syn;
  if (ph <= 1 || ph >= syn - 1) {
    return "天文新月窗口";
  }
  if (Math.abs(ph - syn / 2) <= 1) {
    return "天文滿月窗口";
  }
  return null;
}

function solarTerm(d) {
  const m = d.getMonth() + 1;
  const day = d.getDate();
  const terms = [
    [2, 4, "立春節氣(45度)"],
    [3, 21, "春分節氣(0度)"],
    [5, 6, "立夏節氣(45度)"],
    [6, 21, "夏至節氣(90度)"],
    [8, 8, "立秋節氣(135度)"],
    [9, 23, "秋分節氣(180度)"],
    [11, 7, "立冬節氣(225度)"],
    [12, 22, "冬至節氣(270度)"]
  ];
  for (const [tm, td, nm] of terms) {
    if (m === tm &&
      Math.abs(day - td) <= 1) {
      return nm;
    }
  }
  return null;
}

function calcTimeHits(
  candles,
  anchor,
  swings,
  vol,
  horizon,
  iv,
  tm
) {
  const fibs = isIntraIv(iv)
    ? [5, 8, 13, 21, 34, 55, 89, 144]
    : [
      5, 8, 13, 21, 34,
      55, 89, 144, 233
    ];
  const gann = isIntraIv(iv)
    ? [
      7, 12, 14, 18, 21, 24, 28,
      30, 42, 45, 49, 60, 72, 90
    ]
    : [
      7, 14, 28, 30, 42, 45, 49, 60,
      77, 90, 120, 144, 180, 270, 360
    ];
  const lastI = candles.length - 1;
  const lastD = candles[lastI].date;
  const map = {};
  const majorSet = new Set();
  const unit = unitNameOf(iv, tm);
  const modeSfx =
    (!isIntraIv(iv) &&
      tm === "calendar")
      ? "(自然日)" : "";

  const mapBar = (baseI, cnt) => {
    if (isIntraIv(iv) ||
      tm === "trading") {
      return baseI + cnt;
    }
    const baseD = dateForIndex(
      candles,
      baseI,
      iv
    );
    const addD = cnt * (
      iv === "1d" ? 1.0 :
      (iv === "1wk" ? 7.0 : 30.4375)
    );
    const tD = addDays(baseD, addD);
    const diffD =
      (tD.getTime() -
        lastD.getTime()) / 86400000;
    const step = iv === "1mo"
      ? 30.44
      : (iv === "1wk" ? 7.0 : 1.45);
    return lastI +
      Math.round(diffD / step);
  };

  const add = (t, msg, isMaj) => {
    const d = t - lastI;
    if (d >= 1 && d <= horizon) {
      if (!map[t]) map[t] = [];
      map[t].push(msg);
      if (isMaj) majorSet.add(t);
    }
  };

  for (const f of fibs) {
    add(
      mapBar(anchor.index, f),
      "費波那契第" + f + unit,
      false
    );
  }
  for (const g of gann) {
    let note = "";
    if (iv === "60m" && g === 24) {
      note = "(360度日循環)";
    } else if (iv === "60m" &&
      g === 49) {
      note = "(7x7短線周期)";
    } else if (iv === "30m" &&
      g === 48) {
      note = "(24小時360度)";
    }
    const isMaj = isIntraIv(iv)
      ? [
        21, 24, 30, 49, 60, 90
      ].includes(g)
      : [
        90, 180, 270, 360
      ].includes(g);
    add(
      mapBar(anchor.index, g),
      "江恩神奇數" + g + unit + note,
      isMaj
    );
  }

  if (!isIntraIv(iv) && vol > 0) {
    const sqU = Math.round(
      anchor.price / vol
    );
    add(
      mapBar(anchor.index, sqU),
      "零度線時價成正方" + modeSfx,
      true
    );
  }

  if (swings.length >= 2 && vol > 0) {
    const prevSw =
      swings[swings.length - 2];
    if (prevSw.isHigh !==
      anchor.isHigh) {
      const pDiff = Math.abs(
        prevSw.price - anchor.price
      );
      const crU = Math.round(
        pDiff / (2.0 * vol)
      );
      const midB = Math.floor(
        (prevSw.index + anchor.index) /
        2
      );
      add(
        mapBar(midB, crU),
        "雙1x1角度線幾何交叉",
        true
      );
    }
  }

  if (!isIntraIv(iv)) {
    const safeEnd = Math.max(
      1,
      lastI - 4
    );
    let topBar = candles[0];
    let botBar = candles[0];
    for (let i = 0; i < safeEnd; i++) {
      if (candles[i].high >
        topBar.high) {
        topBar = candles[i];
      }
      if (candles[i].low <
        botBar.low) {
        botBar = candles[i];
      }
    }
    const circles = iv === "1mo"
      ? [60, 90, 120, 180, 240, 360]
      : [90, 180, 270, 360];
    for (const c of circles) {
      let note = "";
      if (iv === "1wk" && c === 180) {
        note = "(約3.5年)";
      } else if (iv === "1wk" &&
        c === 360) {
        note = "(約7年)";
      } else if (iv === "1mo" &&
        c === 120) {
        note = "(10年周期)";
      } else if (iv === "1mo" &&
        c === 360) {
        note = "(30年土星)";
      }
      add(
        mapBar(topBar.id, c),
        "歷史大頂滿" + c + unit + note,
        true
      );
      add(
        mapBar(botBar.id, c),
        "歷史大底滿" + c + unit + note,
        true
      );
    }
  }

  const lastSw =
    swings[swings.length - 1];
  if (lastSw &&
    lastSw.index !== anchor.index) {
    const subN = isIntraIv(iv)
      ? [7, 12, 18, 21, 30]
      : [8, 13, 21, 34, 55];
    for (const f of subN) {
      add(
        mapBar(lastSw.index, f),
        "次波段第" + f + unit,
        false
      );
    }
  }

  if (iv === "1d") {
    for (let d = 1; d <= horizon; d++) {
      const est = addDays(
        lastD,
        d * 1.45
      );
      const m = moonEvent(est);
      if (m) add(lastI + d, m, false);
      const sterm = solarTerm(est);
      if (sterm) {
        add(lastI + d, sterm, false);
      }
    }
  }

  const hits = [];
  const keys = Object.keys(map)
    .map(Number)
    .sort((a, b) => a - b);
  for (const k of keys) {
    const rs = map[k];
    const isMaj = majorSet.has(k);
    const hasKey = rs.some(
      x => x.includes("18") ||
        x.includes("21") ||
        x.includes("30") ||
        x.includes("49") ||
        x.includes("55") ||
        x.includes("89") ||
        x.includes("90") ||
        x.includes("144") ||
        x.includes("180") ||
        x.includes("360") ||
        x.includes("正方") ||
        x.includes("交叉")
    );
    if (isMaj ||
      rs.length >= 2 || hasKey) {
      hits.push({
        targetIndex: k,
        estDate: dateForIndex(
          candles,
          k,
          iv
        ),
        reasons: rs,
        strength: rs.length,
        isMajor: isMaj
      });
    }
  }
  return hits;
}

function calcFibs(candles, swings) {
  const sub = candles.slice(-260);
  let hi = -Infinity;
  let lo = Infinity;
  for (const c of sub) {
    if (c.high > hi) hi = c.high;
    if (c.low < lo) lo = c.low;
  }
  const span = hi - lo;
  const ratios = [
    0.236, 0.382, 0.5,
    0.618, 0.786, 1.272
  ];
  const minor = [];
  if (swings.length >= 2) {
    const a =
      swings[swings.length - 2];
    const b =
      swings[swings.length - 1];
    const mHi = Math.max(
      a.price,
      b.price
    );
    const mLo = Math.min(
      a.price,
      b.price
    );
    for (const r of ratios) {
      minor.push(
        mHi - (mHi - mLo) * r
      );
    }
  }
  return ratios.map(r => {
    const p = hi - span * r;
    const conf = minor.some(
      m => Math.abs(m - p) /
        Math.max(1, p) < 0.018
    );
    return {
      ratio: r,
      label: "黃金" +
        Math.round(r * 1000),
      price: p,
      conf
    };
  });
}

function calcGannPct(candles) {
  const sub = candles.slice(-260);
  let hi = -Infinity;
  let lo = Infinity;
  for (const c of sub) {
    if (c.high > hi) hi = c.high;
    if (c.low < lo) lo = c.low;
  }
  const span = hi - lo;
  const gm = Math.sqrt(
    Math.max(0.01, hi * lo)
  );
  const specs = [
    [0.125, "1/8(12.5%)", false],
    [0.250, "2/8(25%)", true],
    [1 / 3, "1/3(33.3%)", true],
    [0.375, "3/8(37.5%)", false],
    [0.500, "4/8(50%中軸)", true],
    [0.625, "5/8(62.5%)", false],
    [2 / 3, "2/3(66.7%)", true],
    [0.750, "6/8(75%)", true],
    [0.875, "7/8(87.5%)", false],
    [1.125, "延伸112.5%", false],
    [4 / 3, "延伸133.3%", false],
    [5 / 3, "延伸166.7%", false],
    [2.000, "延伸200%", false]
  ];
  const levels = specs.map(
    ([r, lbl, maj]) => ({
      ratio: r,
      label: lbl,
      price: lo + span * r,
      isMajor: maj
    })
  );
  return { levels, gm };
}

function checkCompletedValid(
  candles,
  dIdx,
  isBull,
  xPrice,
  przLo,
  przHi
) {
  const start = dIdx + 1;
  if (start >= candles.length) {
    return { ok: true, active: true };
  }
  let brokeAt = -1;
  if (isBull) {
    const floor = Math.min(
      przLo * 0.985,
      xPrice * 0.99
    );
    for (
      let i = start;
      i < candles.length;
      i++
    ) {
      if (candles[i].low < floor) {
        brokeAt = i;
        break;
      }
    }
  } else {
    const ceil = Math.max(
      przHi * 1.015,
      xPrice * 1.01
    );
    for (
      let i = start;
      i < candles.length;
      i++
    ) {
      if (candles[i].high > ceil) {
        brokeAt = i;
        break;
      }
    }
  }
  if (brokeAt === -1) {
    return { ok: true, active: true };
  }
  const held = brokeAt - dIdx;
  return {
    ok: held >= 4,
    active: false
  };
}

function evalCompleted(
  x,
  a,
  b,
  c,
  d,
  candles,
  isBack
) {
  const isBull = !x.isHigh && a.isHigh;
  if (isBull) {
    const ok = a.isHigh &&
      !b.isHigh && c.isHigh &&
      !d.isHigh && a.price > c.price &&
      c.price > b.price &&
      b.price > d.price;
    if (!ok) return null;
  } else {
    const ok = !a.isHigh &&
      b.isHigh && !c.isHigh &&
      d.isHigh && a.price < c.price &&
      c.price < b.price &&
      b.price < d.price;
    if (!ok) return null;
  }
  const xa = Math.abs(
    a.price - x.price
  );
  const ab = Math.abs(
    b.price - a.price
  );
  const bc = Math.abs(
    c.price - b.price
  );
  const ad = Math.abs(
    d.price - a.price
  );
  if (xa <= 0 || ab <= 0 ||
    bc <= 0) {
    return null;
  }
  const abR = ab / xa;
  const adR = ad / xa;
  let name = "";
  if (
    abR >= 0.35 && abR <= 0.54 &&
    adR >= 0.82 && adR <= 0.94
  ) {
    name = isBull
      ? "看漲蝙蝠形態"
      : "看跌蝙蝠形態";
  } else if (
    abR >= 0.55 && abR <= 0.68 &&
    adR >= 0.73 && adR <= 0.84
  ) {
    name = isBull
      ? "看漲伽利222"
      : "看跌伽利222";
  } else {
    const cd = Math.abs(
      d.price - c.price
    );
    if (cd / ab >= 0.88 &&
      cd / ab <= 1.35) {
      name = isBull
        ? "看漲ABCD形態"
        : "看跌ABCD形態";
    }
  }
  if (!name) return null;
  const przLo = d.price * 0.985;
  const przHi = d.price * 1.015;
  const chk = checkCompletedValid(
    candles,
    d.index,
    isBull,
    x.price,
    przLo,
    przHi
  );
  if (!chk.ok) return null;

  const fullName = isBack
    ? name + "(回溯)" : name;
  return {
    active: chk.active,
    pat: {
      name: fullName,
      isBull,
      done: true,
      nodes: [
        { l: "X", ...x },
        { l: "A", ...a },
        { l: "B", ...b },
        { l: "C", ...c },
        { l: "D", ...d }
      ],
      przLo,
      przHi,
      dIdx: d.index,
      dDate: d.date
    }
  };
}

function projectXABC(
  x,
  a,
  b,
  c,
  candles,
  lastI,
  lastD,
  stepDays
) {
  const xa = Math.abs(
    a.price - x.price
  );
  const ab = Math.abs(
    b.price - a.price
  );
  if (xa <= 0 || ab <= 0) {
    return null;
  }
  const abR = ab / xa;
  const isBull = !x.isHigh && a.isHigh;
  let name = "";
  let bcR = 1.272;
  if (abR >= 0.35 && abR <= 0.54) {
    name = isBull
      ? "潛在看漲蝙蝠222"
      : "潛在看跌蝙蝠222";
    bcR = 1.618;
  } else if (
    abR >= 0.55 && abR <= 0.72
  ) {
    name = isBull
      ? "潛在看漲伽利222"
      : "潛在看跌伽利222";
    bcR = 1.272;
  } else {
    name = isBull
      ? "潛在看漲ABCD"
      : "潛在看跌ABCD";
    bcR = 1.272;
  }

  let dP = 0;
  let ext1618 = 0;
  if (isBull) {
    const cb = c.price - b.price;
    if (!a.isHigh || b.isHigh ||
      !c.isHigh || cb <= 0) {
      return null;
    }
    dP = c.price - bcR * cb;
    ext1618 = c.price - 1.618 * cb;
    if (dP <= 0 ||
      a.price <= c.price ||
      c.price <= b.price ||
      b.price <= dP) {
      return null;
    }
  } else {
    const bc = b.price - c.price;
    if (a.isHigh || !b.isHigh ||
      c.isHigh || bc <= 0) {
      return null;
    }
    dP = c.price + bcR * bc;
    ext1618 = c.price + 1.618 * bc;
    if (a.price >= c.price ||
      c.price >= b.price ||
      b.price >= dP) {
      return null;
    }
  }

  const przLo = dP * 0.985;
  const przHi = dP * 1.015;
  for (
    let i = c.index + 1;
    i < candles.length;
    i++
  ) {
    const bar = candles[i];
    if (isBull) {
      const floor = Math.min(
        przLo,
        ext1618
      );
      if (bar.low < floor ||
        bar.low < x.price ||
        bar.high > c.price) {
        return null;
      }
    } else {
      const ceil = Math.max(
        przHi,
        ext1618
      );
      if (bar.low < b.price ||
        bar.low < c.price ||
        bar.high > ceil ||
        bar.high > x.price) {
        return null;
      }
    }
  }

  const abBars = Math.max(
    3,
    b.index - a.index
  );
  const tIdx = Math.max(
    lastI + 1,
    c.index + abBars
  );
  const estD = addDays(
    lastD,
    (tIdx - lastI) * stepDays
  );
  const dNode = {
    index: tIdx,
    date: estD,
    price: dP,
    isHigh: !isBull
  };
  return {
    name,
    isBull,
    done: false,
    nodes: [
      { l: "X", ...x },
      { l: "A", ...a },
      { l: "B", ...b },
      { l: "C", ...c },
      { l: "D", ...dNode }
    ],
    przLo,
    przHi,
    dIdx: tIdx,
    dDate: estD
  };
}

function detectHarmonics(
  candles,
  swings,
  iv
) {
  const n = swings.length;
  if (n < 4 || !candles.length) {
    return null;
  }
  const lastI = candles.length - 1;
  const lastD = candles[lastI].date;
  const step = iv === "1mo"
    ? 30.44
    : (iv === "1wk"
      ? 7.0
      : (isIntraIv(iv) ? 0.08 : 1.45));
  const maxShift = Math.min(
    18,
    n - 4
  );
  let fallback = null;

  for (
    let shift = 0;
    shift <= maxShift;
    shift++
  ) {
    const endPos = n - 1 - shift;
    const isBack = shift > 0;
    if (endPos >= 4) {
      const hit = evalCompleted(
        swings[endPos - 4],
        swings[endPos - 3],
        swings[endPos - 2],
        swings[endPos - 1],
        swings[endPos],
        candles,
        isBack
      );
      if (hit) {
        if (hit.active) {
          return hit.pat;
        }
        if (!fallback) {
          fallback = hit.pat;
        }
      }
    }
    if (shift === 0) {
      const proj = projectXABC(
        swings[n - 4],
        swings[n - 3],
        swings[n - 2],
        swings[n - 1],
        candles,
        lastI,
        lastD,
        step
      );
      if (proj) return proj;
    }
  }
  return fallback;
}

function runAnalysis() {
  if (st.candles.length < 20) return;
  const effTm = isIntraIv(
    st.interval
  ) ? "trading" : st.timeMode;
  const swings = detectSwings(
    st.candles,
    st.interval
  );
  const mechSwings = buildMechSwings(
    st.candles,
    2
  );
  const anchor = pickAnchor(
    st.candles,
    swings,
    st.customAnc,
    st.dir
  );
  let isUp = !anchor.isHigh;
  if (st.dir === "up") isUp = true;
  if (st.dir === "down") isUp = false;
  const baseVol = calcVolatility(
    st.candles,
    anchor,
    swings,
    st.interval,
    effTm
  );
  const vol = Math.max(
    0.0001,
    baseVol * st.volMult
  );
  const lastI =
    st.candles.length - 1;
  const endI = lastI + st.horizon;
  const rays = buildRays(
    st.candles,
    anchor,
    isUp,
    vol,
    endI,
    st.interval,
    effTm
  );
  const hits = calcTimeHits(
    st.candles,
    anchor,
    swings,
    vol,
    st.horizon,
    st.interval,
    effTm
  );
  const fibs = calcFibs(
    st.candles,
    swings
  );
  const pctObj = calcGannPct(
    st.candles
  );
  const harm = detectHarmonics(
    st.candles,
    swings,
    st.interval
  );
  const stopInfo = calcMechStop(
    st.candles,
    mechSwings,
    isUp,
    st.interval
  );
  const obMsg = calcOverbalance(
    st.candles,
    swings,
    isUp,
    st.interval,
    effTm
  );
  const volMsg = calcVolumeDiag(
    st.candles
  );
  const dailyHint = calcDailyGuide(
    st.dailyCandles,
    st.interval,
    isUp
  );
  st.res = {
    anchor,
    isUp,
    vol,
    rays,
    hits,
    fibs,
    pcts: pctObj.levels,
    gm: pctObj.gm,
    harm,
    mechSwings,
    stopInfo,
    obMsg,
    volMsg,
    dailyHint,
    effTm
  };
  updateCards();
  drawChart();
}

function getVisRange() {
  const lastH = Math.max(
    0,
    st.candles.length - 1
  );
  const maxE = lastH + st.horizon;
  const winL =
    st.histBars + st.horizon;
  const endB = Math.max(
    Math.min(maxE, winL),
    maxE - st.panOff
  );
  const startB = Math.max(
    0,
    endB - winL
  );
  const endH = Math.min(endB, lastH);
  return {
    startB,
    endH,
    endB,
    maxE,
    winL
  };
}

function maxPanLimit() {
  const lastH = Math.max(
    0,
    st.candles.length - 1
  );
  const maxE = lastH + st.horizon;
  const winL =
    st.histBars + st.horizon;
  return Math.max(0, maxE - winL);
}

function focusHarmonic() {
  const h = st.res?.harm;
  if (!h || !h.nodes.length) return;
  const xI = h.nodes[0].index;
  const dI = h.dIdx;
  const span = Math.max(
    10,
    dI - xI
  );
  if (span + 24 > st.histBars) {
    st.histBars = Math.min(
      360,
      span + 30
    );
  }
  const mid = Math.floor(
    (xI + dI) / 2
  );
  const lastH = Math.max(
    0,
    st.candles.length - 1
  );
  const maxE = lastH + st.horizon;
  const winL =
    st.histBars + st.horizon;
  const desiredE =
    mid + Math.floor(winL / 2);
  const rawPan = maxE - desiredE;
  st.panOff = Math.max(
    0,
    Math.min(maxPanLimit(), rawPan)
  );
  if (dI >= 0 && dI <= maxE) {
    st.selBar = dI;
  }
  savePrefs();
  drawChart();
}

function priceAtBar(bar) {
  if (!st.candles.length) return 0;
  if (bar >= 0 &&
    bar < st.candles.length) {
    return st.candles[bar].close;
  }
  if (st.res) {
    const dt = barTimeDelta(
      st.candles,
      st.res.anchor.index,
      bar,
      st.interval,
      st.res.effTm
    );
    const s = st.res.isUp ? 1 : -1;
    return Math.max(
      0,
      st.res.anchor.price +
        s * st.res.vol * dt
    );
  }
  return st.candles[
    st.candles.length - 1
  ].close;
}

function fullDateAtBar(bar) {
  if (!st.candles.length) {
    return "--";
  }
  const d = dateForIndex(
    st.candles,
    bar,
    st.interval
  );
  return fmtDate(
    d,
    isIntraIv(st.interval)
  );
}

function shortDateAtBar(bar) {
  const full = fullDateAtBar(bar);
  if (isIntraIv(st.interval)) {
    return full;
  }
  if (full.length < 10) return full;
  return st.interval === "1mo"
    ? full.slice(0, 7)
    : full.slice(5);
}

function fmtAxisP(p) {
  if (p >= 10000) {
    return p.toFixed(0);
  }
  if (p >= 1000) {
    return p.toFixed(1);
  }
  return p.toFixed(2);
}

function drawRounded(
  ctx,
  x,
  y,
  w,
  h,
  r
) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(
    x + w, y, x + w, y + r
  );
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(
    x + w, y + h, x + w - r, y + h
  );
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(
    x, y + h, x, y + h - r
  );
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(
    x, y, x + r, y
  );
  ctx.closePath();
}

function drawChart() {
  const cv = document.getElementById(
    "cv"
  );
  const dpr =
    window.devicePixelRatio || 1;
  const rect =
    cv.getBoundingClientRect();
  cv.width = rect.width * dpr;
  cv.height = rect.height * dpr;
  const ctx = cv.getContext("2d");
  ctx.scale(dpr, dpr);
  const W = rect.width;
  const H = rect.height;
  ctx.clearRect(0, 0, W, H);
  if (!st.candles.length) return;

  const rightW = 58;
  const botH = 30;
  const plotW = Math.max(
    1,
    W - rightW
  );
  const plotH = Math.max(
    1,
    H - botH
  );

  const lastH =
    st.candles.length - 1;
  const vr = getVisRange();
  const startB = vr.startB;
  const endB = vr.endB;

  document.getElementById(
    "btnHistBack"
  ).style.display =
    startB > 0
      ? "inline-block" : "none";
  const hasPan = st.panOff > 0;
  document.getElementById(
    "btnHistFwd"
  ).style.display =
    hasPan
      ? "inline-block" : "none";
  document.getElementById(
    "btnLatest"
  ).style.display =
    hasPan
      ? "inline-block" : "none";

  let minP = Infinity;
  let maxP = -Infinity;
  for (
    let i = startB;
    i <= vr.endH;
    i++
  ) {
    if (st.candles[i].low < minP) {
      minP = st.candles[i].low;
    }
    if (st.candles[i].high > maxP) {
      maxP = st.candles[i].high;
    }
  }
  if (st.panOff === 0 && st.res) {
    const r1 = st.res.rays.find(
      x => x.primary
    );
    const lp =
      r1.pts[r1.pts.length - 1].p;
    if (lp > 0 && lp < maxP * 2.2) {
      maxP = Math.max(maxP, lp);
      minP = Math.min(minP, lp);
    }
  }
  if (st.showHarm &&
    st.res?.harm) {
    const hm = st.res.harm;
    const xI = hm.nodes[0].index;
    if (hm.dIdx >= startB &&
      xI <= endB) {
      for (const nd of hm.nodes) {
        minP = Math.min(
          minP,
          nd.price
        );
        maxP = Math.max(
          maxP,
          nd.price
        );
      }
      minP = Math.min(
        minP,
        hm.przLo
      );
      maxP = Math.max(
        maxP,
        hm.przHi
      );
    }
  }
  if (maxP <= minP) maxP = minP + 1;
  const pad = (maxP - minP) * 0.08;
  minP = Math.max(0, minP - pad);
  maxP += pad;

  const spanB = Math.max(
    1,
    endB - startB
  );
  const xOf = b =>
    ((b - startB) / spanB) *
      (plotW - 14) + 7;
  const yOf = p =>
    plotH -
    ((p - minP) / (maxP - minP)) *
      (plotH - 18) - 9;

  ctx.strokeStyle =
    "rgba(255,255,255,0.08)";
  ctx.lineWidth = 0.8;
  ctx.fillStyle = "#94a3b8";
  ctx.font = "10px sans-serif";
  ctx.textAlign = "center";
  for (let i = 0; i <= 4; i++) {
    const ratio = i / 4;
    const p = minP +
      (maxP - minP) * ratio;
    const y = plotH -
      ratio * (plotH - 18) - 9;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(plotW, y);
    ctx.stroke();
    ctx.fillText(
      fmtAxisP(p),
      plotW + rightW / 2,
      y + 3
    );
  }

  for (let i = 0; i <= 4; i++) {
    const b = startB +
      Math.floor((spanB * i) / 4);
    const x = xOf(b);
    if (i > 0 && i < 4) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, plotH);
      ctx.stroke();
    }
    if (x >= 24 && x <= plotW - 24) {
      ctx.fillText(
        shortDateAtBar(b),
        x,
        plotH + 18
      );
    }
  }

  ctx.strokeStyle =
    "rgba(255,255,255,0.22)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, plotH);
  ctx.lineTo(plotW, plotH);
  ctx.moveTo(plotW, 0);
  ctx.lineTo(plotW, plotH);
  ctx.stroke();

  if (lastH >= startB &&
    lastH <= endB) {
    const xNow = xOf(lastH);
    ctx.fillStyle =
      "rgba(59,130,246,0.09)";
    ctx.fillRect(
      xNow,
      0,
      Math.max(0, plotW - xNow),
      plotH
    );
    ctx.strokeStyle =
      "rgba(255,255,255,0.35)";
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(xNow, 0);
    ctx.lineTo(xNow, plotH);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  if (st.res) {
    if (st.showGrid) {
      for (const lv of st.res.pcts) {
        if (lv.price < minP ||
          lv.price > maxP) {
          continue;
        }
        const y = yOf(lv.price);
        const is50 =
          Math.abs(lv.ratio - 0.5) <
          0.01;
        ctx.strokeStyle = is50
          ? "rgba(250,204,21,0.6)"
          : (lv.isMajor
            ? "rgba(99,102,241,0.5)"
            : "rgba(99,102,241,0.22)");
        ctx.lineWidth =
          is50 ? 1.4 : 0.8;
        ctx.setLineDash(
          is50 ? [6, 3] : [2, 4]
        );
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(plotW, y);
        ctx.stroke();
        if (lv.isMajor) {
          ctx.fillStyle =
            ctx.strokeStyle;
          ctx.textAlign = "left";
          ctx.font =
            "10px sans-serif";
          ctx.fillText(
            lv.label,
            6,
            y - 3
          );
        }
      }
      ctx.setLineDash([]);
    }

    if (st.showFib) {
      for (const f of st.res.fibs) {
        if (f.price < minP ||
          f.price > maxP) {
          continue;
        }
        const y = yOf(f.price);
        ctx.strokeStyle = f.conf
          ? "rgba(192,132,252,0.8)"
          : "rgba(148,163,184,0.3)";
        ctx.lineWidth =
          f.conf ? 1.5 : 0.8;
        ctx.setLineDash([3, 3]);
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(plotW, y);
        ctx.stroke();
      }
      ctx.setLineDash([]);
    }

    for (const h of st.res.hits) {
      if (h.targetIndex < startB ||
        h.targetIndex > endB) {
        continue;
      }
      const x = xOf(h.targetIndex);
      const col = h.isMajor
        ? "#f472b6"
        : (h.strength >= 2
          ? "#fb923c"
          : "rgba(250,204,21,0.5)");
      ctx.strokeStyle = col;
      ctx.lineWidth =
        h.isMajor ? 2 : 1.2;
      ctx.setLineDash(
        h.isMajor ? [] : [5, 3]
      );
      ctx.beginPath();
      ctx.moveTo(x, 14);
      ctx.lineTo(x, plotH);
      ctx.stroke();
      ctx.fillStyle = col;
      ctx.textAlign = "center";
      ctx.font = "10px sans-serif";
      const tag = h.isMajor
        ? (isIntraIv(st.interval)
          ? "◎共振" : "◎大周期")
        : (h.strength >= 2
          ? "★轉勢" : "轉");
      ctx.fillText(tag, x, 11);
    }
    ctx.setLineDash([]);

    if (st.showHarm &&
      st.res.harm) {
      const hm = st.res.harm;
      const pts = hm.nodes.map(
        n => ({
          x: xOf(n.index),
          y: yOf(n.price),
          l: n.l,
          idx: n.index
        })
      );
      ctx.fillStyle = hm.isBull
        ? "rgba(52,211,153,0.16)"
        : "rgba(244,114,182,0.16)";
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      ctx.lineTo(pts[1].x, pts[1].y);
      ctx.lineTo(pts[2].x, pts[2].y);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(pts[2].x, pts[2].y);
      ctx.lineTo(pts[3].x, pts[3].y);
      ctx.lineTo(pts[4].x, pts[4].y);
      ctx.closePath();
      ctx.fill();

      const col = hm.isBull
        ? "#34d399" : "#f472b6";
      ctx.strokeStyle = col;
      ctx.lineWidth = 1.6;
      ctx.setLineDash(
        hm.done ? [] : [4, 3]
      );
      ctx.beginPath();
      pts.forEach((p, idx) => {
        if (idx === 0) {
          ctx.moveTo(p.x, p.y);
        } else {
          ctx.lineTo(p.x, p.y);
        }
      });
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = col;
      ctx.textAlign = "center";
      ctx.font = "bold 11px sans-serif";
      for (const p of pts) {
        if (p.idx >= startB &&
          p.idx <= endB) {
          ctx.fillText(
            p.l,
            p.x,
            p.y - 8
          );
        }
      }
    }

    if (st.showSwing &&
      st.res.mechSwings?.length >= 2) {
      ctx.strokeStyle =
        "rgba(250,204,21,0.85)";
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      st.res.mechSwings.forEach(
        (s, idx) => {
          const sx = xOf(s.index);
          const sy = yOf(s.price);
          if (idx === 0) {
            ctx.moveTo(sx, sy);
          } else {
            ctx.lineTo(sx, sy);
          }
        }
      );
      ctx.stroke();
      for (const s of
        st.res.mechSwings) {
        if (s.index >= startB &&
          s.index <= endB) {
          ctx.fillStyle = s.isHigh
            ? "#fb923c" : "#34d399";
          ctx.beginPath();
          ctx.arc(
            xOf(s.index),
            yOf(s.price),
            3,
            0,
            Math.PI * 2
          );
          ctx.fill();
        }
      }
    }

    for (const ray of st.res.rays) {
      if (ray.pts.length < 2) {
        continue;
      }
      const is1 = ray.primary;
      const is2 =
        ray.name === "2x1" ||
        ray.name === "1x2";
      const col = is1
        ? "#facc15"
        : (is2
          ? "rgba(56,189,248,0.75)"
          : "rgba(45,212,191,0.32)");
      ctx.strokeStyle = col;
      ctx.lineWidth =
        is1 ? 2.1 : 1.0;
      ctx.beginPath();
      ray.pts.forEach((pt, idx) => {
        const x = xOf(pt.i);
        const y = yOf(pt.p);
        if (idx === 0) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
      });
      ctx.stroke();
      const lp =
        ray.pts[ray.pts.length - 1];
      if (lp.i >= startB &&
        lp.i <= endB &&
        lp.p >= minP &&
        lp.p <= maxP) {
        ctx.fillStyle = col;
        ctx.textAlign = "right";
        ctx.font = "10px sans-serif";
        ctx.fillText(
          ray.name,
          plotW - 4,
          yOf(lp.p)
        );
      }
    }
  }

  const drawEnd = Math.min(
    endB,
    lastH
  );
  const stepW = plotW / spanB;
  const bw = Math.max(
    2,
    Math.min(10, stepW * 0.65)
  );
  if (st.style === "line") {
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    for (
      let i = startB;
      i <= drawEnd;
      i++
    ) {
      const x = xOf(i);
      const y = yOf(
        st.candles[i].close
      );
      if (i === startB) {
        ctx.moveTo(x, y);
      } else {
        ctx.lineTo(x, y);
      }
    }
    ctx.stroke();
  } else {
    for (
      let i = startB;
      i <= drawEnd;
      i++
    ) {
      const c = st.candles[i];
      const x = xOf(i);
      const up = c.close >= c.open;
      const col = up
        ? "#22c55e" : "#ef4444";
      ctx.strokeStyle = col;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, yOf(c.high));
      ctx.lineTo(x, yOf(c.low));
      ctx.stroke();
      const yO = yOf(c.open);
      const yC = yOf(c.close);
      ctx.fillStyle = col;
      ctx.fillRect(
        x - bw / 2,
        Math.min(yO, yC),
        bw,
        Math.max(
          1.5,
          Math.abs(yC - yO)
        )
      );
    }
  }

  if (st.res) {
    const a = st.res.anchor;
    if (a.index >= startB &&
      a.index <= endB) {
      const ax = xOf(a.index);
      const ay = yOf(a.price);
      ctx.fillStyle = "#facc15";
      ctx.beginPath();
      ctx.arc(
        ax,
        ay,
        5,
        0,
        Math.PI * 2
      );
      ctx.fill();
      ctx.textAlign = "center";
      ctx.font = "bold 11px sans-serif";
      ctx.fillText(
        "起點",
        ax,
        ay + 15
      );
    }
  }

  const rawAct =
    st.selBar != null
      ? st.selBar : lastH;
  const actB = Math.max(
    startB,
    Math.min(endB, rawAct)
  );
  const actX = xOf(actB);
  const actP = priceAtBar(actB);
  const isFut = actB > lastH;
  const pinCol = isFut
    ? "#fb923c" : "#38bdf8";

  ctx.strokeStyle = pinCol;
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(actX, 0);
  ctx.lineTo(actX, plotH);
  ctx.stroke();

  if (actP >= minP &&
    actP <= maxP) {
    const actY = yOf(actP);
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(0, actY);
    ctx.lineTo(plotW, actY);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = pinCol;
    ctx.beginPath();
    ctx.arc(
      actX,
      actY,
      4,
      0,
      Math.PI * 2
    );
    ctx.fill();

    const pLbl = fmtAxisP(actP);
    const py = Math.max(
      11,
      Math.min(plotH - 11, actY)
    );
    drawRounded(
      ctx,
      plotW + 3,
      py - 9,
      rightW - 6,
      18,
      4
    );
    ctx.fillStyle = pinCol;
    ctx.fill();
    ctx.fillStyle = "#000";
    ctx.font = "bold 10px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(
      pLbl,
      plotW + rightW / 2,
      py + 3.5
    );
  }

  const dFull = fullDateAtBar(actB);
  const pillW = isIntraIv(
    st.interval
  ) ? 132 : 122;
  const pillH = 22;
  const px = Math.max(
    pillW / 2 + 2,
    Math.min(
      plotW - pillW / 2 - 2,
      actX
    )
  );
  const py = plotH + 4;
  st.pillBox = {
    x: px - pillW / 2,
    y: py,
    w: pillW,
    h: pillH
  };

  drawRounded(
    ctx,
    st.pillBox.x,
    st.pillBox.y,
    pillW,
    pillH,
    5
  );
  ctx.fillStyle = pinCol;
  ctx.fill();
  ctx.fillStyle = "#000";
  ctx.font = "bold 10px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(
    "◀ " + dFull + " ▶",
    px,
    py + 14.5
  );

  updateHud(actB, dFull);
}

function updateHud(idx, dFull) {
  const lastI =
    st.candles.length - 1;
  const head = st.name
    ? st.code + " " + st.name + " | "
    : st.code + " | ";
  const pTxt = idx <= lastI
    ? "收 " +
      fmt(st.candles[idx].close)
    : "未來+" + (idx - lastI) +
      unitNameOf(
        st.interval,
        st.res?.effTm || "trading"
      );
  let gTxt = "";
  if (st.res) {
    const dt = barTimeDelta(
      st.candles,
      st.res.anchor.index,
      idx,
      st.interval,
      st.res.effTm
    );
    const s = st.res.isUp ? 1 : -1;
    const p1 = Math.max(
      0,
      st.res.anchor.price +
        s * st.res.vol * dt
    );
    gTxt = " | 1x1:" + fmt(p1);
  }
  document.getElementById(
    "hudTxt"
  ).textContent =
    head + dFull + " " + pTxt + gTxt;
}

function unlockWebAudio() {
  try {
    const Ctx =
      window.AudioContext ||
      window.webkitAudioContext;
    if (!Ctx) return null;
    if (!st.audioCtx) {
      st.audioCtx = new Ctx();
    }
    if (st.audioCtx.state ===
      "suspended") {
      st.audioCtx.resume();
    }
    return st.audioCtx;
  } catch (e) {
    return null;
  }
}

function reqSystemNotifyPerm() {
  try {
    if ("Notification" in window &&
      Notification.permission ===
      "default") {
      Notification.requestPermission();
    }
  } catch (e) {}
}

function pushSystemNotify(hit) {
  try {
    if (!("Notification" in window) ||
      Notification.permission !==
      "granted") {
      return;
    }
    const pStr = fmt(
      hit.triggeredPrice ??
      hit.targetPrice
    );
    const title =
      "🔔 " + hit.symbol +
      " 到價 " + pStr;
    const body =
      "已" + hit.condition + " " +
      fmt(hit.targetPrice) +
      "\n方案：" + hit.planNote;
    const n = new Notification(
      title,
      {
        body,
        requireInteraction: true
      }
    );
    n.onclick = () => {
      window.focus();
      n.close();
    };
  } catch (e) {}
}

function playWebAlarm() {
  try {
    const ctx = unlockWebAudio();
    if (!ctx) return;
    const now = ctx.currentTime;
    const tone = st.ringTone || "alarm";
    let freqs = [880, 1175, 880, 1175];
    let wave = "triangle";
    let step = 0.16;
    if (tone === "bell") {
      freqs = [1046.5, 1318.5, 1568, 2093];
      wave = "sine";
      step = 0.22;
    } else if (tone === "electronic") {
      freqs = [1400, 950, 1400, 950];
      wave = "sawtooth";
      step = 0.13;
    } else if (tone === "minuet") {
      freqs = [523.25, 659.25, 783.99, 1046.5];
      wave = "sine";
      step = 0.26;
    }
    for (let i = 0; i < freqs.length; i++) {
      const osc =
        ctx.createOscillator();
      const gain =
        ctx.createGain();
      osc.type = wave;
      osc.frequency.setValueAtTime(
        freqs[i],
        now + i * step
      );
      gain.gain.setValueAtTime(
        tone === "electronic" ? 0.18 : 0.28,
        now + i * step
      );
      gain.gain.exponentialRampToValueAtTime(
        0.001,
        now + i * step + step * 0.92
      );
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + i * step);
      osc.stop(now + i * step + step);
    }
  } catch (e) {}
}

function initBgWorker() {
  try {

      "postMessage('tick'),30000);";

          "application/javascript"
      }
    );
    const url =
      URL.createObjectURL(blob);
    st.bgWorker = new Worker(url);
    st.bgWorker.onmessage = () => {
      pollWebAlerts();
    };
  } catch (e) {
    setInterval(
      pollWebAlerts,
      30000
    );
  }
}

async function pollWebAlerts() {
  const active = st.alerts.filter(
    a => a.isEnabled && !a.isTriggered
  );
  if (!active.length) return;
  try {
    await syncAlertsCloud();
    const r = await fetch(
      "/.netlify/functions/yahoo" +
      "?action=check_alerts"
    );
    if (!r.ok) return;
    const j = await r.json();
    if (Array.isArray(j.alerts)) {
      st.alerts = j.alerts;
      localStorage.setItem(
        ALERT_KEY,
        JSON.stringify(st.alerts)
      );
      updateAlertBadge();
      if (document.getElementById(
        "alertModal"
      ).style.display === "flex") {
        renderAlertList();
      }
    }
    if (Array.isArray(j.triggered) &&
      j.triggered.length > 0) {
      const hit = j.triggered[0];
      document.getElementById(
        "trigSym"
      ).textContent =
        hit.symbol + " " +
        (hit.name || "");
      document.getElementById(
        "trigDetail"
      ).textContent =
        "已" + hit.condition + " " +
        fmt(hit.targetPrice) +
        "（觸發價：" +
        fmt(
          hit.triggeredPrice ??
          hit.targetPrice
        ) + "）";
      document.getElementById(
        "trigPlan"
      ).textContent = hit.planNote;
      document.getElementById(
        "trigModal"
      ).style.display = "flex";
      startWebRingLoop();
      pushSystemNotify(hit);
    }
  } catch (e) {}
}

function ensureBarVisible(bar) {
  const maxP = maxPanLimit();
  const vr = getVisRange();
  if (bar < vr.startB) {
    st.panOff = Math.min(
      maxP,
      st.panOff + (vr.startB - bar)
    );
  } else if (bar > vr.endB) {
    st.panOff = Math.max(
      0,
      st.panOff - (bar - vr.endB)
    );
  }
}

function stepBar(delta) {
  if (!st.candles.length) return;
  const lastH =
    st.candles.length - 1;
  const maxE = lastH + st.horizon;
  const cur =
    st.selBar != null
      ? st.selBar : lastH;
  const next = Math.max(
    0,
    Math.min(maxE, cur + delta)
  );
  st.selBar = next;
  ensureBarVisible(next);
  document.getElementById(
    "btnSetAnc"
  ).style.display = next <= lastH
    ? "inline-block" : "none";
  drawChart();
}

  };

  const cv = document.getElementById(
    "cv"
  );
  let dragMode = null;
  let dragStartX = 0;
  let dragBasePan = 0;
  let moved = false;

  const barFromX = (x, W) => {
    const rightW = 58;
    const plotW = Math.max(
      1,
      W - rightW
    );
    const vr = getVisRange();
    const span = Math.max(
      1,
      vr.endB - vr.startB
    );
    const r = (x - 7) / (plotW - 14);
    const b = vr.startB +
      Math.round(r * span);
    return Math.max(
      vr.startB,
      Math.min(vr.endB, b)
    );
  };

  cv.addEventListener(
    "pointerdown",
    e => {
      if (!st.candles.length) return;
      const rect =
        cv.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      moved = false;
      dragStartX = x;

      const pb = st.pillBox;
      if (pb &&
        x >= pb.x - 6 &&
        x <= pb.x + pb.w + 6 &&
        y >= pb.y - 6 &&
        y <= pb.y + pb.h + 6) {
        if (x < pb.x + 28) {
          stepBar(-1);
          return;
        }
        if (x > pb.x + pb.w - 28) {
          stepBar(1);
          return;
        }
        dragMode = "line";
        cv.setPointerCapture(
          e.pointerId
        );
        return;
      }

      const inBotAxis =
        y >= rect.height - 42;
      if (st.moveLine || inBotAxis) {
        dragMode = "line";
        const b = barFromX(
          x,
          rect.width
        );
        st.selBar = b;
        document.getElementById(
          "btnSetAnc"
        ).style.display =
          b < st.candles.length
            ? "inline-block" : "none";
        drawChart();
      } else {
        dragMode = "pan";
        dragBasePan = st.panOff;
      }
      cv.setPointerCapture(
        e.pointerId
      );
    }
  );

  cv.addEventListener(
    "pointermove",
    e => {
      if (!dragMode) return;
      const rect =
        cv.getBoundingClientRect();
      const x = e.clientX - rect.left;
      if (Math.abs(x - dragStartX) > 3) {
        moved = true;
      }
      if (dragMode === "line") {
        const plotW = Math.max(
          1,
          rect.width - 58
        );
        if (x < 24) {
          st.panOff = Math.min(
            maxPanLimit(),
            st.panOff + 2
          );
        } else if (x > plotW - 24 &&
          st.panOff > 0) {
          st.panOff = Math.max(
            0,
            st.panOff - 2
          );
        }
        const b = barFromX(
          x,
          rect.width
        );
        st.selBar = b;
        document.getElementById(
          "btnSetAnc"
        ).style.display =
          b < st.candles.length
            ? "inline-block" : "none";
        drawChart();
      } else if (dragMode === "pan") {
        const vr = getVisRange();
        const span = Math.max(
          1,
          vr.endB - vr.startB
        );
        const usable = Math.max(
          1,
          rect.width - 58
        );
        const dx = x - dragStartX;
        const dBars = Math.round(
          (dx / usable) * span
        );
        st.panOff = Math.max(
          0,
          Math.min(
            maxPanLimit(),
            dragBasePan + dBars
          )
        );
        drawChart();
      }
    }
  );

  cv.addEventListener(
    "pointerup",
    e => {
      if (dragMode === "pan" &&
        !moved) {
        const rect =
          cv.getBoundingClientRect();
        const b = barFromX(
          e.clientX - rect.left,
          rect.width
        );
        st.selBar = b;
        document.getElementById(
          "btnSetAnc"
        ).style.display =
          b < st.candles.length
            ? "inline-block" : "none";
        drawChart();
      }
      dragMode = null;
    }
  );

  window.addEventListener(
    "resize",
    drawChart
  );
}

restoreState();
loadAlertsLocal();
fillPresets();
initEvents();
loadSymbol();
initBgWorker();
</script>
</body>
</html>
