<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width,
    initial-scale=1.0">
<meta
  name="theme-color"
  content="#0b0d12">
<title>江恩時空共振與和諧分析</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  background: #090b10;
  color: #f1f5f9;
  font-family: -apple-system,
    BlinkMacSystemFont,
    "Segoe UI", sans-serif;
  padding: 10px;
}
.app {
  max-width: 1440px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  background: #141821;
  padding: 8px 10px;
  border-radius: 10px;
  border: 1px solid #242b38;
}
.seg {
  display: inline-flex;
  background: #0b0d12;
  border-radius: 7px;
  padding: 2px;
  border: 1px solid #283040;
}
.seg button {
  background: transparent;
  color: #94a3b8;
  border: none;
  padding: 5px 8px;
  font-size: 12px;
  border-radius: 5px;
  cursor: pointer;
}
.seg button.on {
  background: #2563eb;
  color: #fff;
  font-weight: 600;
}
.btn {
  background: #1e2533;
  color: #e2e8f0;
  border: 1px solid #334155;
  padding: 5px 8px;
  font-size: 12px;
  border-radius: 6px;
  cursor: pointer;
}
.btn:hover {
  background: #2a3447;
}
.btn.on {
  background: #0f766e;
  border-color: #14b8a6;
  color: #fff;
}
.btn-hi {
  background: #ea580c;
  border-color: #f97316;
  color: #fff;
  font-weight: 600;
}
.btn-y {
  color: #facc15;
  border-color: #854d0e;
}
.btn-c {
  color: #38bdf8;
  border-color: #075985;
}
.btn-m {
  color: #34d399;
  border-color: #065f46;
}
.btn-del {
  color: #f87171;
  border-color: #7f1d1d;
  padding: 5px 7px;
}
.ac-wrap {
  position: relative;
  display: inline-block;
}
.ac-box {
  position: absolute;
  top: 100%;
  left: 0;
  margin-top: 4px;
  width: 295px;
  max-height: 280px;
  overflow-y: auto;
  background: #181e29;
  border: 1px solid #38bdf8;
  border-radius: 8px;
  box-shadow: 0 8px 24px #000;
  z-index: 99;
  display: none;
}
.ac-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  padding: 7px 9px;
  border-bottom: 1px solid #242b38;
  cursor: pointer;
  font-size: 12px;
}
.ac-item:hover {
  background: #253042;
}
.ac-sym {
  font-weight: 700;
  color: #facc15;
  min-width: 62px;
}
.ac-nm {
  color: #f1f5f9;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ac-bdg {
  font-size: 10px;
  padding: 2px 5px;
  border-radius: 4px;
  background: #064e3b;
  color: #34d399;
  white-space: nowrap;
}
.ac-otc {
  background: #27272a;
  color: #a1a1aa;
}
input, select {
  background: #0b0d12;
  color: #fff;
  border: 1px solid #334155;
  padding: 5px 8px;
  border-radius: 6px;
  font-size: 13px;
}
input {
  width: 106px;
  text-transform: uppercase;
}
select {
  max-width: 150px;
}
.lbl {
  font-size: 12px;
  color: #94a3b8;
}
.src-tag {
  font-size: 11px;
  color: #34d399;
  background: #064e3b;
  padding: 2px 7px;
  border-radius: 5px;
}
.sp {
  flex: 1;
}
.err {
  background: #7f1d1d;
  color: #fecaca;
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 12px;
  display: none;
}
.warn {
  background: #78350f;
  color: #fde68a;
}
.main {
  display: grid;
  grid-template-columns: 1.68fr 1fr;
  gap: 10px;
  min-height: 76vh;
}
@media (max-width: 860px) {
  .main {
    grid-template-columns: 1fr;
  }
}
.chart-box {
  background: #12161f;
  border: 1px solid #242b38;
  border-radius: 12px;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-height: 480px;
}
.hud {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
  font-size: 12px;
}
.hud-txt {
  color: #f8fafc;
  font-weight: 500;
}
.c-wrap {
  position: relative;
  flex: 1;
  min-height: 420px;
  touch-action: none;
}
canvas {
  width: 100%;
  height: 100%;
  display: block;
  border-radius: 8px;
  cursor: crosshair;
}
.load {
  position: absolute;
  inset: 0;
  background: rgba(9, 11, 16, 0.78);
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  color: #38bdf8;
  border-radius: 8px;
}
.side {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 82vh;
  overflow-y: auto;
}
.card {
  background: #141821;
  border: 1px solid #242b38;
  border-radius: 12px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.c-hd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-weight: 700;
  font-size: 14px;
}
.c-org { color: #fb923c; }
.c-mnt { color: #34d399; }
.c-yel { color: #facc15; }
.c-pnk {
  color: #f472b6;
  font-size: 12px;
  font-weight: 700;
}
.c-cyn {
  color: #38bdf8;
  font-size: 12px;
  font-weight: 700;
}
.c-big {
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  line-height: 1.45;
}
.c-sub {
  font-size: 12px;
  color: #fde047;
}
.c-val {
  font-size: 13px;
  color: #38bdf8;
}
.rep {
  font-size: 13px;
  line-height: 1.55;
  color: #e2e8f0;
  white-space: pre-wrap;
}
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.78);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
  padding: 12px;
}
.modal-box {
  background: #141821;
  border: 1px solid #334155;
  border-radius: 14px;
  width: 100%;
  max-width: 460px;
  max-height: 88vh;
  overflow-y: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.al-row {
  background: #1e2533;
  border-radius: 8px;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="seg" id="mktSeg">
      <button
        data-v="us">美股</button>
      <button
        class="on"
        data-v="hk">港股</button>
    </div>
    <button
      class="btn btn-y"
      id="btnHsi">恒指</button>
    <button
      class="btn btn-c"
      id="btnIxic">納指</button>
    <select id="presetSel">
      <option value="">自選紀錄</option>
    </select>
    <button
      class="btn btn-del"
      id="btnDelSaved"
      title="從自選移除目前標的">
      刪
    </button>
    <button
      class="btn btn-y"
      id="btnAlerts">🔔 到價</button>
    <div class="ac-wrap">
      <input
        id="codeInp"
        value="^HSI"
        autocomplete="off"
        placeholder="代碼/名稱">
      <div
        class="ac-box"
        id="acBox"></div>
    </div>
    <button
      class="btn btn-hi"
      id="btnGo">分析</button>
    <span
      class="src-tag"
      id="srcTag">線路就緒</span>
    <div class="sp"></div>
    <div class="seg" id="stySeg">
      <button
        class="on"
        data-v="candle">陰陽燭</button>
      <button
        data-v="line">折線圖</button>
    </div>
    <div class="seg" id="intSeg">
      <button
        data-v="15m">15分</button>
      <button
        data-v="30m">30分</button>
      <button
        data-v="60m">1時</button>
      <button
        data-v="1d">日線</button>
      <button
        class="on"
        data-v="1wk">週線</button>
      <button
        data-v="1mo">月線</button>
    </div>
  </div>

  <div class="bar">
    <span class="lbl">延伸:</span>
    <div class="seg" id="horSeg">
      <button
        data-v="30">30期</button>
      <button
        class="on"
        data-v="60">60期</button>
      <button
        data-v="90">90期</button>
      <button
        data-v="120">120期</button>
      <button
        data-v="252">252期</button>
    </div>
    <span class="lbl">方向:</span>
    <div class="seg" id="dirSeg">
      <button
        class="on"
        data-v="auto">自動</button>
      <button
        data-v="up">向上</button>
      <button
        data-v="down">向下</button>
    </div>
    <div class="seg" id="tModeSeg">
      <button
        class="on"
        data-v="trading">交易日</button>
      <button
        data-v="calendar">自然日</button>
    </div>
    <button
      class="btn on"
      id="togSwing">擺動線</button>
    <button
      class="btn on"
      id="togGrid">八分網格</button>
    <button
      class="btn"
      id="togFib">黃金位</button>
    <button
      class="btn on"
      id="togHarm">和諧形態</button>
    <div class="sp"></div>
    <span
      class="lbl"
      id="volLbl">波動:1.0x</span>
    <button
      class="btn"
      id="volDn">-</button>
    <button
      class="btn"
      id="volUp">+</button>
  </div>

  <div class="err" id="errBox"></div>

  <div class="main">
    <div class="chart-box">
      <div class="hud">
        <span
          class="hud-txt"
          id="hudTxt">載入中...</span>
        <div class="sp"></div>
        <button
          class="btn on"
          id="btnLocHarm"
          style="display:none">
          定位形態
        </button>
        <button
          class="btn btn-m"
          id="btnHistBack"
          style="display:none">
          ◀ 向前
        </button>
        <button
          class="btn btn-m"
          id="btnHistFwd"
          style="display:none">
          向後 ▶
        </button>
        <button
          class="btn btn-hi"
          id="btnLatest"
          style="display:none">
          回最新
        </button>
        <button
          class="btn btn-hi"
          id="btnMode">移動時間線</button>
        <button
          class="btn btn-c"
          id="btnZoomIn">+</button>
        <button
          class="btn btn-c"
          id="btnZoomOut">-</button>
        <button
          class="btn btn-hi"
          id="btnSetAnc"
          style="display:none">
          設為起點
        </button>
        <button
          class="btn btn-y"
          id="btnAutoAnc">自動起點</button>
      </div>
      <div
        class="c-wrap"
        id="cWrap">
        <canvas id="cv"></canvas>
        <div
          class="load"
          id="loadBox">
          切換線路抓取報價中...
        </div>
      </div>
    </div>

    <div class="side">
      <div class="card">
        <div class="c-hd c-org">
          <span id="turnCardTitle">
            大級別圓周與轉勢窗口
          </span>
        </div>
        <div
          class="c-cyn"
          id="dailyHintBadge"
          style="display:none">--</div>
        <div
          class="c-pnk"
          id="turnBadge"
          style="display:none">
          ◎ 命中核心時空共振
        </div>
        <div
          class="c-big"
          id="turnDate">--</div>
        <div
          class="c-sub"
          id="turnWhy">--</div>
        <div
          class="c-val"
          id="turnPrice">--</div>
      </div>

      <div class="card">
        <div class="c-hd c-mnt">
          <span>和諧交易形態推演</span>
        </div>
        <div
          class="c-cyn"
          id="harmBadge"
          style="display:none">
          ◎ 已自動向前推移鎖定歷史形態
        </div>
        <div
          class="c-big"
          id="harmName">--</div>
        <div
          class="c-sub"
          id="harmDate">--</div>
        <div
          class="c-val"
          id="harmPrz">--</div>
      </div>

      <div class="card">
        <div class="c-hd c-yel">
          <span id="repTitle">
            江恩策略建議
          </span>
          <button
            class="btn"
            id="btnCopy">複製報告</button>
        </div>
        <div
          class="rep"
          id="repBody">載入中...</div>
      </div>
    </div>
  </div>
</div>

<div
  class="modal-bg"
  id="alertModal">
  <div class="modal-box">
    <div class="c-hd c-org">
      <span>🔔 江恩到價作戰計劃與響鬧</span>
      <div style="display:flex;gap:5px">
        <button
          class="btn btn-y"
          id="btnTestRing">測鈴聲</button>
        <button
          class="btn"
          id="btnCloseAlert">關閉</button>
      </div>
    </div>

    <div
      style="background:#1e2533;
      padding:8px;border-radius:8px;
      display:flex;flex-direction:column;
      gap:6px">
      <div
        class="lbl"
        style="color:#38bdf8">
        iPhone 鎖屏背景響鬧（填入免費 Bark App Key）：
      </div>
      <div style="display:flex;gap:6px">
        <input
          id="barkKeyInp"
          style="flex:1;
          text-transform:none"
          placeholder="貼上 iPhone Bark Key">
        <button
          class="btn on"
          id="btnSaveBark">儲存Key</button>
      </div>
    </div>

    <div
      style="background:#1e2533;
      padding:10px;border-radius:8px;
      display:flex;flex-direction:column;
      gap:7px">
      <div
        style="display:flex;
        justify-content:space-between;
        font-size:13px">
        <span
          id="alCurSym"
          style="color:#facc15;
          font-weight:700">--</span>
        <span
          id="alCurP"
          style="color:#38bdf8">--</span>
      </div>
      <div style="display:flex;gap:6px">
        <select
          id="alCondSel"
          style="width:110px">
          <option value="向下跌破">
            向下跌破
          </option>
          <option value="向上突破">
            向上突破
          </option>
        </select>
        <input
          id="alTargetInp"
          type="number"
          step="0.01"
          style="flex:1;
          text-transform:none"
          placeholder="目標價位">
      </div>
      <div
        id="alQuickFill"
        style="display:flex;
        flex-wrap:wrap;gap:5px">
      </div>
      <input
        id="alNoteInp"
        style="width:100%;
        text-transform:none"
        placeholder="預寫交易方案（例：守穩分批建倉20%，止損設於...）">
      <button
        class="btn btn-hi"
        id="btnAddAlert">
        新增並同步雲端監控
      </button>
    </div>

    <div
      style="display:flex;
      justify-content:space-between;
      font-size:12px">
      <span
        id="alListCnt"
        style="font-weight:700">
        監控清單 (0)
      </span>
      <span
        id="alScanInfo"
        style="color:#34d399">
        雲端每2分鐘自動巡檢
      </span>
    </div>
    <div
      id="alListBox"
      style="display:flex;
      flex-direction:column;gap:6px">
    </div>
  </div>
</div>

<div
  class="modal-bg"
  id="trigModal">
  <div
    class="modal-box"
    style="border:2px solid #f97316;
    text-align:center">
    <div
      class="c-big"
      style="color:#facc15;
      font-size:18px">
      🔔 江恩到價作戰警報觸發！
    </div>
    <div
      id="trigSym"
      class="c-big">--</div>
    <div
      id="trigDetail"
      class="c-val">--</div>
    <div
      style="background:#1e2533;
      padding:10px;border-radius:8px;
      text-align:left">
      <div
        class="lbl"
        style="color:#fb923c">
        預寫交易作戰方案：
      </div>
      <div
        id="trigPlan"
        style="font-size:14px;
        font-weight:600;
        margin-top:4px">--</div>
    </div>
    <button
      class="btn btn-hi"
      id="btnAckTrig">
      停止響鬧並執行計劃
    </button>
  </div>
</div>

function playWebAlarm() {
  try {
    const Ctx =
      window.AudioContext ||
      window.webkitAudioContext;
    const ctx = new Ctx();
    const now = ctx.currentTime;
    for (let i = 0; i < 4; i++) {
      const osc =
        ctx.createOscillator();
      const gain =
        ctx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(
        i % 2 === 0 ? 880 : 1175,
        now + i * 0.16
      );
      gain.gain.setValueAtTime(
        0.25,
        now + i * 0.16
      );
      gain.gain.exponentialRampToValueAtTime(
        0.001,
        now + i * 0.16 + 0.14
      );
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + i * 0.16);
      osc.stop(now + i * 0.16 + 0.15);
    }
  } catch (e) {}
}

function startWebRingLoop() {
  clearInterval(st.ringTimer);
  playWebAlarm();
  st.ringTimer = setInterval(
    playWebAlarm,
    2200
  );
}

function loadAlertsLocal() {

    try {
      st.alerts = JSON.parse(raw);
    } catch (e) {
      st.alerts = [];
    }
  }
  updateAlertBtnBadge();
}

async function syncAlertsCloud() {
  try {
    localStorage.setItem(
      BARK_KEY,
      st.barkKey
    );
    localStorage.setItem(
      ALERT_KEY,
      JSON.stringify(st.alerts)
    );
  } catch (e) {}
  updateAlertBtnBadge();
  try {
    await fetch(
      "/.netlify/functions/yahoo" +
      "?action=sync_alerts",
      {
        method: "POST",
        headers: {
          "Content-Type":
            "application/json"
        },
        body: JSON.stringify({
          barkKey: st.barkKey,
          alerts: st.alerts
        })
      }
    );
  } catch (e) {}
}

function openAlertModal() {
  const cs = st.candles;
  const curP = cs.length > 0
    ? cs[cs.length - 1].close : 0;
  const titleF = st.name
    ? st.code + " " + st.name
    : st.code;
  document.getElementById(
    "alCurSym"
  ).textContent = "標的：" + titleF;
  document.getElementById(
    "alCurP"
  ).textContent =
    "現價：" + fmt(curP);
  document.getElementById(
    "barkKeyInp"
  ).value = st.barkKey;
  const tInp = document.getElementById(
    "alTargetInp"
  );
  if (curP > 0) {
    tInp.value = fmt(curP);
  }

  const qBox = document.getElementById(
    "alQuickFill"
  );
  qBox.innerHTML = "";
  const addFillBtn = (lbl, val) => {
    if (!val || val <= 0) return;
    const btn =
      document.createElement("button");
    btn.className = "btn btn-c";
    btn.style.fontSize = "11px";
    btn.textContent =
      lbl + "(" + fmt(val) + ")";
    btn.onclick = () => {
      tInp.value = fmt(val);
      document.getElementById(
        "alCondSel"
      ).value = val >= curP
        ? "向上突破" : "向下跌破";
    };
    qBox.appendChild(btn);
  };

  if (st.res && cs.length > 0) {
    const r = st.res;
    const last = cs[cs.length - 1];
    const dt = barTimeDelta(
      cs,
      r.anc.index,
      last.id,
      st.interval,
      r.effMode
    );
    const s = r.isUp ? 1 : -1;
    const p1 = Math.max(
      0,
      r.anc.price + s * r.vol * dt
    );
    addFillBtn("1x1主線", p1);
    if (r.harm) {
      const hd =
        (r.harm.przLo + r.harm.przHi) /
        2;
      addFillBtn("和諧D點", hd);
    }
  }
  renderAlertList();
  document.getElementById(
    "alertModal"
  ).style.display = "flex";
}

    return;
  }
  for (const it of st.alerts) {
    const row =
      document.createElement("div");
    row.className = "al-row";
    const stTxt = it.isTriggered
      ? "已觸發"
      : (it.isEnabled
        ? "監控中" : "已停用");
    const stCol = it.isTriggered
      ? "#fb923c"
      : (it.isEnabled
        ? "#34d399" : "#94a3b8");

    const top =
      document.createElement("div");
    top.style.display = "flex";
    top.style.alignItems = "center";
    top.style.gap = "6px";

    const symSp =
      document.createElement("span");
    symSp.style.color = "#facc15";
    symSp.style.fontWeight = "700";
    symSp.style.fontSize = "12px";
    symSp.textContent =
      it.symbol + " " + it.name;

    const condSp =
      document.createElement("span");
    condSp.style.color = "#38bdf8";
    condSp.style.fontSize = "12px";
    condSp.textContent =
      it.condition + " " +
      fmt(it.targetPrice);

    const sp =
      document.createElement("div");
    sp.className = "sp";

    const tag =
      document.createElement("span");
    tag.style.color = stCol;
    tag.style.fontSize = "11px";

    const delB =

    delB.onclick = () => {
      st.alerts = st.alerts.filter(

    top.appendChild(symSp);
    top.appendChild(condSp);

    top.appendChild(tag);
    top.appendChild(delB);

      document.createElement("div");
    note.style.fontSize = "12px";

    note.textContent =
      "方案：" + it.planNote;

    row.appendChild(top);
    row.appendChild(note);
    box.appendChild(row);
  }
}

async function pollWebAlerts() {
  const active = st.alerts.filter(
    a => a.isEnabled && !a.isTriggered
  );
  if (active.length === 0) return;
  try {
    await syncAlertsCloud();
    const r = await fetch(
      "/.netlify/functions/yahoo" +
      "?action=check_alerts"
    );
    if (!r.ok) return;
    const j = await r.json();
    if (Array.isArray(j.triggered) &&
      j.triggered.length > 0) {
      const hit = j.triggered[0];
      if (Array.isArray(j.alerts)) {
        st.alerts = j.alerts;
        syncAlertsCloud();
      }
      document.getElementById(
        "trigSym"
      ).textContent =
        hit.symbol + " " + hit.name;
      document.getElementById(
        "trigDetail"
      ).textContent =
        "已" + hit.condition + " " +
        fmt(hit.targetPrice) +
        "（觸發價：" +
        fmt(hit.triggeredPrice) +
        "）";
      document.getElementById(
        "trigPlan"
      ).textContent = hit.planNote;
      document.getElementById(
        "trigModal"
      ).style.display = "flex";
      startWebRingLoop();
    }
  } catch (e) {}
}

    );

  };
  document.getElementById(
    "btnZoomOut"
  ).onclick = () => {

      360,
      st.histBars + 30
    );
    savePrefs();
    drawChart();
  };

  document.getElementById(
    "btnSetAnc"
  ).onclick = () => {

  };
  document.getElementById(
    "btnAutoAnc"
  ).onclick = () => {
    st.customAnc = null;
    st.selBar = null;
    runAnalysis();
  };

  document.getElementById(
    "btnCopy"
  ).onclick = () => {
    if (!st.res) return;
    navigator.clipboard.writeText(
      st.res.report
    );
    const b = document.getElementById(
      "btnCopy"
    );
    b.textContent = "已複製";
    setTimeout(() => {
      b.textContent = "複製報告";
    }, 1500);
  };

  const cv =
    document.getElementById("cv");
  let dragging = false;
  let moved = false;
  let dragAxis = false;
  let downX = 0;
  let basePan = 0;

  const barAt = clientX => {
    const rect =
      cv.getBoundingClientRect();
    const x = clientX - rect.left;
    const {
      startB,
      endB
    } = getVisRange();
    const span = Math.max(
      1,
      endB - startB
    );
    const useW = Math.max(
      1,
      rect.width - 58 - 12
    );
    const r = (x - 6) / useW;
    const off = Math.round(r * span);
    return Math.max(
      startB,
      Math.min(endB, startB + off)
    );
  };

  const checkPillBtn = (x, y) => {
    const b = st.pillBox;
    if (!b) return 0;
    if (y < b.y - 6 ||
      y > b.y + b.h + 6) {
      return 0;
    }
    if (x >= b.x - 4 &&
      x <= b.x + b.btnW + 2) {
      return -1;
    }
    if (x >= b.x + b.w - b.btnW - 2 &&
      x <= b.x + b.w + 4) {
      return 1;
    }
    return 0;
  };

  cv.onpointerdown = e => {
    const rect =
      cv.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const stepDir = checkPillBtn(x, y);
    if (stepDir !== 0) {
      stepBar(stepDir);
      return;
    }
    dragging = true;
    moved = false;
    dragAxis = y >= rect.height - 40;
    downX = e.clientX;
    basePan = st.panOff;
    cv.setPointerCapture(e.pointerId);
    if (st.moveLine || dragAxis) {
      st.selBar = barAt(e.clientX);
      drawChart();
    }
  };

  cv.onpointermove = e => {
    if (!dragging) return;
    const dx = e.clientX - downX;
    if (Math.abs(dx) > 4) {
      moved = true;
    }
    const rect =
      cv.getBoundingClientRect();
    if (st.moveLine || dragAxis) {
      const lx = e.clientX - rect.left;
      const plotW = Math.max(
        1,
        rect.width - 58
      );
      if (lx < 24) {
        panBackward(2);
      } else if (lx > plotW - 24 &&
        st.panOff > 0) {
        panForward(2);
      }
      st.selBar = barAt(e.clientX);
      drawChart();
      return;
    }
    if (!moved) return;
    const {
      startB,
      endB
    } = getVisRange();
    const span = Math.max(
      1,
      endB - startB
    );
    const useW = Math.max(
      1,
      rect.width - 58 - 12
    );
    const dBars = Math.round(
      (dx / useW) * span
    );
    const maxP = maxPanLimit();
    st.panOff = Math.max(
      0,
      Math.min(maxP, basePan + dBars)
    );
    drawChart();
  };

  cv.onpointerup = e => {
    if (!dragging) return;
    dragging = false;
    dragAxis = false;
    if (!moved) {
      st.selBar = barAt(e.clientX);
      drawChart();
    }
  };

  cv.onwheel = e => {
    e.preventDefault();
    const step =
      e.deltaY > 0 ? 20 : -20;
    st.histBars = Math.max(
      45,
      Math.min(
        360,
        st.histBars + step
      )
    );
    savePrefs();
    drawChart();
  };

  window.onkeydown = e => {
    const tag = document
      .activeElement?.tagName;
    if (tag === "INPUT" ||
      tag === "SELECT") {
      return;
    }
    if (e.key === "ArrowLeft") {
      e.preventDefault();
      stepBar(-1);
    } else if (
      e.key === "ArrowRight"
    ) {
      e.preventDefault();
      stepBar(1);
    }
  };

  const ro = new ResizeObserver(() => {
    drawChart();
  });
  ro.observe(
    document.getElementById("cWrap")
  );
}

restoreState();
