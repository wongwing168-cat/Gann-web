<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width,
    initial-scale=1.0">
<meta
  name="theme-color"
  content="#0b0d12">
<title>江恩時空共振與和諧分析</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  background: #090b10;
  color: #f1f5f9;
  font-family: -apple-system,
    BlinkMacSystemFont,
    "Segoe UI", sans-serif;
  padding: 10px;
}
.app {
  max-width: 1440px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  background: #141821;
  padding: 8px 10px;
  border-radius: 10px;
  border: 1px solid #242b38;
}
.seg {
  display: inline-flex;
  background: #0b0d12;
  border-radius: 7px;
  padding: 2px;
  border: 1px solid #283040;
}
.seg button {
  background: transparent;
  color: #94a3b8;
  border: none;
  padding: 5px 8px;
  font-size: 12px;
  border-radius: 5px;
  cursor: pointer;
}
.seg button.on {
  background: #2563eb;
  color: #fff;
  font-weight: 600;
}
.btn {
  background: #1e2533;
  color: #e2e8f0;
  border: 1px solid #334155;
  padding: 5px 8px;
  font-size: 12px;
  border-radius: 6px;
  cursor: pointer;
}
.btn:hover {
  background: #2a3447;
}
.btn.on {
  background: #0f766e;
  border-color: #14b8a6;
  color: #fff;
}
.btn-hi {
  background: #ea580c;
  border-color: #f97316;
  color: #fff;
  font-weight: 600;
}
.btn-y {
  color: #facc15;
  border-color: #854d0e;
}
.btn-c {
  color: #38bdf8;
  border-color: #075985;
}
.btn-m {
  color: #34d399;
  border-color: #065f46;
}
.btn-del {
  color: #f87171;
  border-color: #7f1d1d;
  padding: 5px 7px;
}
.ac-wrap {
  position: relative;
  display: inline-block;
}
.ac-box {
  position: absolute;
  top: 100%;
  left: 0;
  margin-top: 4px;
  width: 295px;
  max-height: 280px;
  overflow-y: auto;
  background: #181e29;
  border: 1px solid #38bdf8;
  border-radius: 8px;
  box-shadow: 0 8px 24px #000;
  z-index: 99;
  display: none;
}
.ac-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  padding: 7px 9px;
  border-bottom: 1px solid #242b38;
  cursor: pointer;
  font-size: 12px;
}
.ac-item:hover {
  background: #253042;
}
.ac-sym {
  font-weight: 700;
  color: #facc15;
  min-width: 62px;
}
.ac-nm {
  color: #f1f5f9;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ac-bdg {
  font-size: 10px;
  padding: 2px 5px;
  border-radius: 4px;
  background: #064e3b;
  color: #34d399;
  white-space: nowrap;
}
.ac-otc {
  background: #27272a;
  color: #a1a1aa;
}
input, select {
  background: #0b0d12;
  color: #fff;
  border: 1px solid #334155;
  padding: 5px 8px;
  border-radius: 6px;
  font-size: 13px;
}
input {
  width: 106px;
  text-transform: uppercase;
}
select {
  max-width: 150px;
}
.lbl {
  font-size: 12px;
  color: #94a3b8;
}
.src-tag {
  font-size: 11px;
  color: #34d399;
  background: #064e3b;
  padding: 2px 7px;
  border-radius: 5px;
}
.sp {
  flex: 1;
}
.err {
  background: #7f1d1d;
  color: #fecaca;
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 12px;
  display: none;
}
.warn {
  background: #78350f;
  color: #fde68a;
}
.main {
  display: grid;
  grid-template-columns: 1.68fr 1fr;
  gap: 10px;
  min-height: 76vh;
}
@media (max-width: 860px) {
  .main {
    grid-template-columns: 1fr;
  }
}
.chart-box {
  background: #12161f;
  border: 1px solid #242b38;
  border-radius: 12px;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-height: 480px;
}
.hud {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
  font-size: 12px;
}
.hud-txt {
  color: #f8fafc;
  font-weight: 500;
}
.c-wrap {
  position: relative;
  flex: 1;
  min-height: 420px;
  touch-action: none;
}
canvas {
  width: 100%;
  height: 100%;
  display: block;
  border-radius: 8px;
  cursor: crosshair;
}
.load {
  position: absolute;
  inset: 0;
  background: rgba(9, 11, 16, 0.78);
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  color: #38bdf8;
  border-radius: 8px;
}
.side {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 82vh;
  overflow-y: auto;
}
.card {
  background: #141821;
  border: 1px solid #242b38;
  border-radius: 12px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.c-hd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-weight: 700;
  font-size: 14px;
}
.c-org { color: #fb923c; }
.c-mnt { color: #34d399; }
.c-yel { color: #facc15; }
.c-pnk {
  color: #f472b6;
  font-size: 12px;
  font-weight: 700;
}
.c-cyn {
  color: #38bdf8;
  font-size: 12px;
  font-weight: 700;
}
.c-big {
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  line-height: 1.45;
}
.c-sub {
  font-size: 12px;
  color: #fde047;
}
.c-val {
  font-size: 13px;
  color: #38bdf8;
}
.rep {
  font-size: 13px;
  line-height: 1.55;
  color: #e2e8f0;
  white-space: pre-wrap;
}
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.78);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
  padding: 12px;
}
.modal-box {
  background: #141821;
  border: 1px solid #334155;
  border-radius: 14px;
  width: 100%;
  max-width: 460px;
  max-height: 88vh;
  overflow-y: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.al-row {
  background: #1e2533;
  border-radius: 8px;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="seg" id="mktSeg">
      <button
        data-v="us">美股</button>
      <button
        class="on"
        data-v="hk">港股</button>
    </div>
    <button
      class="btn btn-y"
      id="btnHsi">恒指</button>
    <button
      class="btn btn-c"
      id="btnIxic">納指</button>
    <select id="presetSel">
      <option value="">自選紀錄</option>
    </select>
    <button
      class="btn btn-del"
      id="btnDelSaved"
      title="從自選移除目前標的">
      刪
    </button>
    <button
      class="btn btn-y"
      id="btnAlerts">🔔 到價</button>
    <div class="ac-wrap">
      <input
        id="codeInp"
        value="^HSI"
        autocomplete="off"
        placeholder="代碼/名稱">
      <div
        class="ac-box"
        id="acBox"></div>
    </div>
    <button
      class="btn btn-hi"
      id="btnGo">分析</button>
    <span
      class="src-tag"
      id="srcTag">線路就緒</span>
    <div class="sp"></div>
    <div class="seg" id="stySeg">
      <button
        class="on"
        data-v="candle">陰陽燭</button>
      <button
        data-v="line">折線圖</button>
    </div>
    <div class="seg" id="intSeg">
      <button
        data-v="15m">15分</button>
      <button
        data-v="30m">30分</button>
      <button
        data-v="60m">1時</button>
      <button
        data-v="1d">日線</button>
      <button
        class="on"
        data-v="1wk">週線</button>
      <button
        data-v="1mo">月線</button>
    </div>
  </div>

  <div class="bar">
    <span class="lbl">延伸:</span>
    <div class="seg" id="horSeg">
      <button
        data-v="30">30期</button>
      <button
        class="on"
        data-v="60">60期</button>
      <button
        data-v="90">90期</button>
      <button
        data-v="120">120期</button>
      <button
        data-v="252">252期</button>
    </div>
    <span class="lbl">方向:</span>
    <div class="seg" id="dirSeg">
      <button
        class="on"
        data-v="auto">自動</button>
      <button
        data-v="up">向上</button>
      <button
        data-v="down">向下</button>
    </div>
    <div class="seg" id="tModeSeg">
      <button
        class="on"
        data-v="trading">交易日</button>
      <button
        data-v="calendar">自然日</button>
    </div>
    <button
      class="btn on"
      id="togSwing">擺動線</button>
    <button
      class="btn on"
      id="togGrid">八分網格</button>
    <button
      class="btn"
      id="togFib">黃金位</button>
    <button
      class="btn on"
      id="togHarm">和諧形態</button>
    <div class="sp"></div>
    <span
      class="lbl"
      id="volLbl">波動:1.0x</span>
    <button
      class="btn"
      id="volDn">-</button>
    <button
      class="btn"
      id="volUp">+</button>
  </div>

  <div class="err" id="errBox"></div>

  <div class="main">
    <div class="chart-box">
      <div class="hud">
        <span
          class="hud-txt"
          id="hudTxt">載入中...</span>
        <div class="sp"></div>
        <button
          class="btn on"
          id="btnLocHarm"
          style="display:none">
          定位形態
        </button>
        <button
          class="btn btn-m"
          id="btnHistBack"
          style="display:none">
          ◀ 向前
        </button>
        <button
          class="btn btn-m"
          id="btnHistFwd"
          style="display:none">
          向後 ▶
        </button>
        <button
          class="btn btn-hi"
          id="btnLatest"
          style="display:none">
          回最新
        </button>
        <button
          class="btn btn-hi"
          id="btnMode">移動時間線</button>
        <button
          class="btn btn-c"
          id="btnZoomIn">+</button>
        <button
          class="btn btn-c"
          id="btnZoomOut">-</button>
        <button
          class="btn btn-hi"
          id="btnSetAnc"
          style="display:none">
          設為起點
        </button>
        <button
          class="btn btn-y"
          id="btnAutoAnc">自動起點</button>
      </div>
      <div
        class="c-wrap"
        id="cWrap">
        <canvas id="cv"></canvas>
        <div
          class="load"
          id="loadBox">
          切換線路抓取報價中...
        </div>
      </div>
    </div>

    <div class="side">
      <div class="card">
        <div class="c-hd c-org">
          <span id="turnCardTitle">
            大級別圓周與轉勢窗口
          </span>
        </div>
        <div
          class="c-cyn"
          id="dailyHintBadge"
          style="display:none">--</div>
        <div
          class="c-pnk"
          id="turnBadge"
          style="display:none">
          ◎ 命中核心時空共振
        </div>
        <div
          class="c-big"
          id="turnDate">--</div>
        <div
          class="c-sub"
          id="turnWhy">--</div>
        <div
          class="c-val"
          id="turnPrice">--</div>
      </div>

      <div class="card">
        <div class="c-hd c-mnt">
          <span>和諧交易形態推演</span>
        </div>
        <div
          class="c-cyn"
          id="harmBadge"
          style="display:none">
          ◎ 已自動向前推移鎖定歷史形態
        </div>
        <div
          class="c-big"
          id="harmName">--</div>
        <div
          class="c-sub"
          id="harmDate">--</div>
        <div
          class="c-val"
          id="harmPrz">--</div>
      </div>

      <div class="card">
        <div class="c-hd c-yel">
          <span id="repTitle">
            江恩策略建議
          </span>
          <button
            class="btn"
            id="btnCopy">複製報告</button>
        </div>
        <div
          class="rep"
          id="repBody">載入中...</div>
      </div>
    </div>
  </div>
</div>

<div
  class="modal-bg"
  id="alertModal">
  <div class="modal-box">
    <div class="c-hd c-org">
      <span>🔔 江恩到價作戰計劃與響鬧</span>
      <div style="display:flex;gap:5px;align-items:center">
        <select
          id="ringToneSel"
          style="width:108px;font-size:11px">
          <option value="alarm">
            急促鬧鈴(Alarm)
          </option>
          <option value="bell">
            清脆鐘聲(Bell)
          </option>
          <option value="electronic">
            雷達雙音(Radar)
          </option>
          <option value="minuet">
            柔和琴音(Soft)
          </option>
        </select>
        <button
          class="btn btn-y"
          id="btnTestRing">測鈴聲</button>
        <button
          class="btn"
          id="btnCloseAlert">關閉</button>
      </div>
    </div>

    <div
      style="background:#1e2533;
      padding:8px;border-radius:8px;
      display:flex;flex-direction:column;
      gap:6px">
      <div
        class="lbl"
        style="color:#38bdf8">
        iPhone 鎖屏背景響鬧（填入免費 Bark App Key）：
      </div>
      <div style="display:flex;gap:6px">
        <input
          id="barkKeyInp"
          style="flex:1;
          text-transform:none"
          placeholder="貼上 iPhone Bark Key">
        <button
          class="btn on"
          id="btnSaveBark">儲存Key</button>
      </div>
    </div>

    <div
      style="background:#1e2533;
      padding:10px;border-radius:8px;
      display:flex;flex-direction:column;
      gap:7px">
      <div
        style="display:flex;
        justify-content:space-between;
        font-size:13px">
        <span
          id="alCurSym"
          style="color:#facc15;
          font-weight:700">--</span>
        <span
          id="alCurP"
          style="color:#38bdf8">--</span>
      </div>
      <div style="display:flex;gap:6px">
        <select
          id="alCondSel"
          style="width:110px">
          <option value="向下跌破">
            向下跌破
          </option>
          <option value="向上突破">
            向上突破
          </option>
        </select>
        <input
          id="alTargetInp"
          type="number"
          step="0.01"
          style="flex:1;
          text-transform:none"
          placeholder="目標價位">
      </div>
      <div
        id="alQuickFill"
        style="display:flex;
        flex-wrap:wrap;gap:5px">
      </div>
      <div
        style="display:flex;
        align-items:center;
        gap:6px;flex-wrap:wrap">
        <span class="lbl">
          提醒時機:
        </span>
        <select
          id="alModeSel"
          style="width:112px">
          <option value="immediate">
            即時響鬧
          </option>
          <option value="scheduled">
            定時通知
          </option>
        </select>
        <input
          id="alTimeInp"
          type="time"
          value="08:30"
          style="width:105px;
          display:none;
          text-transform:none">
        <span
          id="alModeTip"
          class="lbl"
          style="color:#fb923c">
          到價立刻響鬧
        </span>
      </div>
      <textarea
        id="alNoteInp"
        rows="4"
        style="width:100%;
        background:#0b0d12;
        color:#fff;
        border:1px solid #334155;
        border-radius:6px;
        padding:7px 8px;
        font-size:13px;
        line-height:1.45;
        resize:vertical"
        placeholder="輸入詳細交易作戰方案（支援多行：進場條件、分批倉位、機械止損與目標位...）"
      ></textarea>
      <button
        class="btn btn-hi"
        id="btnAddAlert">
        新增並同步雲端監控
      </button>
    </div>

    <div
      style="display:flex;
      justify-content:space-between;
      font-size:12px">
      <span
        id="alListCnt"
        style="font-weight:700">
        監控清單 (0)
      </span>
      <span
        id="alScanInfo"
        style="color:#34d399">
        雲端每2分鐘自動巡檢
      </span>
    </div>
    <div
      id="alListBox"
      style="display:flex;
      flex-direction:column;gap:6px">
    </div>
  </div>
</div>

<div
  class="modal-bg"
  id="trigModal">
  <div
    class="modal-box"
    style="border:2px solid #f97316;
    text-align:center">
    <div
      class="c-big"
      style="color:#facc15;
      font-size:18px">
      🔔 江恩到價作戰警報觸發！
    </div>
    <div
      id="trigSym"
      class="c-big">--</div>
    <div
      id="trigDetail"
      class="c-val">--</div>
    <div
      style="background:#1e2533;
      padding:10px;border-radius:8px;
      text-align:left">
      <div
        class="lbl"
        style="color:#fb923c">
        預寫交易作戰方案：
      </div>
      <div
        id="trigPlan"
        style="font-size:14px;
        font-weight:600;
        margin-top:4px">--</div>
    </div>
    <button
      class="btn btn-hi"
      id="btnAckTrig">
      停止響鬧並執行計劃
    </button>
  </div>
</div>

function isIntraIv(iv) {
  return (
    iv === "15m" ||
    iv === "30m" ||
    iv === "60m"
  );
}

function barMins(iv) {
  if (iv === "15m") return 15;
  if (iv === "30m") return 30;
  if (iv === "60m") return 60;
  return 1440;
}

function ivTitle(iv) {
  if (iv === "15m") return "15分";
  if (iv === "30m") return "30分";
  if (iv === "60m") return "1時";
  if (iv === "1d") return "日線";
  if (iv === "1wk") return "週線";
  return "月線";
}

function approxDays(iv) {
  if (iv === "15m") return 0.036;
  if (iv === "30m") return 0.072;
  if (iv === "60m") return 0.145;
  if (iv === "1d") return 1.45;
  if (iv === "1wk") return 7.0;
  return 30.44;
}

function unitName(iv) {
  if (iv === "15m") return "期(15m)";
  if (iv === "30m") return "期(30m)";
  if (iv === "60m") return "小時";
  if (iv === "1d") return "日";
  if (iv === "1wk") return "週";
  return "月";
}

function fmt(v) {
  return Number(v).toFixed(2);
}

function fmtAxis(p) {
  if (p >= 10000) return p.toFixed(0);
  if (p >= 1000) return p.toFixed(1);
  return p.toFixed(2);
}

function fmtDate(ms, withTime) {
  const d = new Date(ms);
  const y = d.getUTCFullYear();
  const m = String(
    d.getUTCMonth() + 1
  ).padStart(2, "0");
  const day = String(
    d.getUTCDate()
  ).padStart(2, "0");
  if (!withTime) {
    return y + "-" + m + "-" + day;
  }
  const hh = String(
    d.getUTCHours()
  ).padStart(2, "0");
  const mm = String(
    d.getUTCMinutes()
  ).padStart(2, "0");
  return (
    m + "-" + day + " " + hh + ":" + mm
  );
}

function addTradingBarsMs(
  baseMs,
  bars,
  iv
) {
  let cur = baseMs;
  const mins = barMins(iv);
  let left = Math.abs(bars);
  const dir = bars >= 0 ? 1 : -1;
  while (left > 0) {
    cur += dir * mins * 60000;
    const wd = new Date(cur)
      .getUTCDay();
    if (wd === 0 || wd === 6) {
      continue;
    }
    left -= 1;
  }
  return cur;
}

function dateMsForIndex(
  cs,
  idx,
  iv
) {
  if (!cs.length) return Date.now();
  const lastI = cs.length - 1;
  if (idx >= 0 && idx <= lastI) {
    return cs[idx].date;
  }
  const diff = idx - lastI;
  if (isIntraIv(iv)) {
    return addTradingBarsMs(
      cs[lastI].date,
      diff,
      iv
    );
  }
  return (
    cs[lastI].date +
    diff * approxDays(iv) * 86400000
  );
}

function barTimeDelta(
  cs,
  fromIdx,
  toIdx,
  iv,
  tMode
) {
  if (
    isIntraIv(iv) ||
    tMode === "trading"
  ) {
    return toIdx - fromIdx;
  }
  const d1 = dateMsForIndex(
    cs,
    fromIdx,
    iv
  );
  const d2 = dateMsForIndex(
    cs,
    toIdx,
    iv
  );
  const calDays =
    (d2 - d1) / 86400000;
  if (iv === "1d") return calDays;
  if (iv === "1wk") {
    return calDays / 7.0;
  }
  return calDays / 30.4375;
}

function normalizeSym(raw, mkt) {
  let c = raw
    .trim()
    .toUpperCase();
  if (!c) {
    return mkt === "hk"
      ? "^HSI" : "^IXIC";
  }
  if (
    c === "HSI" ||
    c === "HSCE" ||
    c === "IXIC" ||
    c === "GSPC" ||
    c === "DJI"
  ) {
    return "^" + c;
  }
  if (c === "BRK.B") c = "BRK-B";
  if (c === "BRK.A") c = "BRK-A";
  if (
    mkt === "hk" &&
    !c.endsWith(".HK") &&
    !c.startsWith("^")
  ) {
    const dig = c.replace(/\D/g, "");
    if (dig) {
      return (
        dig.padStart(4, "0") + ".HK"
      );
    }
  }
  return c;
}

  if (NAMES[sym]) return NAMES[sym];
  if (apiName) return apiName;
  return "";
}

async function searchStocks(q) {
  const up = q.toUpperCase();
  const list = [];
  const seen = new Set();
  for (const it of CATALOG) {
    if (
      it.s.includes(up) ||
      it.n.toUpperCase().includes(up)
    ) {
      list.push(it);
      seen.add(it.s);
    }
  }
  try {
    const r = await fetch(
      "/.netlify/functions/yahoo" +
      "?action=search&q=" +
      encodeURIComponent(q)
    );
    if (r.ok) {
      const j = await r.json();
      const qs = j?.quotes || [];
      for (const qt of qs) {
        const s = qt.symbol;
        if (!s || seen.has(s)) {
          continue;
        }
        const exRaw = (
          qt.exchDisp ||
          qt.exchange ||
          "US"
        ).toUpperCase();
        const isHK =
          s.endsWith(".HK") ||
          exRaw.includes("HKG") ||
          exRaw.includes("HKSE");
        const isOtc =
          exRaw.includes("OTC") ||
          exRaw.includes("PNK");
        const tp =
          qt.quoteType === "ETF"
            ? "ETF"
            : (qt.quoteType === "INDEX"
              ? "指數" : "股票");
        list.push({
          s,
          n: resolveName(
            s,
            qt.shortname || qt.longname
          ),
          ex: isHK
            ? "HKEX"
            : (isOtc ? "OTC" : exRaw),
          tp,
          m: isHK ? "hk" : "us",
          otc: isOtc
        });
        seen.add(s);
      }
    }
  } catch (e) {}
  return list
    .sort((a, b) => a.otc - b.otc)
    .slice(0, 8);
}

function parseChartJson(txt, sym) {
  const obj = JSON.parse(txt);
  const res =
    obj?.chart?.result?.[0];
  if (!res || !res.timestamp) {
    return null;
  }
  const ts = res.timestamp;
  const q =
    res.indicators?.quote?.[0];
  if (!q) return null;
  const apiNm =
    res.meta?.shortName ||
    res.meta?.longName;
  const candles = [];
  let idx = 0;
  for (let i = 0; i < ts.length; i++) {
    const o = q.open?.[i];
    const h = q.high?.[i];
    const l = q.low?.[i];
    const c = q.close?.[i];
    if (
      o == null ||
      h == null ||
      l == null ||
      c == null
    ) {
      continue;
    }
    candles.push({
      id: idx++,
      date: ts[i] * 1000,
      open: o,
      high: h,
      low: l,
      close: c,
      volume: q.volume?.[i] || 0
    });
  }
  if (candles.length < 15) {
    return null;
  }
  return {
    name: resolveName(sym, apiNm),
    candles
  };
}

async function fetchOneSeries(
  sym,
  iv
) {
  let rng = "5y";
  if (iv === "15m") rng = "30d";
  else if (iv === "30m") rng = "60d";
  else if (iv === "60m") rng = "180d";
  else if (iv === "1wk") rng = "15y";
  else if (iv === "1mo") rng = "max";

  const cacheK =
    "gann_web_c4_" + sym + "_" + iv;
  const url =
    "/.netlify/functions/yahoo" +
    "?symbol=" +
    encodeURIComponent(sym) +
    "&interval=" + iv +
    "&range=" + rng;
  try {
    const r = await fetch(url);
    if (r.ok) {
      const txt = await r.text();
      const parsed = parseChartJson(
        txt,
        sym
      );
      if (parsed) {
        try {
          localStorage.setItem(
            cacheK,
            JSON.stringify(parsed)
          );
        } catch (e) {}
        return {
          parsed,
          src:
            r.headers.get("X-Source") ||
            "雲端連線"
        };
      }
    }
  } catch (e) {}

  try {
    const raw =
      localStorage.getItem(cacheK);
    if (raw) {
      return {
        parsed: JSON.parse(raw),
        src: "離線快取"
      };
    }
  } catch (e) {}
  return null;
}

async function loadSymbol() {
  const myReq = ++st.reqId;
  const raw = document.getElementById(
    "codeInp"
  ).value;
  const sym = normalizeSym(
    raw,
    st.market
  );
  document.getElementById(
    "codeInp"
  ).value = sym;
  st.code = sym;
  st.name = resolveName(sym, "");
  st.customAnc = null;
  st.selBar = null;
  st.panOff = 0;

  const loadBox =
    document.getElementById("loadBox");
  const errBox =
    document.getElementById("errBox");
  loadBox.style.display = "flex";
  errBox.style.display = "none";

  const hit = await fetchOneSeries(
    sym,
    st.interval
  );
  if (myReq !== st.reqId) return;

  if (!hit) {
    loadBox.style.display = "none";
    errBox.className = "err";
    errBox.textContent =
      "報價讀取失敗，請檢查代碼：" +
      sym;
    errBox.style.display = "block";
    return;
  }

  st.candles = hit.parsed.candles;
  if (hit.parsed.name) {
    st.name = hit.parsed.name;
  }

  if (st.interval === "1d") {
    st.dailyCandles = st.candles;
  } else if (isIntraIv(st.interval)) {
    const dHit = await fetchOneSeries(
      sym,
      "1d"
    );
    if (myReq !== st.reqId) return;
    st.dailyCandles = dHit
      ? dHit.parsed.candles : [];
  }

  loadBox.style.display = "none";
  const srcTag =
    document.getElementById("srcTag");
  srcTag.textContent =
    hit.src === "離線快取"
      ? "離線快取"
      : "雲端:" + hit.src;
  if (hit.src === "離線快取") {
    errBox.className = "err warn";
    errBox.textContent =
      "當前顯示本地快取歷史數據";
    errBox.style.display = "block";
  }

  recordSaved(
    sym,
    st.name,
    st.market
  );
  savePrefs();
  runAnalysis();
}

function detectSwings(cs, iv) {
  let hiAll = -Infinity;
  let loAll = Infinity;
  for (const c of cs) {
    if (c.high > hiAll) hiAll = c.high;
    if (c.low < loAll) loAll = c.low;
  }
  const span =
    (hiAll - loAll) /
    Math.max(0.01, loAll);
  const intra = isIntraIv(iv);
  const minTh = intra ? 0.006 : 0.025;
  const maxTh = intra ? 0.045 : 0.12;
  const mult = intra ? 0.10 : 0.14;
  const thresh = Math.max(
    minTh,
    Math.min(maxTh, span * mult)
  );
  const pts = [];
  let mode = 0;
  let curHi = cs[0].high;
  let curHiI = 0;
  let curLo = cs[0].low;
  let curLoI = 0;

  for (const c of cs) {
    if (c.high > curHi) {
      curHi = c.high;
      curHiI = c.id;
    }
    if (c.low < curLo) {
      curLo = c.low;
      curLoI = c.id;
    }
    if (mode === 0) {
      const upM =
        (c.high - curLo) /
        Math.max(0.001, curLo);
      const dnM =
        (curHi - c.low) /
        Math.max(0.001, curHi);
      if (upM >= thresh) {
        pts.push({
          index: curLoI,
          date: cs[curLoI].date,
          price: curLo,
          isHigh: false
        });
        mode = 1;
        curHi = c.high;
        curHiI = c.id;
      } else if (dnM >= thresh) {
        pts.push({
          index: curHiI,
          date: cs[curHiI].date,
          price: curHi,
          isHigh: true
        });
        mode = -1;
        curLo = c.low;
        curLoI = c.id;
      }
    } else if (mode === 1) {
      const drop =
        (curHi - c.low) /
        Math.max(0.001, curHi);
      if (drop >= thresh) {
        pts.push({
          index: curHiI,
          date: cs[curHiI].date,
          price: curHi,
          isHigh: true
        });
        mode = -1;
        curLo = c.low;
        curLoI = c.id;
      }
    } else {
      const rise =
        (c.high - curLo) /
        Math.max(0.001, curLo);
      if (rise >= thresh) {
        pts.push({
          index: curLoI,
          date: cs[curLoI].date,
          price: curLo,
          isHigh: false
        });
        mode = 1;
        curHi = c.high;
        curHiI = c.id;
      }
    }
  }
  return pts;
}

function buildMechSwings(cs, order) {
  if (cs.length < 3) return [];
  const act = [cs[0]];
  for (let i = 1; i < cs.length; i++) {
    const c = cs[i];
    const p = act[act.length - 1];
    if (
      !(c.high <= p.high &&
        c.low >= p.low)
    ) {
      act.push(c);
    }
  }
  if (act.length < 3) return [];
  const res = [];
  let dir = 0;
  let upC = 0;
  let dnC = 0;
  let extH = act[0];
  let extL = act[0];

  for (let i = 1; i < act.length; i++) {
    const c = act[i];
    const p = act[i - 1];
    const hh = c.high > p.high;
    const ll = c.low < p.low;
    if (hh && !ll) {
      upC += 1;
      dnC = 0;
    } else if (ll && !hh) {
      dnC += 1;
      upC = 0;
    }
    if (dir === 0) {
      if (upC >= order) {
        res.push({
          index: extL.id,
          date: extL.date,
          price: extL.low,
          isHigh: false
        });
        dir = 1;
        extH = c;
      } else if (dnC >= order) {
        res.push({
          index: extH.id,
          date: extH.date,
          price: extH.high,
          isHigh: true
        });
        dir = -1;
        extL = c;
      } else {
        if (c.high > extH.high) {
          extH = c;
        }
        if (c.low < extL.low) {
          extL = c;
        }
      }
    } else if (dir === 1) {
      if (c.high >= extH.high) {
        extH = c;
      }
      if (dnC >= order) {
        res.push({
          index: extH.id,
          date: extH.date,
          price: extH.high,
          isHigh: true
        });
        dir = -1;
        extL = c;
      }
    } else {
      if (c.low <= extL.low) {
        extL = c;
      }
      if (upC >= order) {
        res.push({
          index: extL.id,
          date: extL.date,
          price: extL.low,
          isHigh: false
        });
        dir = 1;
        extH = c;
      }
    }
  }
  const tail = dir >= 0 ? extH : extL;
  if (
    !res.length ||
    res[res.length - 1].index !==
      tail.id
  ) {
    res.push({
      index: tail.id,
      date: tail.date,
      price: dir >= 0
        ? tail.high : tail.low,
      isHigh: dir >= 0
    });
  }
  return res;
}

function pickAnchor(
  cs,
  swings,
  custIdx,
  dir
) {
  if (
    custIdx != null &&
    custIdx >= 0 &&
    custIdx < cs.length
  ) {
    const c = cs[custIdx];
    let isH = false;
    if (dir === "up") isH = false;
    else if (dir === "down") {
      isH = true;
    } else {
      isH =
        c.close <
        (c.high + c.low) / 2;
    }
    return {
      index: custIdx,
      date: c.date,
      price: isH ? c.high : c.low,
      isHigh: isH
    };
  }
  const look = Math.min(
    cs.length,
    160
  );
  const start = cs.length - look;
  const rec = swings.filter(
    s =>
      s.index >= start &&
      s.index < cs.length - 5
  );
  if (dir === "up") {
    const lo = [...rec]
      .reverse()
      .find(s => !s.isHigh);
    if (lo) return lo;
  } else if (dir === "down") {
    const hi = [...rec]
      .reverse()
      .find(s => s.isHigh);
    if (hi) return hi;
  } else if (rec.length > 0) {
    return rec[rec.length - 1];
  }

  let best = cs[start];
  for (
    let i = start + 1;
    i < cs.length;
    i++
  ) {
    if (dir === "down") {
      if (cs[i].high > best.high) {
        best = cs[i];
      }
    } else {
      if (cs[i].low < best.low) {
        best = cs[i];
      }
    }
  }
  const isH = dir === "down";
  return {
    index: best.id,
    date: best.date,
    price: isH
      ? best.high : best.low,
    isHigh: isH
  };
}

function calcVol(
  cs,
  anc,
  swings,
  iv,
  tMode
) {
  const after = swings.filter(
    s => s.index > anc.index + 3
  );
  if (after.length > 0) {
    const nxt = after[0];
    const dp = Math.abs(
      nxt.price - anc.price
    );
    const dt = Math.abs(
      barTimeDelta(
        cs,
        anc.index,
        nxt.index,
        iv,
        tMode
      )
    );
    return dp / Math.max(1, dt);
  }
  const last = cs[cs.length - 1];
  const dp = Math.abs(
    last.close - anc.price
  );
  const dt = Math.abs(
    barTimeDelta(
      cs,
      anc.index,
      last.id,
      iv,
      tMode
    )
  );
  return dp / Math.max(1, dt);
}

function buildRays(
  cs,
  anc,
  isUp,
  vol,
  endIdx,
  iv,
  tMode
) {
  const specs = [
    ["8x1", 8.0],
    ["4x1", 4.0],
    ["3x1", 3.0],
    ["2x1", 2.0],
    ["1x1", 1.0],
    ["1x2", 0.5],
    ["1x3", 1 / 3],
    ["1x4", 0.25],
    ["1x8", 0.125]
  ];
  const s = isUp ? 1 : -1;
  return specs.map(([nm, r]) => {
    const pts = [];
    const step = Math.max(
      1,
      Math.floor(
        (endIdx - anc.index) / 60
      )
    );
    for (
      let i = anc.index;
      i <= endIdx;
      i += step
    ) {
      const dt = barTimeDelta(
        cs,
        anc.index,
        i,
        iv,
        tMode
      );
      const p =
        anc.price + s * vol * r * dt;
      if (p >= 0) {
        pts.push({
          barIndex: i,
          price: p
        });
      }
    }
    if (
      pts.length &&
      pts[pts.length - 1].barIndex <
        endIdx
    ) {
      const dt = barTimeDelta(
        cs,
        anc.index,
        endIdx,
        iv,
        tMode
      );
      pts.push({
        barIndex: endIdx,
        price: Math.max(
          0,
          anc.price + s * vol * r * dt
        )
      });
    }
    return {
      name: nm,
      ratio: r,
      isPrimary: nm === "1x1",
      points: pts
    };
  });
}

function moonEvent(ms) {
  const ref = 947182440000;
  const syn = 29.53058867;
  const diff = (ms - ref) / 86400000;
  let ph = diff % syn;
  if (ph < 0) ph += syn;
  if (ph <= 1.0 || ph >= syn - 1.0) {
    return "天文新月窗口";
  }
  if (
    Math.abs(ph - syn / 2) <= 1.0
  ) {
    return "天文滿月窗口";
  }
  return null;
}

function solarTerm(ms) {
  const d = new Date(ms);
  const m = d.getUTCMonth() + 1;
  const day = d.getUTCDate();
  const terms = [
    [2, 4, "立春節氣(45度)"],
    [3, 21, "春分節氣(0度)"],
    [5, 6, "立夏節氣(45度)"],
    [6, 21, "夏至節氣(90度)"],
    [8, 8, "立秋節氣(135度)"],
    [9, 23, "秋分節氣(180度)"],
    [11, 7, "立冬節氣(225度)"],
    [12, 22, "冬至節氣(270度)"]
  ];
  for (const [tm, td, nm] of terms) {
    if (
      m === tm &&
      Math.abs(day - td) <= 1
    ) {
      return nm;
    }
  }
  return null;
}

function calcTimeHits(
  cs,
  anc,
  swings,
  vol,
  horizon,
  iv,
  tMode
) {
  const intra = isIntraIv(iv);
  const fibs = intra
    ? [5, 8, 13, 21, 34, 55, 89, 144]
    : [
      5, 8, 13, 21, 34,
      55, 89, 144, 233
    ];
  const g7 = intra
    ? [
      7, 12, 14, 18, 21, 24, 28,
      30, 42, 45, 49, 60, 72, 90
    ]
    : [
      7, 14, 28, 30, 42, 45, 49, 60,
      77, 90, 120, 144, 180, 270, 360
    ];
  const lastI = cs.length - 1;
  const lastD = cs[lastI].date;
  const map = new Map();
  const majSet = new Set();
  const unit =
    tMode === "calendar" &&
    iv === "1d"
      ? "自然日" : unitName(iv);
  const mSuf =
    tMode === "calendar" && !intra
      ? "(自然日)" : "";

  const add = (t, msg, isMaj) => {
    const d = t - lastI;
    if (d < 1 || d > horizon) return;
    if (!map.has(t)) map.set(t, []);
    map.get(t).push(msg);
    if (isMaj) majSet.add(t);
  };

  const mapBar = (baseI, cnt) => {
    if (
      intra ||
      tMode === "trading"
    ) {
      return baseI + cnt;
    }
    const bMs = dateMsForIndex(
      cs,
      baseI,
      iv
    );
    const stepD =
      iv === "1d"
        ? 1.0
        : (iv === "1wk"
          ? 7.0 : 30.4375);
    const tMs =
      bMs + cnt * stepD * 86400000;
    const off = Math.round(
      (tMs - lastD) /
      (approxDays(iv) * 86400000)
    );
    return lastI + off;
  };

  for (const f of fibs) {
    add(
      mapBar(anc.index, f),
      "費波那契第" + f + unit,
      false
    );
  }
  for (const g of g7) {
    let note = "";
    if (iv === "60m" && g === 24) {
      note = "(360度日循環)";
    } else if (
      iv === "60m" &&
      g === 49
    ) {
      note = "(7x7短線周期)";
    } else if (
      iv === "30m" &&
      g === 48
    ) {
      note = "(24小時360度)";
    }
    const isMaj = intra
      ? [
        21, 24, 30, 49, 60, 90
      ].includes(g)
      : [
        90, 180, 270, 360
      ].includes(g);
    add(
      mapBar(anc.index, g),
      "江恩神奇數" + g + unit + note,
      isMaj
    );
  }

  if (!intra && vol > 0) {
    const sqU = Math.round(
      anc.price / vol
    );
    add(
      mapBar(anc.index, sqU),
      "零度線時價成正方" + mSuf,
      true
    );
  }

  if (swings.length >= 2 && vol > 0) {
    const prevS =
      swings[swings.length - 2];
    if (prevS.isHigh !== anc.isHigh) {
      const pDiff = Math.abs(
        prevS.price - anc.price
      );
      const crU = Math.round(
        pDiff / (2 * vol)
      );
      const midB = Math.floor(
        (prevS.index + anc.index) / 2
      );
      add(
        mapBar(midB, crU),
        "雙1x1角度線幾何交叉",
        true
      );
    }
  }

  if (!intra) {
    const safeEnd = Math.max(
      1,
      lastI - 4
    );
    let topB = cs[0];
    let botB = cs[0];
    for (
      let i = 1;
      i < safeEnd;
      i++
    ) {
      if (cs[i].high > topB.high) {
        topB = cs[i];
      }
      if (cs[i].low < botB.low) {
        botB = cs[i];
      }
    }
    const csList =
      iv === "1mo"
        ? [60, 90, 120, 180, 240, 360]
        : [90, 180, 270, 360];
    for (const c of csList) {
      let note = "";
      if (iv === "1wk" && c === 180) {
        note = "(約3.5年)";
      } else if (
        iv === "1wk" &&
        c === 360
      ) {
        note = "(約7年)";
      } else if (
        iv === "1mo" &&
        c === 120
      ) {
        note = "(10年周期)";
      } else if (
        iv === "1mo" &&
        c === 360
      ) {
        note = "(30年土星)";
      }
      add(
        mapBar(topB.id, c),
        "歷史大頂滿" + c + unit + note,
        true
      );
      add(
        mapBar(botB.id, c),
        "歷史大底滿" + c + unit + note,
        true
      );
    }
  }

  if (swings.length > 0) {
    const rec =
      swings[swings.length - 1];
    if (rec.index !== anc.index) {
      const subN = intra
        ? [7, 12, 18, 21, 30]
        : [8, 13, 21, 34, 55];
      for (const f of subN) {
        add(
          mapBar(rec.index, f),
          "次波段第" + f + unit,
          false
        );
      }
    }
  }

  if (iv === "1d") {
    for (
      let d = 1;
      d <= horizon;
      d++
    ) {
      const est =
        lastD +
        d * approxDays(iv) * 86400000;
      const mn = moonEvent(est);
      if (mn) add(lastI + d, mn, false);
      const tm = solarTerm(est);
      if (tm) add(lastI + d, tm, false);
    }
  }

  const hits = [];
  const keys = [
    ...map.keys()
  ].sort((a, b) => a - b);
  for (const k of keys) {
    const rs = map.get(k);
    const isMaj = majSet.has(k);
    const keyNum = rs.some(
      s =>
        s.includes("18") ||
        s.includes("21") ||
        s.includes("30") ||
        s.includes("49") ||
        s.includes("55") ||
        s.includes("89") ||
        s.includes("90") ||
        s.includes("144") ||
        s.includes("180") ||
        s.includes("360") ||
        s.includes("正方") ||
        s.includes("交叉")
    );
    if (
      isMaj ||
      rs.length >= 2 ||
      keyNum
    ) {
      hits.push({
        targetIndex: k,
        estDate: dateMsForIndex(
          cs,
          k,
          iv
        ),
        reasons: rs,
        strength: rs.length,
        isMajor: isMaj
      });
    }
  }
  return hits;
}

function calcFibsAndGrid(cs) {
  const sub = cs.slice(-260);
  let hi = -Infinity;
  let lo = Infinity;
  for (const c of sub) {
    if (c.high > hi) hi = c.high;
    if (c.low < lo) lo = c.low;
  }
  const span = hi - lo;
  const gm = Math.sqrt(
    Math.max(0.01, hi * lo)
  );
  const fR = [
    0.236, 0.382, 0.5,
    0.618, 0.786, 1.272
  ];
  const fibs = fR.map(r => ({
    ratio: r,
    label:
      "黃金" + Math.round(r * 1000),
    price: hi - span * r
  }));
  const gSpecs = [
    [0.125, "1/8(12.5%)", false],
    [0.25, "2/8(25%)", true],
    [1 / 3, "1/3(33.3%)", true],
    [0.375, "3/8(37.5%)", false],
    [0.5, "4/8(50%中軸)", true],
    [0.625, "5/8(62.5%)", false],
    [2 / 3, "2/3(66.7%)", true],
    [0.75, "6/8(75%)", true],
    [0.875, "7/8(87.5%)", false],
    [1.125, "延伸112.5%", false],
    [4 / 3, "延伸133.3%", false],
    [5 / 3, "延伸166.7%", false],
    [2.0, "延伸200%", false]
  ];
  const pcts = gSpecs.map(
    ([r, lbl, maj]) => ({
      ratio: r,
      label: lbl,
      price: lo + span * r,
      isMajor: maj
    })
  );
  return { fibs, pcts, gm };
}

function checkCompValid(
  cs,
  dIdx,
  isBull,
  xP,
  przLo,
  przHi
) {
  const start = dIdx + 1;
  if (start >= cs.length) {
    return [true, true];
  }
  let brokeAt = -1;
  if (isBull) {
    const fl = Math.min(
      przLo * 0.985,
      xP * 0.99
    );
    for (
      let i = start;
      i < cs.length;
      i++
    ) {
      if (cs[i].low < fl) {
        brokeAt = i;
        break;
      }
    }
  } else {
    const cl = Math.max(
      przHi * 1.015,
      xP * 1.01
    );
    for (
      let i = start;
      i < cs.length;
      i++
    ) {
      if (cs[i].high > cl) {
        brokeAt = i;
        break;
      }
    }
  }
  if (brokeAt === -1) {
    return [true, true];
  }
  return [
    brokeAt - dIdx >= 4,
    false
  ];
}

function evalXABCD(
  x,
  a,
  b,
  c,
  d,
  cs,
  isBack
) {
  const isBull =
    !x.isHigh && a.isHigh;
  if (isBull) {
    const ok =
      a.isHigh &&
      !b.isHigh &&
      c.isHigh &&
      !d.isHigh &&
      a.price > c.price &&
      c.price > b.price &&
      b.price > d.price;
    if (!ok) return null;
  } else {
    const ok =
      !a.isHigh &&
      b.isHigh &&
      !c.isHigh &&
      d.isHigh &&
      a.price < c.price &&
      c.price < b.price &&
      b.price < d.price;
    if (!ok) return null;
  }
  const xa = Math.abs(
    a.price - x.price
  );
  const ab = Math.abs(
    b.price - a.price
  );
  const bc = Math.abs(
    c.price - b.price
  );
  const ad = Math.abs(
    d.price - a.price
  );
  if (xa <= 0 || ab <= 0 || bc <= 0) {
    return null;
  }
  const abR = ab / xa;
  const adR = ad / xa;
  let nm = "";
  if (
    abR >= 0.35 &&
    abR <= 0.54 &&
    adR >= 0.82 &&
    adR <= 0.94
  ) {
    nm = isBull
      ? "看漲蝙蝠形態"
      : "看跌蝙蝠形態";
  } else if (
    abR >= 0.55 &&
    abR <= 0.68 &&
    adR >= 0.73 &&
    adR <= 0.84
  ) {
    nm = isBull
      ? "看漲伽利222"
      : "看跌伽利222";
  } else {
    const cd = Math.abs(
      d.price - c.price
    );
    const cdAb = cd / ab;
    if (
      cdAb >= 0.88 &&
      cdAb <= 1.35
    ) {
      nm = isBull
        ? "看漲ABCD形態"
        : "看跌ABCD形態";
    }
  }
  if (!nm) return null;
  const przLo = d.price * 0.985;
  const przHi = d.price * 1.015;
  const chk = checkCompValid(
    cs,
    d.index,
    isBull,
    x.price,
    przLo,
    przHi
  );
  if (!chk[0]) return null;
  return [
    {
      name:
        nm + (isBack ? "(回溯)" : ""),
      isBull,
      isComp: true,
      nodes: [x, a, b, c, d],
      przLo,
      przHi,
      dIdx: d.index,
      dDate: d.date
    },
    chk[1]
  ];
}

function checkProjValid(
  cs,
  fromI,
  isBull,
  xP,
  bP,
  cP,
  przLo,
  przHi,
  extLim
) {
  for (
    let i = fromI;
    i < cs.length;
    i++
  ) {
    const bar = cs[i];
    if (isBull) {
      const fl = Math.min(
        przLo,
        extLim
      );
      if (
        bar.low < fl ||
        bar.low < xP ||
        bar.high > cP
      ) {
        return false;
      }
    } else {
      const cl = Math.max(
        przHi,
        extLim
      );
      if (
        bar.low < bP ||
        bar.low < cP ||
        bar.high > cl ||
        bar.high > xP
      ) {
        return false;
      }
    }
  }
  return true;
}

    if (
      !(
        a.isHigh &&
        !b.isHigh &&
        c.isHigh &&
        cb > 0
      )
    ) {
      return null;
    }
    dP = c.price - bcR * cb;
    ext1618 = c.price - 1.618 * cb;
    if (
      !(
        dP > 0 &&
        a.price > c.price &&
        c.price > b.price &&
        b.price > dP
      )
    ) {
      return null;
    }
  } else {
    const bc = b.price - c.price;
    if (
      !(
        !a.isHigh &&
        b.isHigh &&
        !c.isHigh &&
        bc > 0
      )
    ) {
      return null;
    }
    dP = c.price + bcR * bc;
    ext1618 = c.price + 1.618 * bc;
    if (
      !(
        a.price < c.price &&
        c.price < b.price &&
        b.price < dP
      )
    ) {
      return null;
    }
  }

  const przLo = dP * 0.985;
  const przHi = dP * 1.015;
  if (
    !checkProjValid(
      cs,
      c.index + 1,
      isBull,
      x.price,
      b.price,
      c.price,
      przLo,
      przHi,
      ext1618
    )
  ) {
    return null;
  }

  const abB = Math.max(
    3,
    b.index - a.index
  );
  const tIdx = Math.max(
    lastI + 1,
    c.index + abB
  );
  const est =
    lastD +
    (tIdx - lastI) *
      stepD *
      86400000;
  const dNode = {
    index: tIdx,
    date: est,
    price: dP,
    isHigh: !isBull
  };
  return {
    name: nm,
    isBull,
    isComp: false,
    nodes: [x, a, b, c, dNode],
    przLo,
    przHi,
    dIdx: tIdx,
    dDate: est
  };
}

function detectHarmonics(
  cs,
  swings,
  iv
) {
  const n = swings.length;
  if (n < 4 || !cs.length) {
    return null;
  }
  const lastI = cs.length - 1;
  const lastD = cs[lastI].date;
  const stepD = approxDays(iv);
  const maxSh = Math.min(18, n - 4);
  let fb = null;

  for (
    let sh = 0;
    sh <= maxSh;
    sh++
  ) {
    const endP = n - 1 - sh;
    const isBack = sh > 0;
    if (endP >= 4) {
      const hit = evalXABCD(
        swings[endP - 4],
        swings[endP - 3],
        swings[endP - 2],
        swings[endP - 1],
        swings[endP],
        cs,
        isBack
      );
      if (hit) {
        if (hit[1]) return hit[0];
        if (!fb) fb = hit[0];
      }
    }
    if (sh === 0) {
      const proj = projFromXABC(
        swings[n - 4],
        swings[n - 3],
        swings[n - 2],
        swings[n - 1],
        cs,
        lastI,
        lastD,
        stepD
      );
      if (proj) return proj;
    }
  }
  return fb;
}

function calcMechStop(
  cs,
  mSwings,
  isUp,
  iv
) {
  const last = cs[cs.length - 1];
  const intra = isIntraIv(iv);
  const dUp = intra ? 0.985 : 0.96;
  const dDn = intra ? 1.015 : 1.04;
  const dLbl = intra
    ? "日內1.5%窄幅硬性止損"
    : "江恩4%標準保護止損";

  let stUp = 0;
  let stDn = 0;
  for (
    let i = cs.length - 1;
    i > 0;
    i--
  ) {
    const c = cs[i];
    const p = cs[i - 1];
    if (
      c.high > p.high &&
      c.low >= p.low &&
      stDn === 0
    ) {
      stUp++;
    } else if (
      c.low < p.low &&
      c.high <= p.high &&
      stUp === 0
    ) {
      stDn++;
    } else {
      break;
    }
  }
  const mid =
    (last.high + last.low) / 2;
  if (isUp) {
    if (stUp >= 7) {
      return [
        last.low * 0.996,
        "連續" +
          stUp +
          "期單邊(7期法則收緊止損)"
      ];
    }
    const pH =
      cs.length >= 2
        ? cs[cs.length - 2].high
        : last.high;
    if (
      last.high > pH &&
      last.close < last.open &&
      last.close < mid
    ) {
      return [
        last.low * 0.996,
        "出現三重信號頂部(破低即離場)"
      ];
    }
    const loPt = [...mSwings]
      .reverse()
      .find(
        s =>
          !s.isHigh &&
          s.price < last.close
      );
    if (loPt) {
      return [
        loPt.price * 0.995,
        "機械擺動底(" +
          fmtDate(loPt.date, intra) +
          ")"
      ];
    }
    return [last.close * dUp, dLbl];
  } else {
    if (stDn >= 7) {
      return [
        last.high * 1.004,
        "連續" +
          stDn +
          "期單邊(7期法則收緊止損)"
      ];
    }
    const pL =
      cs.length >= 2
        ? cs[cs.length - 2].low
        : last.low;
    if (
      last.low < pL &&
      last.close > last.open &&
      last.close > mid
    ) {
      return [
        last.high * 1.004,
        "出現三重信號底部(升破即平倉)"
      ];
    }
    const hiPt = [...mSwings]
      .reverse()
      .find(
        s =>
          s.isHigh &&
          s.price > last.close
      );
    if (hiPt) {
      return [
        hiPt.price * 1.005,
        "機械擺動頂(" +
          fmtDate(hiPt.date, intra) +
          ")"
      ];
    }
    return [last.close * dDn, dLbl];
  }
}

function calcOverbalance(
  cs,
  swings,
  isUp,
  iv,
  tMode
) {
  if (swings.length < 4) {
    return "波段數據累積中，平衡正常";
  }
  const last = cs[cs.length - 1];
  const u = unitName(iv);
  let maxDp = 0;
  let maxDt = 0;
  for (
    let i = 1;
    i < swings.length;
    i++
  ) {
    const a = swings[i - 1];
    const b = swings[i];
    const dt = Math.abs(
      barTimeDelta(
        cs,
        a.index,
        b.index,
        iv,
        tMode
      )
    );
    if (
      isUp &&
      a.isHigh &&
      !b.isHigh
    ) {
      maxDp = Math.max(
        maxDp,
        a.price - b.price
      );
      maxDt = Math.max(maxDt, dt);
    } else if (
      !isUp &&
      !a.isHigh &&
      b.isHigh
    ) {
      maxDp = Math.max(
        maxDp,
        b.price - a.price
      );
      maxDt = Math.max(maxDt, dt);
    }
  }
  const tail =
    swings[swings.length - 1];
  if (maxDp <= 0) {
    return "時空平衡維持正常";
  }
  const curDt = Math.abs(
    barTimeDelta(
      cs,
      tail.index,
      last.id,
      iv,
      tMode
    )
  );
  const curDp = isUp
    ? Math.max(
      0,
      tail.price - last.low
    )
    : Math.max(
      0,
      last.high - tail.price
    );
  const pOv = curDp > maxDp;
  const tOv =
    curDt > maxDt &&
    curDp > maxDp * 0.5;
  if (pOv || tOv) {
    return (
      "⚠️已觸發平衡超越！當前回調" +
      fmt(curDp) +
      "(" +
      curDt.toFixed(0) +
      u +
      ")已超前浪極值" +
      fmt(maxDp) +
      "(" +
      maxDt.toFixed(0) +
      u +
      ")，防範反轉"
    );
  }
  return (
    "平衡正常（前浪最大回調" +
    fmt(maxDp) +
    "/" +
    maxDt.toFixed(0) +
    u +
    "，當前" +
    fmt(curDp) +
    "/" +
    curDt.toFixed(0) +
    u +
    "）"
  );
}

function calcVolumeDiag(cs) {
  const valid = cs.filter(
    c => c.volume > 0
  );
  if (valid.length < 60) {
    return "指數/無成交量數據，略過量能";
  }
  const rec50 = cs
    .slice(-50)
    .reduce(
      (a, b) => a + b.volume,
      0
    );
  const prev50 = cs
    .slice(-100, -50)
    .reduce(
      (a, b) => a + b.volume,
      0
    );
  const ySub = cs.slice(-250);
  let maxV = 1;
  for (const c of ySub) {
    if (c.volume > maxV) {
      maxV = c.volume;
    }
  }
  const curV =
    cs[cs.length - 1].volume;
  const shrink = curV / maxV;
  const tags = [];
  if (prev50 > 0) {
    const r = rec50 / prev50;
    if (r >= 2.0) {
      tags.push(
        "50期吸籌動量比 " +
          r.toFixed(2) +
          "x(>2.0主力放量)"
      );
    } else {
      tags.push(
        "50期量能動量比 " +
          r.toFixed(2) +
          "x"
      );
    }
  }
  if (shrink > 0 && shrink <= 0.25) {
    tags.push(
      "當前量僅區間峰值" +
        Math.round(shrink * 100) +
        "%（地量見地價特徵）"
    );
  }
  return tags.join("；");
}

function calcDailyGuide(
  dCs,
  iv,
  isUpFan
) {
  if (!isIntraIv(iv)) return "";
  if (dCs.length < 20) {
    return "日線定方向：載入日線結構中";
  }
  const dSw = detectSwings(
    dCs,
    "1d"
  );
  const dAnc = pickAnchor(
    dCs,
    dSw,
    null,
    "auto"
  );
  const dUp = !dAnc.isHigh;
  const dVol = calcVol(
    dCs,
    dAnc,
    dSw,
    "1d",
    "trading"
  );
  const lastD = dCs[dCs.length - 1];
  const dt = lastD.id - dAnc.index;
  const s = dUp ? 1 : -1;
  const p1 = Math.max(
    0,
    dAnc.price + s * dVol * dt
  );
  const above = lastD.close >= p1;
  const dTxt = above
    ? "日線多頭強勢(1x1上方)"
    : "日線空頭弱勢(1x1下方)";
  const align =
    above === isUpFan
      ? "順應日線主趨勢"
      : "⚠️逆日線主方向(僅作短線反抽)";
  return dTxt + "｜" + align;
}

function runAnalysis() {
  const cs = st.candles;
  if (cs.length < 20) return;
  const iv = st.interval;
  const intra = isIntraIv(iv);
  const effMode = intra
    ? "trading" : st.timeMode;

  const swings = detectSwings(cs, iv);
  const mSwings = buildMechSwings(
    cs,
    2
  );
  const anc = pickAnchor(
    cs,
    swings,
    st.customAnc,
    st.dir
  );
  const isUp =
    st.dir === "up"
      ? true
      : (st.dir === "down"
        ? false : !anc.isHigh);
  const bVol = calcVol(
    cs,
    anc,
    swings,
    iv,
    effMode
  );
  const vol = Math.max(
    0.0001,
    bVol * st.volMult
  );
  const lastI = cs.length - 1;
  const endIdx =
    lastI + st.horizon;
  const rays = buildRays(
    cs,
    anc,
    isUp,
    vol,
    endIdx,
    iv,
    effMode
  );
  const hits = calcTimeHits(
    cs,
    anc,
    swings,
    vol,
    st.horizon,
    iv,
    effMode
  );
  const { fibs, pcts, gm } =
    calcFibsAndGrid(cs);
  const harm = detectHarmonics(
    cs,
    swings,
    iv
  );
  const stopInfo = calcMechStop(
    cs,
    mSwings,
    isUp,
    iv
  );
  const obMsg = calcOverbalance(
    cs,
    swings,
    isUp,
    iv,
    effMode
  );
  const volMsg = calcVolumeDiag(cs);
  const dailyHint = calcDailyGuide(
    st.dailyCandles,
    iv,
    isUp
  );

  const last = cs[lastI];
  const dtNow = barTimeDelta(
    cs,
    anc.index,
    last.id,
    iv,
    effMode
  );
  const sign = isUp ? 1 : -1;
  const p1x1 = Math.max(
    0,
    anc.price + sign * vol * dtNow
  );
  const posH =
    last.close >= p1x1
      ? "位於 1x1(45度) 強勢線上方"
      : "處於 1x1(45度) 弱勢線下方";
  const dirTxt = isUp
    ? "上升" : "下跌";
  const modeNm =
    st.dir === "up"
      ? "向上"
      : (st.dir === "down"
        ? "向下" : "自動");
  const tTag = intra
    ? "交易K線連續"
    : (effMode === "calendar"
      ? "自然日" : "交易日");
  const uNm =
    effMode === "calendar" &&
    iv === "1d"
      ? "自然日" : unitName(iv);
  const titleF = st.name
    ? st.code + " " + st.name
    : st.code;

  const rep = [];
  rep.push("【江恩時空推演報告】");
  rep.push("標的：" + titleF);
  rep.push(
    "維度：" +
      ivTitle(iv) +
      "(" +
      tTag +
      ") | 現價：" +
      fmt(last.close)
  );
  if (dailyHint) {
    rep.push(
      "多週期過濾：" + dailyHint
    );
  }
  rep.push(
    "起點：" +
      fmtDate(anc.date, intra) +
      " (" +
      fmt(anc.price) +
      ")"
  );
  rep.push(
    "角度方向：" +
      dirTxt +
      "江恩線(" +
      modeNm +
      ")"
  );
  rep.push(
    "獨立波動率：" +
      fmt(vol) +
      "/" +
      uNm
  );
  rep.push(
    "1x1主線現值：" + fmt(p1x1)
  );
  rep.push("強弱診斷：" + posH);
  rep.push("平衡超越：" + obMsg);
  rep.push("量能結構：" + volMsg);
  rep.push("");
  rep.push(
    intra
      ? "【日內圓周與短線轉勢窗口】"
      : "【大級別圓周與轉勢窗口】"
  );

  const majHits = hits.filter(
    h => h.isMajor
  );
  const showH = majHits.length
    ? majHits.slice(0, 3)
    : hits.slice(0, 3);
  if (showH.length === 0) {
    rep.push(
      "延伸期內暫無重大轉勢共振"
    );
  } else {
    for (const h of showH) {
      const dtFut = barTimeDelta(
        cs,
        anc.index,
        h.targetIndex,
        iv,
        effMode
      );
      const t1 = Math.max(
        0,
        anc.price +
          sign * vol * dtFut
      );
      const t2 = Math.max(
        0,
        anc.price +
          sign * vol * 2 * dtFut
      );
      const t3 = Math.max(
        0,
        anc.price +
          sign * vol * 0.5 * dtFut
      );
      const tag = h.isMajor
        ? "★核心轉折" : "轉勢窗";
      rep.push(

          "：" +
          fmtDate(h.estDate, intra)
      );

  for (const p of pcts) {

          fmt(p.price)

  rep.push("");
  rep.push("【黃金比率匯聚位】");
  for (const f of fibs.slice(0, 4)) {

      f.label +
        "：" +

  }

  rep.push("");
  rep.push("【和諧形態掃描】");
  if (harm) {

      ? "已成型反轉" : "推演完成中";
    rep.push(

        harm.name +

        fmtDate(harm.dDate, intra)

  rep.push("");
  rep.push("【江恩機械擺動風控】");

    "動態機械止損：" +
      fmt(stopInfo[0])
  );
  rep.push(
    "止損依據：" + stopInfo[1]
  );
  rep.push(
    intra
      ? "短線鐵則：嚴禁過度交易，" +
        "單筆風險控管於2%~5%內"
      : "資金控管：單筆不超總資金10%"
  );

  st.res = {
    anc,
    isUp,
    vol,
    effMode,
    rays,
    hits,
    fibs,
    pcts,
    harm,
    mSwings,
    stopInfo,
    report: rep.join("\n")

  document.getElementById(

  ).textContent = intra
    ? "日內圓周與短線轉勢窗口"
    : "大級別圓周與轉勢窗口";
  const dBadge =
    document.getElementById(
      "dailyHintBadge"
    );
  if (dailyHint) {
    dBadge.textContent = dailyHint;
    dBadge.style.display = "block";
  } else {
    dBadge.style.display = "none";
  }

  const topHit = showH[0];
  const badge =
    document.getElementById(
      "turnBadge"
    );
  if (topHit) {
    badge.style.display =
      topHit.isMajor
        ? "block" : "none";
    document.getElementById(
      "turnDate"
    ).textContent =

      fmtDate(topHit.estDate, intra);

    ).textContent =

      cs,
      anc.index,
      topHit.targetIndex,

      0,
      anc.price + sign * vol * dtFut
    );

      "turnDate"
    ).textContent = "暫無強共振";

      "turnWhy"
    ).textContent = "--";
    document.getElementById(
      "turnPrice"

  }

  const hBadge =
    document.getElementById(
      "harmBadge"
    );
  if (harm) {

      harm.name.includes("回溯")
        ? "block" : "none";

      "harmName"
    ).textContent =
      "形態：" + harm.name;

      "harmDate"
    ).textContent =

      fmtDate(harm.dDate, intra);

      "harmPrz"

      "harmName"
    ).textContent =

      "暫無有效" +
