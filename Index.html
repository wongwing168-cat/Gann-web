<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width,
    initial-scale=1.0">
<meta
  name="theme-color"
  content="#0b0d12">
<title>江恩時空共振與和諧分析</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  background: #090b10;
  color: #f1f5f9;
  font-family: -apple-system,
    BlinkMacSystemFont,
    "Segoe UI", sans-serif;
  padding: 10px;
}
.app {
  max-width: 1440px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  background: #141821;
  padding: 8px 10px;
  border-radius: 10px;
  border: 1px solid #242b38;
}
.seg {
  display: inline-flex;
  background: #0b0d12;
  border-radius: 7px;
  padding: 2px;
  border: 1px solid #283040;
}
.seg button {
  background: transparent;
  color: #94a3b8;
  border: none;
  padding: 5px 9px;
  font-size: 12px;
  border-radius: 5px;
  cursor: pointer;
}
.seg button.on {
  background: #2563eb;
  color: #fff;
  font-weight: 600;
}
.btn {
  background: #1e2533;
  color: #e2e8f0;
  border: 1px solid #334155;
  padding: 5px 9px;
  font-size: 12px;
  border-radius: 6px;
  cursor: pointer;
}
.btn:hover {
  background: #2a3447;
}
.btn.on {
  background: #0f766e;
  border-color: #14b8a6;
  color: #fff;
}
.btn-hi {
  background: #ea580c;
  border-color: #f97316;
  color: #fff;
  font-weight: 600;
}
.btn-y {
  color: #facc15;
  border-color: #854d0e;
}
.btn-c {
  color: #38bdf8;
  border-color: #075985;
}
.btn-m {
  color: #34d399;
  border-color: #065f46;
}
.btn-del {
  color: #f87171;
  border-color: #7f1d1d;
  padding: 5px 7px;
}
.ac-wrap {
  position: relative;
  display: inline-block;
}
.ac-box {
  position: absolute;
  top: 100%;
  left: 0;
  margin-top: 4px;
  width: 295px;
  max-height: 280px;
  overflow-y: auto;
  background: #181e29;
  border: 1px solid #38bdf8;
  border-radius: 8px;
  box-shadow: 0 8px 24px #000;
  z-index: 99;
  display: none;
}
.ac-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  padding: 7px 9px;
  border-bottom: 1px solid #242b38;
  cursor: pointer;
  font-size: 12px;
}
.ac-item:hover {
  background: #253042;
}
.ac-sym {
  font-weight: 700;
  color: #facc15;
  min-width: 62px;
}
.ac-nm {
  color: #f1f5f9;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ac-bdg {
  font-size: 10px;
  padding: 2px 5px;
  border-radius: 4px;
  background: #064e3b;
  color: #34d399;
  white-space: nowrap;
}
.ac-otc {
  background: #27272a;
  color: #a1a1aa;
}
input, select {
  background: #0b0d12;
  color: #fff;
  border: 1px solid #334155;
  padding: 5px 8px;
  border-radius: 6px;
  font-size: 13px;
}
input {
  width: 112px;
  text-transform: uppercase;
}
select {
  max-width: 155px;
}
.lbl {
  font-size: 12px;
  color: #94a3b8;
}
.src-tag {
  font-size: 11px;
  color: #34d399;
  background: #064e3b;
  padding: 2px 7px;
  border-radius: 5px;
}
.sp {
  flex: 1;
}
.err {
  background: #7f1d1d;
  color: #fecaca;
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 12px;
  display: none;
}
.warn {
  background: #78350f;
  color: #fde68a;
}
.main {
  display: grid;
  grid-template-columns: 1.68fr 1fr;
  gap: 10px;
  min-height: 76vh;
}
@media (max-width: 860px) {
  .main {
    grid-template-columns: 1fr;
  }
}
.chart-box {
  background: #12161f;
  border: 1px solid #242b38;
  border-radius: 12px;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-height: 480px;
}
.hud {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
  font-size: 12px;
}
.hud-txt {
  color: #f8fafc;
  font-weight: 500;
}
.c-wrap {
  position: relative;
  flex: 1;
  min-height: 420px;
  touch-action: none;
}
canvas {
  width: 100%;
  height: 100%;
  display: block;
  border-radius: 8px;
  cursor: crosshair;
}
.load {
  position: absolute;
  inset: 0;
  background: rgba(9, 11, 16, 0.78);
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  color: #38bdf8;
  border-radius: 8px;
}
.side {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 82vh;
  overflow-y: auto;
}
.card {
  background: #141821;
  border: 1px solid #242b38;
  border-radius: 12px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.c-hd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-weight: 700;
  font-size: 14px;
}
.c-org { color: #fb923c; }
.c-mnt { color: #34d399; }
.c-yel { color: #facc15; }
.c-pnk {
  color: #f472b6;
  font-size: 12px;
  font-weight: 700;
}
.c-big {
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  line-height: 1.45;
}
.c-sub {
  font-size: 12px;
  color: #fde047;
}
.c-val {
  font-size: 13px;
  color: #38bdf8;
}
.rep {
  font-size: 13px;
  line-height: 1.55;
  color: #e2e8f0;
  white-space: pre-wrap;
}
</style>
</head>

    <button

  </div>

  <div class="err" id="errBox"></div>

  <div class="main">
    <div class="chart-box">
      <div class="hud">
        <span
          class="hud-txt"
          id="hudTxt">載入中...</span>
        <div class="sp"></div>
        <button
          class="btn btn-m"
          id="btnHistBack"
          style="display:none">
          ◀ 向前
        </button>
        <button
          class="btn btn-m"
          id="btnHistFwd"
          style="display:none">
          向後 ▶
        </button>
        <button
          class="btn btn-hi"
          id="btnLatest"
          style="display:none">
          回最新
        </button>
        <button
          class="btn btn-hi"
          id="btnMode">移動時間線</button>
        <button
          class="btn btn-c"
          id="btnZoomIn">+</button>
        <button
          class="btn btn-c"
          id="btnZoomOut">-</button>
        <button
          class="btn btn-hi"
          id="btnSetAnc"
          style="display:none">
          設為起點
        </button>
        <button
          class="btn btn-y"
          id="btnAutoAnc">自動起點</button>
      </div>
      <div
        class="c-wrap"
        id="cWrap">
        <canvas id="cv"></canvas>
        <div
          class="load"
          id="loadBox">
          切換線路抓取報價中...
        </div>
      </div>
    </div>

    <div class="side">
      <div class="card">
        <div class="c-hd c-org">
          <span>大級別圓周與轉勢窗口</span>
        </div>
        <div
          class="c-pnk"
          id="turnBadge"
          style="display:none">

        </div>
        <div
          class="c-big"
          id="turnDate">--</div>
        <div
          class="c-sub"
          id="turnWhy">--</div>
        <div
          class="c-val"
          id="turnPrice">--</div>
      </div>

      <div class="card">
        <div class="c-hd c-mnt">
          <span>和諧交易形態推演</span>
        </div>
        <div
          class="c-big"
          id="harmName">--</div>
        <div
          class="c-sub"
          id="harmDate">--</div>
        <div
          class="c-val"
          id="harmPrz">--</div>
      </div>

      <div class="card">
        <div class="c-hd c-yel">
          <span id="repTitle">
            江恩策略建議
          </span>
          <button
            class="btn"
            id="btnCopy">複製報告</button>
        </div>
        <div
          class="rep"
          id="repBody">載入中...</div>
      </div>
    </div>
  </div>
</div>

const NAMES = {};
for (const c of CATALOG) {
  NAMES[c.s] = c.n;
}

const PREF_KEY = "gann_web_prefs_v1";
const SAVED_KEY = "gann_web_saved_v1";

const st = {
  market: "hk",
  code: "^HSI",
  name: "恒生指數",
  style: "candle",
  interval: "1wk",
  horizon: 60,
  dir: "auto",
  candles: [],
  res: null,
  customAnc: null,
  volMult: 1.0,
  showGrid: true,
  showFib: false,
  showHarm: true,
  selBar: null,
  histBars: 120,
  panOff: 0,
  moveLine: true,
  reqId: 0,
  pillBox: null,
  acTimer: null,
  saved: []
};

function savePrefs() {
  const obj = {
    market: st.market,
    code: st.code,
    name: st.name,
    style: st.style,
    interval: st.interval,
    horizon: st.horizon,
    dir: st.dir,
    volMult: st.volMult,
    showGrid: st.showGrid,
    showFib: st.showFib,
    showHarm: st.showHarm,
    histBars: st.histBars,
    moveLine: st.moveLine
  };
  try {
    localStorage.setItem(
      PREF_KEY,
      JSON.stringify(obj)
    );
  } catch (e) {}
}

function persistSaved() {
  try {
    localStorage.setItem(
      SAVED_KEY,
      JSON.stringify(st.saved)
    );
  } catch (e) {}
}

function recordSaved(sym, nm, mkt) {
  const disp = nm || sym;
  st.saved = st.saved.filter(
    x => x.s !== sym
  );
  st.saved.unshift({
    s: sym,
    n: disp,
    m: mkt
  });
  if (st.saved.length > 30) {
    st.saved = st.saved.slice(0, 30);
  }
  persistSaved();
  fillPresets();
}

function restoreState() {
  const rawS =
    localStorage.getItem(SAVED_KEY);
  if (rawS != null) {
    try {
      st.saved = JSON.parse(rawS);
    } catch (e) {
      st.saved = [];
    }
  } else {
    st.saved = [
      {
        s: "^HSI",
        n: "恒生指數",
        m: "hk"
      },
      {
        s: "0700.HK",
        n: "騰訊控股",
        m: "hk"
      },
      {
        s: "^IXIC",
        n: "納斯達克指數",
        m: "us"
      },
      {
        s: "AAPL",
        n: "蘋果公司 Apple",
        m: "us"
      }
    ];
    persistSaved();
  }

  const rawP =
    localStorage.getItem(PREF_KEY);
  if (rawP) {
    try {
      const p = JSON.parse(rawP);
      if (p.market) st.market = p.market;
      if (p.code) st.code = p.code;
      if (p.name != null) {
        st.name = p.name;
      }
      if (p.style) st.style = p.style;
      if (p.interval) {
        st.interval = p.interval;
      }
      if (p.horizon) {
        st.horizon = p.horizon;
      }
      if (p.dir) st.dir = p.dir;
      if (p.volMult) {
        st.volMult = p.volMult;
      }
      if (typeof p.showGrid === "boolean") {
        st.showGrid = p.showGrid;
      }
      if (typeof p.showFib === "boolean") {
        st.showFib = p.showFib;
      }
      if (typeof p.showHarm === "boolean") {
        st.showHarm = p.showHarm;
      }
      if (p.histBars) {
        st.histBars = p.histBars;
      }
      if (typeof p.moveLine === "boolean") {
        st.moveLine = p.moveLine;
      }
    } catch (e) {}
  }

  setSegVal("mktSeg", st.market);
  setSegVal("stySeg", st.style);
  setSegVal("intSeg", st.interval);
  setSegVal("horSeg", st.horizon);
  setSegVal("dirSeg", st.dir);
  document.getElementById(
    "codeInp"
  ).value = st.code;
  document.getElementById(
    "togGrid"
  ).classList.toggle("on", st.showGrid);
  document.getElementById(
    "togFib"
  ).classList.toggle("on", st.showFib);
  document.getElementById(
    "togHarm"
  ).classList.toggle("on", st.showHarm);
  document.getElementById(
    "volLbl"
  ).textContent =
    "波動:" +
    st.volMult.toFixed(1) + "x";

  const bMode =
    document.getElementById("btnMode");
  bMode.textContent = st.moveLine
    ? "移動時間線" : "拖動歷史";

    "btn-hi",
    st.moveLine
  );
  bMode.classList.toggle(
    "on",
    !st.moveLine
  );
}

function fmt(v) {
  return Number(v).toFixed(2);
}

function fmtAxisP(p) {
  if (p >= 10000) {
    return Math.round(p).toString();
  }
  if (p >= 1000) {
    return Number(p).toFixed(1);
  }
  return Number(p).toFixed(2);
}

function fmtDate(d) {
  const y = d.getFullYear();
  const m = String(
    d.getMonth() + 1
  ).padStart(2, "0");
  const day = String(
    d.getDate()
  ).padStart(2, "0");
  return y + "-" + m + "-" + day;
}

function addDays(d, days) {
  const ms = d.getTime() +
    days * 86400000;
  return new Date(ms);
}

function intvMeta(iv) {
  if (iv === "1wk") {
    return {
      t: "週線",
      days: 7.0,
      u: "週"
    };
  }
  if (iv === "1mo") {
    return {
      t: "月線",
      days: 30.44,
      u: "月"
    };
  }
  return {
    t: "日線",
    days: 1.45,
    u: "日"
  };
}

function priceAtBar(bar) {
  const cs = st.candles;
  if (cs.length === 0) return 0;
  if (bar >= 0 && bar < cs.length) {
    return cs[bar].close;
  }
  if (st.res) {
    const r = st.res;
    const dt = bar - r.anc.index;
    const s = r.isUp ? 1 : -1;
    return Math.max(
      0,
      r.anc.price + s * r.vol * dt
    );
  }
  return cs[cs.length - 1].close;
}

function fullDateAtBar(bar) {
  const cs = st.candles;
  if (cs.length === 0) return "--";
  const lastI = cs.length - 1;
  if (bar >= 0 && bar <= lastI) {
    return fmtDate(cs[bar].date);
  }
  const diff = bar - lastI;
  const meta = intvMeta(st.interval);
  const est = addDays(
    cs[lastI].date,
    diff * meta.days
  );
  return fmtDate(est);
}

function shortDateAtBar(bar) {
  const full = fullDateAtBar(bar);
  if (full.length < 10) return full;
  if (st.interval === "1mo") {
    return full.slice(0, 7);
  }
  return full.slice(5);
}

function fillPill(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.fill();
}

function normSym(raw, mkt) {
  let c = raw.trim().toUpperCase();
  if (!c) {
    return mkt === "hk"
      ? "^HSI" : "^IXIC";
  }
  const idx = [
    "HSI", "HSCE", "IXIC",
    "GSPC", "DJI"
  ];
  if (idx.includes(c)) {
    return "^" + c;
  }
  if (c === "BRK.B") c = "BRK-B";
  if (c === "BRK.A") c = "BRK-A";
  if (mkt === "hk" &&
    !c.endsWith(".HK") &&
    !c.startsWith("^")) {
    const d = c.replace(/\D/g, "");
    if (d.length > 0) {
      return d.padStart(4, "0") +
        ".HK";
    }
  }
  return c;
}

async function searchStocks(q) {
  const clean = q.trim();
  if (!clean) return [];
  const up = clean.toUpperCase();
  const list = [];
  const seen = new Set();

  for (const item of CATALOG) {
    const mS = item.s
      .toUpperCase()
      .includes(up);
    const mN = item.n
      .toUpperCase()
      .includes(up);
    if (mS || mN) {
      list.push(item);
      seen.add(item.s);
    }
  }

  try {
    const url =
      "/.netlify/functions/yahoo" +
      "?action=search&q=" +
      encodeURIComponent(clean);
    const r = await fetch(url);
    if (r.ok) {
      const j = await r.json();
      const qts = j?.quotes || [];
      for (const qt of qts) {
        const sym = qt.symbol;
        if (!sym || seen.has(sym)) {
          continue;
        }
        const exR = (
          qt.exchDisp ||
          qt.exchange || "US"
        ).toUpperCase();
        const isHK =
          sym.endsWith(".HK") ||
          exR.includes("HKG") ||
          exR.includes("HKSE");
        const isOtc =
          exR.includes("OTC") ||
          exR.includes("PNK") ||
          exR.includes("PINK");
        const tpR = (
          qt.quoteType || ""
        ).toUpperCase();
        let tp = "股票";
        if (tpR === "ETF") tp = "ETF";
        if (tpR === "INDEX") tp = "指數";
        list.push({
          s: sym,
          n: NAMES[sym] ||
            qt.shortname ||
            qt.longname || sym,
          ex: isHK
            ? "HKEX"
            : (isOtc ? "OTC" : exR),
          tp,
          m: isHK ? "hk" : "us",
          otc: isOtc
        });
        seen.add(sym);
      }
    }
  } catch (e) {}

  list.sort((a, b) => {
    if (a.otc !== b.otc) {
      return a.otc ? 1 : -1;
    }
    return 0;
  });
  return list.slice(0, 8);
}

function parseYahoo(json, sym) {
  const res =
    json?.chart?.result?.[0];
  const ts = res?.timestamp;
  const q =
    res?.indicators?.quote?.[0];
  if (!ts || !q) {
    return {
      symbol: sym,
      name: "",
      candles: []
    };
  }
  const apiN =
    res.meta?.shortName ||
    res.meta?.longName || "";
  const fn = NAMES[sym] || apiN;
  const list = [];
  let idx = 0;
  for (let i = 0; i < ts.length; i++) {
    const o = q.open[i];
    const h = q.high[i];
    const l = q.low[i];
    const c = q.close[i];
    if (o == null || h == null ||
      l == null || c == null) {
      continue;
    }
    list.push({
      id: idx,
      date: new Date(ts[i] * 1000),
      open: o,
      high: h,
      low: l,
      close: c
    });
    idx++;
  }
  return {
    symbol: sym,
    name: fn,
    candles: list
  };
}

function detectSwings(candles) {
  const scope = candles.slice(-1260);
  const his = scope.map(c => c.high);
  const los = scope.map(c => c.low);
  const hiA = Math.max(...his);
  const loA = Math.min(...los);
  const sp = (hiA - loA) /
    Math.max(0.01, loA);
  const th = Math.max(
    0.025,
    Math.min(0.12, sp * 0.14)
  );
  const pts = [];
  let mode = 0;
  let cHi = candles[0].high;
  let cHiI = 0;
  let cLo = candles[0].low;
  let cLoI = 0;

  for (const c of candles) {
    if (c.high > cHi) {
      cHi = c.high;
      cHiI = c.id;
    }
    if (c.low < cLo) {
      cLo = c.low;
      cLoI = c.id;
    }
    if (mode === 0) {
      const up = (c.high - cLo) /
        Math.max(0.001, cLo);
      const dn = (cHi - c.low) /
        Math.max(0.001, cHi);
      if (up >= th) {
        pts.push({
          index: cLoI,
          date: candles[cLoI].date,
          price: cLo,
          isHigh: false
        });
        mode = 1;
        cHi = c.high;
        cHiI = c.id;
      } else if (dn >= th) {
        pts.push({
          index: cHiI,
          date: candles[cHiI].date,
          price: cHi,
          isHigh: true
        });
        mode = -1;
        cLo = c.low;
        cLoI = c.id;
      }
    } else if (mode === 1) {
      const dr = (cHi - c.low) /
        Math.max(0.001, cHi);
      if (dr >= th) {
        pts.push({
          index: cHiI,
          date: candles[cHiI].date,
          price: cHi,
          isHigh: true
        });
        mode = -1;
        cLo = c.low;
        cLoI = c.id;
      }
    } else {
      const ri = (c.high - cLo) /
        Math.max(0.001, cLo);
      if (ri >= th) {
        pts.push({
          index: cLoI,
          date: candles[cLoI].date,
          price: cLo,
          isHigh: false
        });
        mode = 1;
        cHi = c.high;
        cHiI = c.id;
      }
    }
  }
  return pts;
}

function pickAnchor(
  candles,
  swings,
  customIdx,
  dir
) {
  if (customIdx != null &&
    customIdx >= 0 &&
    customIdx < candles.length) {
    const c = candles[customIdx];
    let isH = false;
    if (dir === "up") {
      isH = false;
    } else if (dir === "down") {
      isH = true;
    } else {
      const mid = (c.high + c.low) / 2;
      isH = c.close < mid;
    }
    return {
      index: customIdx,
      date: c.date,
      price: isH ? c.high : c.low,
      isHigh: isH
    };
  }
  const lb = Math.min(
    candles.length,
    160
  );
  const start = candles.length - lb;
  const rec = swings.filter(s =>
    s.index >= start &&
    s.index < candles.length - 5
  );
  if (dir === "up") {
    const lows = rec.filter(
      s => !s.isHigh
    );
    if (lows.length > 0) {
      return lows[lows.length - 1];
    }
  } else if (dir === "down") {
    const highs = rec.filter(
      s => s.isHigh
    );
    if (highs.length > 0) {
      return highs[highs.length - 1];
    }
  } else if (rec.length > 0) {
    return rec[rec.length - 1];
  }

  if (dir === "down") {
    let maxC = candles[start];
    for (
      let i = start;
      i < candles.length;
      i++
    ) {
      if (candles[i].high > maxC.high) {
        maxC = candles[i];
      }
    }
    return {
      index: maxC.id,
      date: maxC.date,
      price: maxC.high,
      isHigh: true
    };
  }
  let minC = candles[start];
  for (
    let i = start;
    i < candles.length;
    i++
  ) {
    if (candles[i].low < minC.low) {
      minC = candles[i];
    }
  }
  return {
    index: minC.id,
    date: minC.date,
    price: minC.low,
    isHigh: false
  };
}

function calcVol(
  candles,
  anc,
  swings
) {
  const aft = swings.filter(
    s => s.index > anc.index + 3
  );
  if (aft.length > 0) {
    const nx = aft[0];
    const dp = Math.abs(
      nx.price - anc.price
    );
    const dt = Math.max(
      1,
      nx.index - anc.index
    );
    return dp / dt;
  }
  const last =
    candles[candles.length - 1];
  const dp = Math.abs(
    last.close - anc.price
  );
  const dt = Math.max(
    1,
    last.id - anc.index
  );
  return dp / dt;
}

function buildRays(
  anc,
  isUp,
  vol,
  endIdx
) {
  const specs = [
    ["8x1", 8],
    ["4x1", 4],
    ["3x1", 3],
    ["2x1", 2],
    ["1x1", 1],
    ["1x2", 0.5],
    ["1x3", 1 / 3],
    ["1x4", 0.25],
    ["1x8", 0.125]
  ];
  const sign = isUp ? 1 : -1;
  return specs.map(([name, r]) => {
    const p0 = anc.price;
    const dt = endIdx - anc.index;
    const p1 = Math.max(
      0,
      p0 + sign * vol * r * dt
    );
    return {
      name,
      ratio: r,
      isPrimary: name === "1x1",
      pts: [
        { bar: anc.index, price: p0 },
        { bar: endIdx, price: p1 }
      ]
    };
  });
}

function moonEvent(dt) {
  const ref = 947182440000;
  const syn = 29.53058867;
  const diff =
    (dt.getTime() - ref) / 86400000;
  let ph = diff % syn;
  if (ph < 0) ph += syn;
  if (ph <= 1.0 || ph >= syn - 1.0) {
    return "天文新月窗口";
  }
  if (Math.abs(ph - syn / 2) <= 1.0) {
    return "天文滿月窗口";
  }
  return null;
}

function calcTimeHits(
  candles,
  anc,
  swings,
  hor,
  iv
) {
  const fibs = [
    5, 8, 13, 21, 34, 55, 89, 144, 233
  ];
  const g7 = [
    7, 14, 28, 30, 42, 45, 49, 60,
    77, 90, 120, 144, 180, 270, 360
  ];
  const lastI = candles.length - 1;
  const lastD = candles[lastI].date;
  const map = new Map();
  const majSet = new Set();
  const meta = intvMeta(iv);
  const u = meta.u;

  const pushR = (t, msg, isMaj) => {
    if (!map.has(t)) map.set(t, []);
    map.get(t).push(msg);
    if (isMaj) majSet.add(t);
  };

  for (const f of fibs) {
    const t = anc.index + f;
    const d = t - lastI;
    if (d >= 1 && d <= hor) {
      pushR(
        t,
        "費波那契第" + f + u,
        false
      );
    }
  }
  for (const g of g7) {
    const t = anc.index + g;
    const d = t - lastI;
    if (d >= 1 && d <= hor) {
      const m = [
        90, 180, 270, 360
      ].includes(g);
      pushR(
        t,
        "江恩神奇數" + g + u,
        m
      );
    }
  }

  const safeEnd = Math.max(
    1,
    lastI - 4
  );
  let topB = candles[0];
  let botB = candles[0];
  for (let i = 0; i < safeEnd; i++) {
    if (candles[i].high > topB.high) {
      topB = candles[i];
    }
    if (candles[i].low < botB.low) {
      botB = candles[i];
    }
  }

  const addCir = (refI, rName) => {
    const cs = iv === "1mo"
      ? [60, 90, 120, 180, 240, 360]
      : [90, 180, 270, 360];
    for (const c of cs) {
      const t = refI + c;
      const d = t - lastI;
      if (d >= 1 && d <= hor) {
        let note = "";
        if (iv === "1wk" &&
          c === 180) {
          note = "(約3.5年)";
        } else if (iv === "1wk" &&
          c === 360) {
          note = "(約7年)";
        } else if (iv === "1mo" &&
          c === 120) {
          note = "(10年周期)";
        } else if (iv === "1mo" &&
          c === 360) {
          note = "(30年土星)";
        }
        const msg = rName + "滿" +
          c + u + note;
        pushR(t, msg, true);
      }
    }
  };
  addCir(topB.id, "歷史大頂");
  addCir(botB.id, "歷史大底");

  if (swings.length > 0) {
    const rec =
      swings[swings.length - 1];
    if (rec.index !== anc.index) {
      for (const f of [
        8, 13, 21, 34, 55
      ]) {
        const t = rec.index + f;
        const d = t - lastI;
        if (d >= 1 && d <= hor) {
          pushR(
            t,
            "次波段第" + f + u,
            false
          );
        }
      }
    }
  }

  if (iv === "1d") {
    for (let d = 1; d <= hor; d++) {
      const est = addDays(
        lastD,
        d * meta.days
      );
      const m = moonEvent(est);
      if (m) pushR(lastI + d, m, false);
    }
  }

  const keys = Array.from(
    map.keys()
  ).sort((a, b) => a - b);
  const hits = [];
  for (const k of keys) {
    const rs = map.get(k);
    const isMaj = majSet.has(k);
    const keyHit = rs.some(s =>
      s.includes("49") ||
      s.includes("55") ||
      s.includes("89") ||
      s.includes("90") ||
      s.includes("144") ||
      s.includes("180") ||
      s.includes("360")
    );
    if (isMaj ||
      rs.length >= 2 ||
      keyHit) {
      const d = k - lastI;
      hits.push({
        targetIndex: k,
        estDate: addDays(
          lastD,
          d * meta.days
        ),
        reasons: rs,
        strength: rs.length,
        isMajor: isMaj
      });
    }
  }
  return hits;
}

function calcFibs(candles, swings) {
  const sub = candles.slice(-260);
  const hi = Math.max(
    ...sub.map(c => c.high)
  );
  const lo = Math.min(
    ...sub.map(c => c.low)
  );
  const sp = hi - lo;
  const rs = [
    0.236, 0.382, 0.5,
    0.618, 0.786, 1.272
  ];
  const mPrices = [];
  if (swings.length >= 2) {
    const a =
      swings[swings.length - 2];
    const b =
      swings[swings.length - 1];
    const mHi = Math.max(
      a.price,
      b.price
    );
    const mLo = Math.min(
      a.price,
      b.price
    );
    for (const r of rs) {
      mPrices.push(
        mHi - (mHi - mLo) * r
      );
    }
  }
  return rs.map(r => {
    const p = hi - sp * r;
    const conf = mPrices.some(mp =>
      Math.abs(mp - p) /
        Math.max(1, p) < 0.018
    );
    return {
      ratio: r,
      label: "黃金" +
        Math.round(r * 1000),
      price: p,
      isConf: conf
    };
  });
}

function calcPctGrid(candles) {
  const sub = candles.slice(-260);
  const hi = Math.max(
    ...sub.map(c => c.high)
  );
  const lo = Math.min(
    ...sub.map(c => c.low)
  );
  const sp = hi - lo;
  const specs = [
    [0.125, "1/8(12.5%)", false],
    [0.25, "2/8(25%)", true],
    [1 / 3, "1/3(33.3%)", true],
    [0.375, "3/8(37.5%)", false],
    [0.5, "4/8(50%中軸)", true],
    [0.625, "5/8(62.5%)", false],
    [2 / 3, "2/3(66.7%)", true],
    [0.75, "6/8(75%)", true],
    [0.875, "7/8(87.5%)", false]
  ];
  return specs.map(([r, l, m]) => ({
    ratio: r,
    label: l,
    price: lo + sp * r,
    isMajor: m
  }));
}

function checkHarmPriceValid(
  candles,
  fromIdx,
  bull,
  xP,
  bP,
  cP,
  przLo,
  przHi,
  extLim
) {
  for (
    let i = fromIdx;
    i < candles.length;
    i++
  ) {
    const bar = candles[i];
    if (bull) {
      const fl = Math.min(
        przLo,
        extLim
      );
      if (bar.low < fl ||
        bar.low < xP ||
        bar.high > cP) {
        return false;
      }
    } else {
      const cl = Math.max(
        przHi,
        extLim
      );
      if (bar.low < bP ||
        bar.low < cP ||
        bar.high > cl ||
        bar.high > xP) {
        return false;
      }
    }
  }
  return true;
}

function detectHarmonic(
  candles,
  swings,
  iv
) {
  const n = swings.length;
  if (n < 4 || candles.length === 0) {
    return null;
  }
  const lastI = candles.length - 1;
  const lastD = candles[lastI].date;
  const step = intvMeta(iv).days;

  if (n >= 5) {
    const x = swings[n - 5];
    const a = swings[n - 4];
    const b = swings[n - 3];
    const c = swings[n - 2];
    const d = swings[n - 1];
    const bull =
      !x.isHigh && a.isHigh;
    const dirOk = bull
      ? (a.isHigh && !b.isHigh &&
        c.isHigh && !d.isHigh)
      : (!a.isHigh && b.isHigh &&
        !c.isHigh && d.isHigh);
    const ordOk = bull
      ? (a.price > c.price &&
        c.price > b.price &&
        b.price > d.price)
      : (a.price < c.price &&
        c.price < b.price &&
        b.price < d.price);

    if (dirOk && ordOk) {
      const xa = Math.abs(
        a.price - x.price
      );
      const ab = Math.abs(
        b.price - a.price
      );
      const bc = Math.abs(
        c.price - b.price
      );
      const ad = Math.abs(
        d.price - a.price
      );
      if (xa > 0 && ab > 0 && bc > 0) {
        const rAb = ab / xa;
        const rAd = ad / xa;
        let nm = "";
        if (rAb >= 0.35 &&
          rAb <= 0.54 &&
          rAd >= 0.82 &&
          rAd <= 0.94) {
          nm = bull
            ? "看漲蝙蝠形態"
            : "看跌蝙蝠形態";
        } else if (rAb >= 0.55 &&
          rAb <= 0.68 &&
          rAd >= 0.73 &&
          rAd <= 0.84) {
          nm = bull
            ? "看漲伽利222"
            : "看跌伽利222";
        } else {
          const cd = Math.abs(
            d.price - c.price
          );
          const cdAb = cd / ab;
          if (cdAb >= 0.88 &&
            cdAb <= 1.35) {
            nm = bull
              ? "看漲ABCD形態"
              : "看跌ABCD形態";
          }
        }
        if (nm) {
          const przLo = d.price * 0.985;
          const przHi = d.price * 1.015;
          const ok = checkHarmPriceValid(
            candles,
            d.index + 1,
            bull,
            x.price,
            b.price,
            c.price,
            przLo,
            przHi,
            bull ? przLo : przHi
          );
          if (ok) {
            return {
              name: nm,
              bull,
              done: true,
              nodes: [
                { l: "X", ...x },
                { l: "A", ...a },
                { l: "B", ...b },
                { l: "C", ...c },
                { l: "D", ...d }
              ],
              przLo,
              przHi,
              dDate: d.date
            };
          }
        }
      }
    }
  }

  const x = swings[n - 4];
  const a = swings[n - 3];
  const b = swings[n - 2];
  const c = swings[n - 1];
  const xa = Math.abs(
    a.price - x.price
  );
  const ab = Math.abs(
    b.price - a.price
  );
  if (xa <= 0 || ab <= 0) {
    return null;
  }
  const rAb = ab / xa;
  const bull = !x.isHigh && a.isHigh;
  let nm = bull
    ? "潛在看漲ABCD"
    : "潛在看跌ABCD";
  let bcR = 1.272;
  if (rAb >= 0.35 && rAb <= 0.54) {
    nm = bull
      ? "潛在看漲蝙蝠222"
      : "潛在看跌蝙蝠222";
    bcR = 1.618;
  } else if (rAb >= 0.55 &&
    rAb <= 0.72) {
    nm = bull
      ? "潛在看漲伽利222"
      : "潛在看跌伽利222";
    bcR = 1.272;
  }

  let dP = 0;
  let ext1618 = 0;
  if (bull) {
    const dirOk = a.isHigh &&
      !b.isHigh && c.isHigh;
    const cb = c.price - b.price;
    if (!dirOk || cb <= 0) return null;
    dP = c.price - bcR * cb;
    ext1618 = c.price - 1.618 * cb;
    const ok = dP > 0 &&
      a.price > c.price &&
      c.price > b.price &&
      b.price > dP;
    if (!ok) return null;
  } else {
    const dirOk = !a.isHigh &&
      b.isHigh && !c.isHigh;
    const bc = b.price - c.price;
    if (!dirOk || bc <= 0) return null;
    dP = c.price + bcR * bc;
    ext1618 = c.price + 1.618 * bc;
    const ok =
      a.price < c.price &&
      c.price < b.price &&
      b.price < dP;
    if (!ok) return null;
  }

  const przLo = dP * 0.985;
  const przHi = dP * 1.015;
  const valid = checkHarmPriceValid(
    candles,
    c.index + 1,
    bull,
    x.price,
    b.price,
    c.price,
    przLo,
    przHi,
    ext1618
  );
  if (!valid) return null;

  const abB = Math.max(
    3,
    b.index - a.index
  );
  const tI = Math.max(
    lastI + 1,
    c.index + abB
  );
  const dDt = addDays(
    lastD,
    (tI - lastI) * step
  );
  return {
    name: nm,
    bull,
    done: false,
    nodes: [
      { l: "X", ...x },
      { l: "A", ...a },
      { l: "B", ...b },
      { l: "C", ...c },
      {
        l: "D",
        index: tI,
        price: dP,
        date: dDt
      }
    ],
    przLo,
    przHi,
    dDate: dDt
  };
}

function runAnalysis() {
  const cs = st.candles;
  if (cs.length < 20) return;
  const swings = detectSwings(cs);
  const anc = pickAnchor(
    cs,
    swings,
    st.customAnc,
    st.dir
  );
  let isUp = !anc.isHigh;
  if (st.dir === "up") isUp = true;
  if (st.dir === "down") isUp = false;

  const bVol = calcVol(
    cs,
    anc,
    swings
  );
  const vol = Math.max(
    0.0001,
    bVol * st.volMult
  );
  const lastI = cs.length - 1;
  const endI = lastI + st.horizon;
  const rays = buildRays(
    anc,
    isUp,
    vol,
    endI
  );
  const hits = calcTimeHits(
    cs,
    anc,
    swings,
    st.horizon,
    st.interval
  );
  const fibs = calcFibs(cs, swings);
  const pcts = calcPctGrid(cs);
  const harm = detectHarmonic(
    cs,
    swings,
    st.interval
  );

  const last = cs[lastI];
  const meta = intvMeta(st.interval);
  const sign = isUp ? 1 : -1;
  const dtN = last.id - anc.index;
  const p1 = Math.max(
    0,
    anc.price + sign * vol * dtN
  );
  const pos = last.close >= p1
    ? "位於 1x1(45度) 強勢線上方"
    : "處於 1x1(45度) 弱勢線下方";
  const titleF = st.name
    ? st.code + " " + st.name
    : st.code;
  const dirLbl = st.dir === "up"
    ? "向上"
    : (st.dir === "down"
      ? "向下" : "自動");

  const lines = [];
  lines.push("【江恩時空推演報告】");
  lines.push("標的：" + titleF);
  lines.push(
    "維度：" + meta.t +
    " | 現價：" + fmt(last.close)
  );
  lines.push(
    "起點：" + fmtDate(anc.date) +
    " (" + fmt(anc.price) + ")"
  );
  lines.push(
    "角度方向：" +
    (isUp ? "上升" : "下跌") +
    "江恩線(" + dirLbl + ")"
  );
  lines.push(
    "波動率：" + fmt(vol) +
    "/" + meta.u
  );
  lines.push(
    "1x1主線現值：" + fmt(p1)
  );
  lines.push("強弱診斷：" + pos);
  lines.push("");
  lines.push(
    "【大級別圓周與轉勢窗口】"
  );

  const majs = hits.filter(
    h => h.isMajor
  );
  const showH = majs.length > 0
    ? majs.slice(0, 3)
    : hits.slice(0, 3);

  if (showH.length === 0) {
    lines.push(
      "延伸期內暫無重大轉勢共振"
    );
  } else {
    for (const h of showH) {
      const dtF =
        h.targetIndex - anc.index;
      const t1 = Math.max(
        0,
        anc.price + sign * vol * dtF
      );
      const t2 = Math.max(
        0,
        anc.price +
          sign * vol * 2 * dtF
      );
      const t3 = Math.max(
        0,
        anc.price +
          sign * vol * 0.5 * dtF
      );
      const tag = h.isMajor
        ? "★大周期轉折："
        : "轉勢日：";
      lines.push(
        tag + fmtDate(h.estDate)
      );
      lines.push(
        "共振因數：" +
        h.reasons.join("+")
      );
      lines.push(
        "屆時1x1目標價：" + fmt(t1)
      );
      lines.push(
        "強弱區間：" + fmt(t3) +
        " ~ " + fmt(t2)
      );
    }
  }

  lines.push("");
  lines.push(
    "【江恩八分位價格網格】"
  );
  for (const p of pcts) {
    if (p.isMajor) {
      lines.push(
        p.label + "：" + fmt(p.price)
      );
    }
  }

  lines.push("");
  lines.push("【黃金比率匯聚位】");
  const confs = fibs.filter(
    f => f.isConf
  );
  const showF = confs.length > 0
    ? confs : fibs.slice(0, 3);
  for (const f of showF) {
    const tg = f.isConf
      ? " (雙重匯聚)" : "";
    lines.push(
      f.label + "：" +
      fmt(f.price) + tg
    );
  }

  lines.push("");
  lines.push("【和諧形態掃描】");
  if (harm) {
    const stTxt = harm.done
      ? "已成型反轉" : "推演完成中";
    lines.push(
      "形態：" + harm.name +
      "(" + stTxt + ")"
    );
    lines.push(
      "D點轉勢窗口：" +
      fmtDate(harm.dDate)
    );
    lines.push(
      "目標反轉區：" +
      fmt(harm.przLo) + " ~ " +
      fmt(harm.przHi)
    );
  } else if (st.interval === "1d") {
    lines.push(
      "當前處於單邊趨勢延伸中，" +
      "暫無有效日線和諧形態" +
      "（建議切換週線檢視大週期結構）"
    );
  } else {
    lines.push(
      "當前處於單邊趨勢延伸中，" +
      "暫無有效" + meta.t +
      "和諧形態"
    );
  }

  lines.push("");
  lines.push("【江恩24條鐵律風控】");
  const spPct = isUp ? 0.96 : 1.04;
  lines.push(
    "建議止損參考(4%)：" +
    fmt(last.close * spPct)
  );
  lines.push(
    "資金控管：單筆不超總資金10%"
  );

  st.res = {
    anc,
    isUp,
    vol,
    rays,
    hits,
    fibs,
    pcts,
    harm,
    report: lines.join("\n")
  };
  updateCards();
  drawChart();
}

function updateCards() {
  const r = st.res;
  if (!r) return;
  const titleF = st.name
    ? st.code + " " + st.name
    : st.code;
  document.getElementById(
    "repTitle"
  ).textContent =
    titleF + " 江恩策略建議";
  document.getElementById(
    "repBody"
  ).textContent = r.report;

  const maj = r.hits.find(
    h => h.isMajor
  );
  const hit = maj || r.hits[0];
  const badge = document.getElementById(
    "turnBadge"
  );
  if (hit) {
    badge.style.display =
      hit.isMajor ? "block" : "none";
    document.getElementById(
      "turnDate"
    ).textContent =
      "預計日期：" +
      fmtDate(hit.estDate);
    document.getElementById(
      "turnWhy"
    ).textContent =
      "共振原因：" +
      hit.reasons.join(" + ");
    const dt =
      hit.targetIndex - r.anc.index;
    const s = r.isUp ? 1 : -1;
    const p1 = Math.max(
      0,
      r.anc.price + s * r.vol * dt
    );
    document.getElementById(
      "turnPrice"
    ).textContent =
      "屆時 1x1 目標價：" + fmt(p1);
  } else {
    badge.style.display = "none";
    document.getElementById(
      "turnDate"
    ).textContent = "暫無強共振";
    document.getElementById(
      "turnWhy"
    ).textContent =
      "可拉長上方延伸期數觀察";
    document.getElementById(
      "turnPrice"
    ).textContent = "--";
  }

  if (r.harm) {
    document.getElementById(
      "harmName"
    ).textContent =
      "形態：" + r.harm.name;
    document.getElementById(
      "harmDate"
    ).textContent =
      "D點時間窗口：" +
      fmtDate(r.harm.dDate);
    document.getElementById(
      "harmPrz"
    ).textContent =
      "反轉目標區：" +
      fmt(r.harm.przLo) + " ~ " +
      fmt(r.harm.przHi);
  } else {
    const meta = intvMeta(st.interval);
    const fb = st.interval === "1d"
      ? "當前處於單邊趨勢延伸中，" +
        "暫無有效日線和諧形態" +
        "（建議切換週線檢視大週期結構）"
      : "當前處於單邊趨勢延伸中，" +
        "暫無有效" + meta.t +
        "和諧形態（建議切換其他週期）";
    document.getElementById(
      "harmName"
    ).textContent = fb;
    document.getElementById(
      "harmDate"
    ).textContent = "--";
    document.getElementById(
      "harmPrz"
    ).textContent = "--";
  }
}

function maxPanLimit() {
  const lastH = Math.max(
    0,
    st.candles.length - 1
  );
  const maxE = lastH + st.horizon;
  const winL =
    st.histBars + st.horizon;
  return Math.max(0, maxE - winL);
}

function panBackward(step) {
  const lim = maxPanLimit();
  st.panOff = Math.min(
    lim,
    st.panOff + step
  );
}

function panForward(step) {
  st.panOff = Math.max(
    0,
    st.panOff - step
  );
}

function getVisRange() {
  const lastH = Math.max(
    0,
    st.candles.length - 1
  );
  const maxE = lastH + st.horizon;
  const winL =
    st.histBars + st.horizon;
  const endB = Math.max(
    Math.min(maxE, winL),
    maxE - st.panOff
  );
  const startB = Math.max(
    0,
    endB - winL
  );
  const endH = Math.min(
    endB,
    lastH
  );
  return { startB, endH, endB };
}

function ensureVisible(bar) {
  const maxP = maxPanLimit();
  const { startB, endB } = getVisRange();
  if (bar < startB) {
    st.panOff = Math.min(
      maxP,
      st.panOff + (startB - bar)
    );
  } else if (bar > endB) {
    st.panOff = Math.max(
      0,
      st.panOff - (bar - endB)
    );
  }
}

function stepBar(delta) {
  if (st.candles.length === 0) return;
  const lastH = st.candles.length - 1;
  const maxE = lastH + st.horizon;
  const cur = st.selBar ?? lastH;
  const next = Math.max(
    0,
    Math.min(maxE, cur + delta)
  );
  st.selBar = next;
  ensureVisible(next);
  drawChart();
}

function drawChart() {
  const cv =
    document.getElementById("cv");
  const wrap =
    document.getElementById("cWrap");
  const dpr =
    window.devicePixelRatio || 1;
  const w = wrap.clientWidth;
  const h = wrap.clientHeight;
  if (w <= 0 || h <= 0) return;
  cv.width = w * dpr;
  cv.height = h * dpr;
  const ctx = cv.getContext("2d");
  ctx.scale(dpr, dpr);

  ctx.fillStyle = "#0e1118";
  ctx.fillRect(0, 0, w, h);

  const cs = st.candles;
  if (cs.length === 0) return;
  const {
    startB,
    endH,
    endB
  } = getVisRange();
  const lastH = cs.length - 1;
  const rightW = 58;
  const botH = 30;
  const plotW = Math.max(
    1,
    w - rightW
  );
  const plotH = Math.max(
    1,
    h - botH
  );

  let lo = Infinity;
  let hi = -Infinity;
  for (let i = startB; i <= endH; i++) {
    lo = Math.min(lo, cs[i].low);
    hi = Math.max(hi, cs[i].high);
  }
  const r = st.res;
  if (st.panOff === 0 && r) {
    const r1 = r.rays.find(
      x => x.isPrimary
    );
    if (r1) {
      const p = r1.pts[1].price;
      if (p > 0 && p < hi * 2.2) {
        hi = Math.max(hi, p);
        lo = Math.min(lo, p);
      }
    }
    if (st.showHarm && r.harm) {
      lo = Math.min(lo, r.harm.przLo);
      hi = Math.max(hi, r.harm.przHi);
    }
  }
  if (hi <= lo) hi = lo + 1;
  const pad = (hi - lo) * 0.08;
  const minP = Math.max(0, lo - pad);
  const maxP = hi + pad;

  const spanX = Math.max(
    1,
    endB - startB
  );
  const xOf = b =>
    ((b - startB) / spanX) *
      (plotW - 12) + 6;
  const yOf = p =>
    plotH -
      ((p - minP) / (maxP - minP)) *
      (plotH - 16) - 8;

  ctx.font = "10px sans-serif";
  ctx.strokeStyle =
    "rgba(255,255,255,0.08)";
  ctx.lineWidth = 0.7;

  for (let i = 0; i <= 4; i++) {
    const rt = i / 4;
    const p = minP +
      (maxP - minP) * rt;
    const y = plotH -
      rt * (plotH - 16) - 8;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(plotW, y);
    ctx.stroke();
    ctx.fillStyle = "#94a3b8";
    ctx.fillText(
      fmtAxisP(p),
      plotW + 6,
      y + 3
    );
  }

  for (let i = 0; i <= 4; i++) {
    const bar = Math.round(
      startB + (spanX * i) / 4
    );
    const x = xOf(bar);
    if (i > 0 && i < 4) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, plotH);
      ctx.stroke();
    }
    if (x >= 18 && x <= plotW - 18) {
      ctx.fillStyle = "#94a3b8";
      const dl = shortDateAtBar(bar);
      ctx.fillText(
        dl,
        x - 14,
        plotH + 19
      );
    }
  }

  ctx.strokeStyle =
    "rgba(255,255,255,0.22)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, plotH);
  ctx.lineTo(plotW, plotH);
  ctx.moveTo(plotW, 0);
  ctx.lineTo(plotW, plotH);
  ctx.stroke();

  if (lastH >= startB &&
    lastH <= endB) {
    const xN = xOf(lastH);
    ctx.fillStyle =
      "rgba(59,130,246,0.08)";
    ctx.fillRect(
      xN,
      0,
      plotW - xN,
      plotH
    );
    ctx.save();
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle =
      "rgba(255,255,255,0.35)";
    ctx.beginPath();
    ctx.moveTo(xN, 0);
    ctx.lineTo(xN, plotH);
    ctx.stroke();
    ctx.restore();
  }

  if (r && st.showGrid) {
    for (const lv of r.pcts) {
      if (lv.price < minP ||
        lv.price > maxP) continue;
      const y = yOf(lv.price);
      const is50 =
        Math.abs(lv.ratio - 0.5) < 0.01;
      ctx.save();
      ctx.setLineDash(
        is50 ? [6, 3] : [2, 4]
      );
      ctx.strokeStyle = is50
        ? "rgba(250,204,21,0.6)"
        : (lv.isMajor
          ? "rgba(99,102,241,0.45)"
          : "rgba(99,102,241,0.22)");
      ctx.lineWidth = is50 ? 1.4 : 0.8;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(plotW, y);
      ctx.stroke();
      ctx.restore();
      if (lv.isMajor) {
        ctx.fillStyle = is50
          ? "#facc15" : "#818cf8";
        ctx.fillText(
          lv.label,
          8,
          y - 3
        );
      }
    }
  }

  if (r && st.showFib) {
    for (const f of r.fibs) {
      if (f.price < minP ||
        f.price > maxP) continue;
      const y = yOf(f.price);
      ctx.save();
      ctx.setLineDash([3, 3]);
      ctx.strokeStyle = f.isConf
        ? "rgba(192,132,252,0.8)"
        : "rgba(148,163,184,0.3)";
      ctx.lineWidth =
        f.isConf ? 1.5 : 0.8;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(plotW, y);
      ctx.stroke();
      ctx.restore();
    }
  }

  if (r) {
    for (const hit of r.hits) {
      const ti = hit.targetIndex;
      if (ti < startB || ti > endB) {
        continue;
      }
      const x = xOf(ti);
      const mj = hit.isMajor;
      const stg = hit.strength >= 2;
      const col = mj
        ? "#f472b6"
        : (stg ? "#fb923c" : "#facc15");
      ctx.save();
      if (!mj) ctx.setLineDash([5, 3]);
      ctx.strokeStyle = col;
      ctx.lineWidth = mj ? 2 : 1.2;
      ctx.beginPath();
      ctx.moveTo(x, 16);
      ctx.lineTo(x, plotH);
      ctx.stroke();
      ctx.restore();
      ctx.fillStyle = col;
      const tg = mj
        ? "◎大周期"
        : (stg ? "★轉勢" : "轉");
      ctx.fillText(tg, x - 12, 11);
    }
  }

  if (r && st.showHarm && r.harm) {
    const ns = r.harm.nodes;
    const pts = ns.map(n => ({
      x: xOf(n.index),
      y: yOf(n.price),
      l: n.l,
      idx: n.index
    }));
    const col = r.harm.bull
      ? "#34d399" : "#f472b6";
    ctx.fillStyle = r.harm.bull
      ? "rgba(52,211,153,0.15)"
      : "rgba(244,114,182,0.15)";
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    ctx.lineTo(pts[1].x, pts[1].y);
    ctx.lineTo(pts[2].x, pts[2].y);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(pts[2].x, pts[2].y);
    ctx.lineTo(pts[3].x, pts[3].y);
    ctx.lineTo(pts[4].x, pts[4].y);
    ctx.closePath();
    ctx.fill();

    ctx.save();
    if (!r.harm.done) {
      ctx.setLineDash([4, 3]);
    }
    ctx.strokeStyle = col;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < 5; i++) {
      ctx.lineTo(pts[i].x, pts[i].y);
    }
    ctx.stroke();
    ctx.restore();

    ctx.fillStyle = col;
    for (const p of pts) {
      if (p.idx >= startB &&
        p.idx <= endB) {
        ctx.fillText(
          p.l,
          p.x - 4,
          p.y - 6
        );
      }
    }
  }

  if (r) {
    for (const ray of r.rays) {
      const p0 = ray.pts[0];
      const p1 = ray.pts[1];
      const x0 = xOf(p0.bar);
      const y0 = yOf(p0.price);
      const x1 = xOf(p1.bar);
      const y1 = yOf(p1.price);
      const is1 = ray.isPrimary;
      const is2 =
        ray.name === "2x1" ||
        ray.name === "1x2";
      const col = is1
        ? "#facc15"
        : (is2
          ? "rgba(56,189,248,0.75)"
          : "rgba(45,212,191,0.32)");
      ctx.strokeStyle = col;
      ctx.lineWidth = is1 ? 2 : 1;
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(x1, y1);
      ctx.stroke();

      if (p1.price >= minP &&
        p1.price <= maxP &&
        p1.bar <= endB) {
        ctx.fillStyle = col;
        ctx.fillText(
          ray.name,
          plotW - 22,
          y1 - 3
        );
      }
    }
  }

  const drawE = Math.min(endB, lastH);
  const bW = Math.max(
    2,
    Math.min(11, (plotW / spanX) * 0.65)
  );
  if (st.style === "line") {
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    for (
      let i = startB;
      i <= drawE;
      i++
    ) {
      const x = xOf(i);
      const y = yOf(cs[i].close);
      if (i === startB) {
        ctx.moveTo(x, y);
      } else {
        ctx.lineTo(x, y);
      }
    }
    ctx.stroke();
  } else {
    for (
      let i = startB;
      i <= drawE;
      i++
    ) {
      const c = cs[i];
      const x = xOf(i);
      const yH = yForPrice(
        c.high,
        plotH,
        minP,
        maxP
      );
      const yL = yForPrice(
        c.low,
        plotH,
        minP,
        maxP
      );
      const yO = yForPrice(
        c.open,
        plotH,
        minP,
        maxP
      );
      const yC = yForPrice(
        c.close,
        plotH,
        minP,
        maxP
      );
      const up = c.close >= c.open;
      const col = up
        ? "#22c55e" : "#ef4444";
      ctx.strokeStyle = col;
      ctx.fillStyle = col;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, yH);
      ctx.lineTo(x, yL);
      ctx.stroke();
      const topY = Math.min(yO, yC);
      const bh = Math.max(
        1.5,
        Math.abs(yC - yO)
      );
      ctx.fillRect(
        x - bW / 2,
        topY,
        bW,
        bh
      );
    }
  }

  if (r &&
    r.anc.index >= startB &&
    r.anc.index <= endB) {
    const ax = xOf(r.anc.index);
    const ay = yOf(r.anc.price);
    ctx.fillStyle = "#facc15";
    ctx.beginPath();
    ctx.arc(ax, ay, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillText(
      "起點",
      ax - 10,
      ay + 15
    );
  }

  const rawAct = st.selBar ?? lastH;
  const actBar = Math.max(
    startB,
    Math.min(endB, rawAct)
  );
  const actX = xOf(actBar);
  const actP = priceAtBar(actBar);
  const actY = yOf(actP);
  const isFut = actBar > lastH;
  const pillBg = isFut
    ? "#fb923c" : "#22d3ee";

  ctx.strokeStyle = pillBg;
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(actX, 0);
  ctx.lineTo(actX, plotH);
  ctx.stroke();

  if (actP >= minP && actP <= maxP) {
    ctx.save();
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = isFut
      ? "rgba(251,146,60,0.6)"
      : "rgba(34,211,238,0.6)";
    ctx.beginPath();
    ctx.moveTo(0, actY);
    ctx.lineTo(plotW, actY);
    ctx.stroke();
    ctx.restore();

    ctx.fillStyle = pillBg;
    ctx.beginPath();
    ctx.arc(
      actX,
      actY,
      4,
      0,
      Math.PI * 2
    );
    ctx.fill();

    const py = Math.max(
      2,
      Math.min(plotH - 20, actY - 9)
    );
    fillPill(
      ctx,
      plotW + 3,
      py,
      rightW - 6,
      18,
      4
    );
    ctx.fillStyle = "#090b10";
    ctx.font =
      "bold 10px sans-serif";
    ctx.fillText(
      fmtAxisP(actP),
      plotW + 6,
      py + 12
    );
  }

  const dStr = fullDateAtBar(actBar);
  const hw = 126;
  const btnW = 26;
  const hx = Math.max(
    4,
    Math.min(
      plotW - hw - 4,
      actX - hw / 2
    )
  );
  const hy = plotH + 3;
  const hh = 22;

  ctx.fillStyle = pillBg;
  fillPill(ctx, hx, hy, hw, hh, 6);

  ctx.strokeStyle =
    "rgba(9,11,16,0.28)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(hx + btnW, hy + 3);
  ctx.lineTo(hx + btnW, hy + hh - 3);
  ctx.moveTo(
    hx + hw - btnW,
    hy + 3
  );
  ctx.lineTo(
    hx + hw - btnW,
    hy + hh - 3
  );
  ctx.stroke();

  ctx.fillStyle = "#090b10";
  ctx.font = "bold 11px sans-serif";
  ctx.fillText("◀", hx + 7, hy + 15);
  ctx.fillText(
    "▶",
    hx + hw - 18,
    hy + 15
  );
  ctx.font = "bold 10px sans-serif";
  ctx.fillText(
    dStr,
    hx + btnW + 7,
    hy + 15
  );

  st.pillBox = {
    x: hx,
    y: hy,
    w: hw,
    h: hh,
    btnW
  };

  updateHud();
}

function yForPrice(
  p,
  plotH,
  minP,
  maxP
) {
  return plotH -
    ((p - minP) / (maxP - minP)) *
    (plotH - 16) - 8;
}

function updateHud() {
  const cs = st.candles;
  if (cs.length === 0) return;
  const lastI = cs.length - 1;
  const idx = st.selBar ?? lastI;
  const meta = intvMeta(st.interval);
  let dStr = "";
  let pStr = "";
  if (idx >= 0 && idx <= lastI) {
    const c = cs[idx];
    dStr = fmtDate(c.date);
    pStr = "收 " + fmt(c.close);
  } else {
    const diff = idx - lastI;
    const est = addDays(
      cs[lastI].date,
      diff * meta.days
    );
    dStr = fmtDate(est) + "(預)";
    pStr = "未來+" + diff + meta.u;
  }
  let gStr = "";
  if (st.res) {
    const r = st.res;
    const dt = idx - r.anc.index;
    const s = r.isUp ? 1 : -1;
    const p1 = Math.max(
      0,
      r.anc.price + s * r.vol * dt
    );
    gStr = " | 1x1:" + fmt(p1);
  }
  const nm = st.name
    ? st.name + " " : "";
  document.getElementById(
    "hudTxt"
  ).textContent =
    nm + dStr + " " + pStr + gStr;

  const { startB } = getVisRange();
  const bBack = document.getElementById(
    "btnHistBack"
  );
  bBack.style.display =
    startB > 0 ? "inline-block" : "none";

  const bFwd = document.getElementById(
    "btnHistFwd"
  );
  bFwd.style.display =
    st.panOff > 0 ? "inline-block" : "none";

  const bLat = document.getElementById(
    "btnLatest"
  );
  bLat.style.display =
    st.panOff > 0 ? "inline-block" : "none";

  const bAnc = document.getElementById(
    "btnSetAnc"
  );
  const validAnc =
    st.selBar != null &&
    st.selBar >= 0 &&
    st.selBar <= lastI;
  bAnc.style.display =
    validAnc ? "inline-block" : "none";
}

function fillPresets() {
  const sel = document.getElementById(
    "presetSel"
  );
  const cnt = st.saved.length;
  const ph = cnt > 0
    ? "自選紀錄 (" + cnt + ")"
    : "暫無自選紀錄";
  sel.innerHTML =
    '<option value="">' +
    ph + "</option>";
  for (const p of st.saved) {
    const opt =
      document.createElement("option");
    opt.value = p.s;
    const tag = p.m === "hk"
      ? "[港] " : "[美] ";
    opt.textContent =
      tag + p.s + " " + p.n;
    if (p.s === st.code) {
      opt.selected = true;
    }
    sel.appendChild(opt);
  }
}

async function loadSymbol() {
  const myReq = ++st.reqId;
  const ld =
    document.getElementById("loadBox");
  const eb =
    document.getElementById("errBox");
  const stag =
    document.getElementById("srcTag");
  document.getElementById(
    "acBox"
  ).style.display = "none";
  ld.style.display = "flex";
  eb.style.display = "none";
  eb.classList.remove("warn");

  const raw = document.getElementById(
    "codeInp"
  ).value;
  const sym = normSym(
    raw,
    st.market
  );
  document.getElementById(
    "codeInp"
  ).value = sym;

  try {
    const data = await fetchYahoo(
      sym,
      st.interval
    );
    if (myReq !== st.reqId) return;
    st.code = sym;
    st.name = data.name ||
      NAMES[sym] || "";
    st.customAnc = null;
    st.selBar = null;
    st.panOff = 0;
    st.candles = data.candles;
    stag.textContent =
      data.source || "已連線";
    if (st.candles.length > 0) {
      recordSaved(
        sym,
        st.name,
        st.market
      );
      savePrefs();
    }
    if (data.isCache) {
      eb.textContent =
        "即時數據暫時繁忙，已載入" +
        "本地快取走勢：" + sym;
      eb.classList.add("warn");
      eb.style.display = "block";
    }
    runAnalysis();
  } catch (e) {
    if (myReq !== st.reqId) return;
    stag.textContent = "連線受阻";
    eb.textContent =
      "所有備援線路均繁忙，請稍後" +
      "再試或檢查代碼：" + sym;
    eb.style.display = "block";
  }
  if (myReq === st.reqId) {
    ld.style.display = "none";
  }
}

function bindSeg(id, cb) {
  const box =
    document.getElementById(id);
  const btns =
    box.querySelectorAll("button");
  btns.forEach(b => {
    b.onclick = () => {
      btns.forEach(x =>
        x.classList.remove("on")
      );
      b.classList.add("on");
      cb(b.dataset.v);
    };
  });
}

function setSegVal(id, val) {
  const box =
    document.getElementById(id);
  box.querySelectorAll("button")
    .forEach(b => {
      b.classList.toggle(
        "on",
        b.dataset.v === String(val)
      );
    });
}

function initEvents() {
  bindSeg("mktSeg", v => {
    st.market = v;
    savePrefs();
    document.getElementById(
      "codeInp"
    ).value =
      v === "hk" ? "^HSI" : "^IXIC";
    loadSymbol();
  });

  bindSeg("stySeg", v => {
    st.style = v;
    savePrefs();
    drawChart();
  });

  bindSeg("intSeg", v => {
    st.interval = v;
    savePrefs();
    loadSymbol();
  });

  bindSeg("horSeg", v => {
    st.horizon = Number(v);
    savePrefs();
    runAnalysis();
  });

  bindSeg("dirSeg", v => {
    st.dir = v;
    savePrefs();
    runAnalysis();
  });

  document.getElementById(
    "btnHsi"
  ).onclick = () => {
    st.market = "hk";
    setSegVal("mktSeg", "hk");
    savePrefs();
    document.getElementById(
      "codeInp"
    ).value = "^HSI";
    loadSymbol();
  };

  document.getElementById(
    "btnIxic"
  ).onclick = () => {
    st.market = "us";
    setSegVal("mktSeg", "us");
    savePrefs();
    document.getElementById(
      "codeInp"
    ).value = "^IXIC";
    loadSymbol();
  };

  document.getElementById(
    "presetSel"
  ).onchange = e => {
    const val = e.target.value;
    if (!val) return;
    const hit = st.saved.find(
      x => x.s === val
    );
    if (hit && hit.m) {
      st.market = hit.m;
      setSegVal("mktSeg", hit.m);
    }
    document.getElementById(
      "codeInp"
    ).value = val;
    loadSymbol();
  };

  document.getElementById(
    "btnDelSaved"
  ).onclick = () => {
    const sel = document.getElementById(
      "presetSel"
    );
    const target =
      sel.value || st.code;
    if (!target) return;
    st.saved = st.saved.filter(
      x => x.s !== target
    );
    persistSaved();
    fillPresets();
  };

  document.getElementById(
    "btnGo"
  ).onclick = loadSymbol;

  const inp = document.getElementById(
    "codeInp"
  );
  inp.oninput = () => {
    clearTimeout(st.acTimer);
    const val = inp.value.trim();
    if (!val) {
      renderAc([]);
      return;
    }
    st.acTimer = setTimeout(
      async () => {
        const list =
          await searchStocks(val);
        renderAc(list);
      },
      220
    );
  };

  inp.onkeydown = e => {
    if (e.key === "Enter") {
      renderAc([]);
      loadSymbol();
    }
  };

  document.addEventListener(
    "click",
    e => {
      if (!e.target.closest(
        ".ac-wrap"
      )) {
        renderAc([]);
      }
    }
  );

  const tog = (id, key, fn) => {
    const el =
      document.getElementById(id);
    el.onclick = () => {
      st[key] = !st[key];
      el.classList.toggle(
        "on",
        st[key]
      );
      savePrefs();
      fn();
    };
  };
  tog("togGrid", "showGrid", drawChart);
  tog("togFib", "showFib", drawChart);
  tog("togHarm", "showHarm", drawChart);

  const updVol = () => {
    document.getElementById(
      "volLbl"
    ).textContent =
      "波動:" +
      st.volMult.toFixed(1) + "x";
    savePrefs();
    runAnalysis();
  };
  document.getElementById(
    "volDn"
  ).onclick = () => {
    st.volMult = Math.max(
      0.4,
      st.volMult - 0.1
    );
    updVol();
  };
  document.getElementById(
    "volUp"
  ).onclick = () => {
    st.volMult = Math.min(
      2.5,
      st.volMult + 0.1
    );
    updVol();
  };

  document.getElementById(
    "btnHistBack"
  ).onclick = () => {
    const step = Math.max(
      15,
      Math.floor(st.histBars / 3)
    );
    panBackward(step);
    drawChart();
  };

  document.getElementById(
    "btnHistFwd"
  ).onclick = () => {
    const step = Math.max(
      15,
      Math.floor(st.histBars / 3)
    );
    panForward(step);
    drawChart();
  };

  const bMode =
    document.getElementById("btnMode");
  bMode.onclick = () => {
    st.moveLine = !st.moveLine;
    bMode.textContent = st.moveLine
      ? "移動時間線" : "拖動歷史";
    bMode.classList.toggle(
      "btn-hi",
      st.moveLine
    );
    bMode.classList.toggle(
      "on",
      !st.moveLine
    );
    savePrefs();
  };

  document.getElementById(
    "btnLatest"
  ).onclick = () => {
    st.panOff = 0;
    drawChart();
  };

  document.getElementById(
    "btnZoomIn"
  ).onclick = () => {
    st.histBars = Math.max(
      45,
      st.histBars - 30
    );
    savePrefs();
    drawChart();
  };
  document.getElementById(
    "btnZoomOut"
  ).onclick = () => {
    st.histBars = Math.min(
      360,
      st.histBars + 30
    );
    savePrefs();
    drawChart();
  };

  document.getElementById(
    "btnSetAnc"
  ).onclick = () => {
    if (st.selBar != null) {
      st.customAnc = st.selBar;
      runAnalysis();
    }
  };
  document.getElementById(
    "btnAutoAnc"
  ).onclick = () => {
    st.customAnc = null;
    st.selBar = null;
    runAnalysis();
  };

  document.getElementById(
    "btnCopy"
  ).onclick = () => {
    if (!st.res) return;
    navigator.clipboard.writeText(
      st.res.report
    );
    const b = document.getElementById(
      "btnCopy"
    );
    b.textContent = "已複製";
    setTimeout(() => {
      b.textContent = "複製報告";
    }, 1500);
  };

  const cv =
    document.getElementById("cv");
  let dragging = false;
  let moved = false;
  let dragAxis = false;
  let downX = 0;
  let basePan = 0;

  const barAt = clientX => {
    const rect =
      cv.getBoundingClientRect();
    const x = clientX - rect.left;
    const {
      startB,
      endB
    } = getVisRange();
    const span = Math.max(
      1,
      endB - startB
    );
    const useW = Math.max(
      1,
      rect.width - 58 - 12
    );
    const r = (x - 6) / useW;
    const off = Math.round(r * span);
    return Math.max(
      startB,
      Math.min(endB, startB + off)
    );
  };

  const checkPillBtn = (x, y) => {
    const b = st.pillBox;
    if (!b) return 0;
    if (y < b.y - 6 ||
      y > b.y + b.h + 6) {
      return 0;
    }
    if (x >= b.x - 4 &&
      x <= b.x + b.btnW + 2) {
      return -1;
    }
    if (x >= b.x + b.w - b.btnW - 2 &&
      x <= b.x + b.w + 4) {
      return 1;
    }
    return 0;
  };

  cv.onpointerdown = e => {
    const rect =
      cv.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const stepDir = checkPillBtn(x, y);
    if (stepDir !== 0) {
      stepBar(stepDir);
      return;
    }
    dragging = true;
    moved = false;
    dragAxis = y >= rect.height - 40;
    downX = e.clientX;
    basePan = st.panOff;
    cv.setPointerCapture(e.pointerId);
    if (st.moveLine || dragAxis) {
      st.selBar = barAt(e.clientX);
      drawChart();
    }
  };

  cv.onpointermove = e => {
    if (!dragging) return;
    const dx = e.clientX - downX;
    if (Math.abs(dx) > 4) {
      moved = true;
    }
    const rect =
      cv.getBoundingClientRect();
    if (st.moveLine || dragAxis) {
      const lx = e.clientX - rect.left;
      const plotW = Math.max(
        1,
        rect.width - 58
      );
      if (lx < 24) {
        panBackward(2);
      } else if (lx > plotW - 24 &&
        st.panOff > 0) {
        panForward(2);
      }
      st.selBar = barAt(e.clientX);
      drawChart();
      return;
    }
    if (!moved) return;
    const {
      startB,
      endB
    } = getVisRange();
    const span = Math.max(
      1,
      endB - startB
    );
    const useW = Math.max(
      1,
      rect.width - 58 - 12
    );
    const dBars = Math.round(
      (dx / useW) * span
    );
    const maxP = maxPanLimit();
    st.panOff = Math.max(
      0,
      Math.min(maxP, basePan + dBars)
    );
    drawChart();
  };

  cv.onpointerup = e => {
    if (!dragging) return;
    dragging = false;
    dragAxis = false;
    if (!moved) {
      st.selBar = barAt(e.clientX);
      drawChart();
    }
  };

  cv.onwheel = e => {
    e.preventDefault();
    const step =
      e.deltaY > 0 ? 20 : -20;
    st.histBars = Math.max(
      45,
      Math.min(
        360,
        st.histBars + step
      )
    );
    savePrefs();
    drawChart();
  };

  window.onkeydown = e => {
    const tag = document
      .activeElement?.tagName;
    if (tag === "INPUT" ||
      tag === "SELECT") {
      return;
    }
    if (e.key === "ArrowLeft") {
      e.preventDefault();
      stepBar(-1);
    } else if (
      e.key === "ArrowRight"
    ) {
      e.preventDefault();
      stepBar(1);
    }
  };

  const ro = new ResizeObserver(() => {
    drawChart();
  });
  ro.observe(
    document.getElementById("cWrap")
  );
}

restoreState();
fillPresets();
initEvents();
loadSymbol();
</script>
</body>
</html>
