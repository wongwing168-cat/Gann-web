      tip;
    document.getElementById(
      "harmDate"
    ).textContent = "--";
    document.getElementById(
      "harmPrz"
    ).textContent = "--";
  }

  document.getElementById(
    "repTitle"
  ).textContent =
    titleF + " 江恩策略建議";
  document.getElementById(
    "repBody"
  ).textContent = st.res.report;

  drawChart();
}

function getVisRange() {
  const lastH = Math.max(
    0,
    st.candles.length - 1
  );
  const maxE = lastH + st.horizon;
  const winL =
    st.histBars + st.horizon;
  const endB = Math.max(
    Math.min(maxE, winL),
    maxE - st.panOff
  );
  const startB = Math.max(
    0,
    endB - winL
  );
  const endH = Math.min(endB, lastH);
  return { startB, endH, endB };
}

function maxPanLimit() {
  const lastH = Math.max(
    0,
    st.candles.length - 1
  );
  const maxE = lastH + st.horizon;
  const winL =
    st.histBars + st.horizon;
  return Math.max(0, maxE - winL);
}

function panBackward(step) {
  const lim = maxPanLimit();
  st.panOff = Math.min(
    lim,
    st.panOff + step
  );
}

function panForward(step) {
  st.panOff = Math.max(
    0,
    st.panOff - step
  );
}

function focusHarmonic() {
  if (!st.res || !st.res.harm) {
    return;
  }
  const h = st.res.harm;
  const xIdx = h.nodes[0].index;
  const dIdx = h.dIdx;
  const span = Math.max(
    10,
    dIdx - xIdx
  );
  if (span + 24 > st.histBars) {
    st.histBars = Math.min(
      360,
      span + 30
    );
  }
  const mid = Math.floor(
    (xIdx + dIdx) / 2
  );
  const lastH = Math.max(
    0,
    st.candles.length - 1
  );
  const maxE = lastH + st.horizon;
  const winL =
    st.histBars + st.horizon;
  const desEnd =
    mid + Math.floor(winL / 2);
  const rawPan = maxE - desEnd;
  const lim = maxPanLimit();
  st.panOff = Math.max(
    0,
    Math.min(lim, rawPan)
  );
  if (dIdx >= 0 && dIdx <= maxE) {
    st.selBar = dIdx;
  }
  drawChart();
}

function stepBar(delta) {
  if (!st.candles.length) return;
  const lastH =
    st.candles.length - 1;
  const maxE = lastH + st.horizon;
  const cur =
    st.selBar != null
      ? st.selBar : lastH;
  const nxt = Math.max(
    0,
    Math.min(maxE, cur + delta)
  );
  st.selBar = nxt;
  const { startB, endB } =
    getVisRange();
  const maxP = maxPanLimit();
  if (nxt < startB) {
    st.panOff = Math.min(
      maxP,
      st.panOff + (startB - nxt)
    );
  } else if (nxt > endB) {
    st.panOff = Math.max(
      0,
      st.panOff - (nxt - endB)
    );
  }
  drawChart();
}

function priceAtBar(bar) {
  const cs = st.candles;
  if (!cs.length) return 0;
  if (bar >= 0 && bar < cs.length) {
    return cs[bar].close;
  }
  if (st.res) {
    const r = st.res;
    const dt = barTimeDelta(
      cs,
      r.anc.index,
      bar,
      st.interval,
      r.effMode
    );
    const s = r.isUp ? 1 : -1;
    return Math.max(
      0,
      r.anc.price + s * r.vol * dt
    );
  }
  return cs[cs.length - 1].close;
}

function drawChart() {
  const cv =
    document.getElementById("cv");
  const rect =
    cv.getBoundingClientRect();
  if (
    rect.width < 10 ||
    rect.height < 10
  ) {
    return;
  }
  const dpr =
    window.devicePixelRatio || 1;
  cv.width = rect.width * dpr;
  cv.height = rect.height * dpr;
  const ctx = cv.getContext("2d");
  ctx.scale(dpr, dpr);
  const W = rect.width;
  const H = rect.height;
  const rW = 58;
  const bH = 30;
  const pW = Math.max(1, W - rW);
  const pH = Math.max(1, H - bH);
  ctx.clearRect(0, 0, W, H);

  const cs = st.candles;
  if (!cs.length) return;
  const intra = isIntraIv(
    st.interval
  );

  const {
    startB,
    endH,
    endB
  } = getVisRange();
  const lastH = cs.length - 1;
  const rawSel =
    st.selBar != null
      ? st.selBar : lastH;
  const actB = Math.max(
    startB,
    Math.min(endB, rawSel)
  );

  const bLoc =
    document.getElementById(
      "btnLocHarm"
    );
  if (
    st.showHarm &&
    st.res &&
    st.res.harm
  ) {
    const h = st.res.harm;
    const xI = h.nodes[0].index;
    const dI = h.dIdx;
    const outV =
      xI < startB || dI > endB;
    const isBk =
      h.name.includes("回溯");
    bLoc.style.display =
      outV || isBk
        ? "inline-block" : "none";
  } else {
    bLoc.style.display = "none";
  }

  document.getElementById(
    "btnHistBack"
  ).style.display =
    startB > 0
      ? "inline-block" : "none";
  document.getElementById(
    "btnHistFwd"
  ).style.display =
    st.panOff > 0
      ? "inline-block" : "none";
  document.getElementById(
    "btnLatest"
  ).style.display =
    st.panOff > 0
      ? "inline-block" : "none";
  document.getElementById(
    "btnSetAnc"
  ).style.display =
    st.selBar != null &&
    st.selBar < cs.length
      ? "inline-block" : "none";

  let lo = Infinity;
  let hi = -Infinity;
  for (
    let i = startB;
    i <= endH;
    i++
  ) {
    if (cs[i].low < lo) {
      lo = cs[i].low;
    }
    if (cs[i].high > hi) {
      hi = cs[i].high;
    }
  }
  if (
    st.panOff === 0 &&
    st.res
  ) {
    const r1 = st.res.rays.find(
      x => x.isPrimary
    );
    const lp =
      r1?.points[
        r1.points.length - 1
      ];
    if (
      lp &&
      lp.price > 0 &&
      lp.price < hi * 2.2
    ) {
      hi = Math.max(hi, lp.price);
      lo = Math.min(lo, lp.price);
    }
  }
  if (
    st.showHarm &&
    st.res &&
    st.res.harm
  ) {
    const h = st.res.harm;
    if (
      h.dIdx >= startB &&
      h.nodes[0].index <= endB
    ) {
      for (const nd of h.nodes) {
        lo = Math.min(lo, nd.price);
        hi = Math.max(hi, nd.price);
      }
      lo = Math.min(lo, h.przLo);
      hi = Math.max(hi, h.przHi);
    }
  }
  if (hi <= lo) hi = lo + 1;
  const pad = (hi - lo) * 0.08;
  const minP = Math.max(0, lo - pad);
  const maxP = hi + pad;

  const xOf = b => {
    const sp = Math.max(
      1,
      endB - startB
    );
    return (
      ((b - startB) / sp) *
        (pW - 12) +
      6
    );
  };
  const yOf = p => {
    const sp = Math.max(
      0.0001,
      maxP - minP
    );
    return (
      pH -
      ((p - minP) / sp) *
        (pH - 16) -
      8
    );
  };

  ctx.strokeStyle =
    "rgba(255,255,255,0.08)";
  ctx.lineWidth = 0.7;
  for (let i = 0; i <= 4; i++) {
    const y =
      pH -
      (i / 4) * (pH - 16) -
      8;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(pW, y);
    ctx.stroke();
  }
  const spanB = Math.max(
    1,
    endB - startB
  );
  for (let i = 1; i <= 3; i++) {
    const bar =
      startB +
      Math.floor((spanB * i) / 4);
    const x = xOf(bar);
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, pH);
    ctx.stroke();
  }

  ctx.strokeStyle =
    "rgba(255,255,255,0.22)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, pH);
  ctx.lineTo(pW, pH);
  ctx.moveTo(pW, 0);
  ctx.lineTo(pW, pH);
  ctx.stroke();

  if (
    lastH >= startB &&
    lastH <= endB
  ) {
    const xNow = xOf(lastH);
    ctx.fillStyle =
      "rgba(59,130,246,0.08)";
    ctx.fillRect(
      xNow,
      0,
      Math.max(0, pW - xNow),
      pH
    );
    ctx.save();
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle =
      "rgba(255,255,255,0.35)";
    ctx.beginPath();
    ctx.moveTo(xNow, 0);
    ctx.lineTo(xNow, pH);
    ctx.stroke();
    ctx.restore();
  }

  const r = st.res;
  if (r) {
    if (st.showGrid) {
      for (const lv of r.pcts) {
        if (
          lv.price < minP ||
          lv.price > maxP
        ) {
          continue;
        }
        const y = yOf(lv.price);
        const is50 =
          Math.abs(lv.ratio - 0.5) <
          0.01;
        ctx.save();
        ctx.setLineDash(
          is50 ? [6, 3] : [2, 4]
        );
        ctx.strokeStyle = is50
          ? "rgba(250,204,21,0.55)"
          : (lv.isMajor
            ? "rgba(99,102,241,0.48)"
            : "rgba(99,102,241,0.22)");
        ctx.lineWidth =
          is50 ? 1.4 : 0.8;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(pW, y);
        ctx.stroke();
        ctx.restore();
        if (lv.isMajor) {
          ctx.fillStyle = is50
            ? "#facc15" : "#818cf8";
          ctx.font =
            "9px sans-serif";
          ctx.fillText(
            lv.label,
            6,
            y - 3
          );
        }
      }
    }

    if (st.showFib) {
      for (const f of r.fibs) {
        if (
          f.price < minP ||
          f.price > maxP
        ) {
          continue;
        }
        const y = yOf(f.price);
        ctx.save();
        ctx.setLineDash([3, 3]);
        ctx.strokeStyle =
          "rgba(168,85,247,0.45)";
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(pW, y);
        ctx.stroke();
        ctx.restore();
      }
    }

    for (const h of r.hits) {
      if (
        h.targetIndex < startB ||
        h.targetIndex > endB
      ) {
        continue;
      }
      const x = xOf(h.targetIndex);
      ctx.save();
      if (!h.isMajor) {
        ctx.setLineDash([5, 3]);
      }
      ctx.strokeStyle = h.isMajor
        ? "#f472b6"
        : (h.strength >= 2
          ? "#fb923c"
          : "rgba(250,204,21,0.45)");
      ctx.lineWidth =
        h.isMajor ? 2 : 1.2;
      ctx.beginPath();
      ctx.moveTo(x, 14);
      ctx.lineTo(x, pH);
      ctx.stroke();
      ctx.restore();
      ctx.fillStyle = h.isMajor
        ? "#f472b6" : "#fb923c";
      ctx.font = "9px sans-serif";
      ctx.fillText(
        h.isMajor
          ? (intra
            ? "◎共振" : "◎大周期")
          : "★轉",
        x - 10,
        10
      );
    }

    if (st.showHarm && r.harm) {
      const h = r.harm;
      const pts = h.nodes.map(n => ({
        x: xOf(n.index),
        y: yOf(n.price)
      }));
      ctx.fillStyle = h.isBull
        ? "rgba(52,211,153,0.16)"
        : "rgba(244,114,182,0.16)";
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      ctx.lineTo(pts[1].x, pts[1].y);
      ctx.lineTo(pts[2].x, pts[2].y);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(pts[2].x, pts[2].y);
      ctx.lineTo(pts[3].x, pts[3].y);
      ctx.lineTo(pts[4].x, pts[4].y);
      ctx.closePath();
      ctx.fill();

      ctx.save();
      if (!h.isComp) {
        ctx.setLineDash([4, 3]);
      }
      ctx.strokeStyle = h.isBull
        ? "#34d399" : "#f472b6";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      pts.forEach((p, idx) => {
        if (idx === 0) {
          ctx.moveTo(p.x, p.y);
        } else {
          ctx.lineTo(p.x, p.y);
        }
      });
      ctx.stroke();
      ctx.restore();

      const lbls = [
        "X", "A", "B", "C", "D"
      ];
      h.nodes.forEach((nd, i) => {
        if (
          nd.index < startB ||
          nd.index > endB
        ) {
          return;
        }
        ctx.fillStyle = h.isBull
          ? "#34d399" : "#f472b6";
        ctx.font =
          "bold 10px sans-serif";
        ctx.fillText(
          lbls[i],
          pts[i].x - 3,
          pts[i].y - 6
        );
      });
    }

    if (
      st.showSwing &&
      r.mSwings.length >= 2
    ) {
      ctx.save();
      ctx.strokeStyle =
        "rgba(250,204,21,0.85)";
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      r.mSwings.forEach((s, i) => {
        const sx = xOf(s.index);
        const sy = yOf(s.price);
        if (i === 0) {
          ctx.moveTo(sx, sy);
        } else {
          ctx.lineTo(sx, sy);
        }
      });
      ctx.stroke();
      for (const s of r.mSwings) {
        if (
          s.index < startB ||
          s.index > endB
        ) {
          continue;
        }
        ctx.fillStyle = s.isHigh
          ? "#fb923c" : "#34d399";
        ctx.beginPath();
        ctx.arc(
          xOf(s.index),
          yOf(s.price),
          3,
          0,
          Math.PI * 2
        );
        ctx.fill();
      }
      ctx.restore();
    }

    for (const ray of r.rays) {
      if (ray.points.length < 2) {
        continue;
      }
      ctx.strokeStyle = ray.isPrimary
        ? "#facc15"
        : (ray.name === "2x1" ||
          ray.name === "1x2"
          ? "rgba(56,189,248,0.7)"
          : "rgba(45,212,191,0.32)");
      ctx.lineWidth =
        ray.isPrimary ? 2 : 1;
      ctx.beginPath();
      ray.points.forEach((pt, idx) => {
        const x = xOf(pt.barIndex);
        const y = yOf(pt.price);
        if (idx === 0) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
      });
      ctx.stroke();
      const lp =
        ray.points[
          ray.points.length - 1
        ];
      if (
        lp.barIndex >= startB &&
        lp.barIndex <= endB &&
        lp.price >= minP &&
        lp.price <= maxP
      ) {
        ctx.fillStyle =
          ctx.strokeStyle;
        ctx.font = "9px sans-serif";
        ctx.fillText(
          ray.name,
          pW - 24,
          yOf(lp.price)
        );
      }
    }
  }

  const tot = Math.max(
    1,
    endB - startB
  );
  const bW = Math.max(
    2,
    Math.min(10, (pW / tot) * 0.65)
  );
  if (st.style === "line") {
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    for (
      let i = startB;
      i <= endH;
      i++
    ) {
      const x = xOf(i);
      const y = yOf(cs[i].close);
      if (i === startB) {
        ctx.moveTo(x, y);
      } else {
        ctx.lineTo(x, y);
      }
    }
    ctx.stroke();
  } else {
    for (
      let i = startB;
      i <= endH;
      i++
    ) {
      const c = cs[i];
      const x = xOf(i);
      const up = c.close >= c.open;
      ctx.strokeStyle = up
        ? "#22c55e" : "#ef4444";
      ctx.fillStyle = ctx.strokeStyle;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, yOf(c.high));
      ctx.lineTo(x, yOf(c.low));
      ctx.stroke();
      const yO = yOf(c.open);
      const yC = yOf(c.close);
      ctx.fillRect(
        x - bW / 2,
        Math.min(yO, yC),
        bW,
        Math.max(1.5, Math.abs(yC - yO))
      );
    }
  }

  if (
    r &&
    r.anc.index >= startB &&
    r.anc.index <= endB
  ) {
    const ax = xOf(r.anc.index);
    const ay = yOf(r.anc.price);
    ctx.fillStyle = "#facc15";
    ctx.beginPath();
    ctx.arc(
      ax,
      ay,
      5,
      0,
      Math.PI * 2
    );
    ctx.fill();
    ctx.font = "10px sans-serif";
    ctx.fillText(
      "起點",
      ax - 10,
      ay + 15
    );
  }

  const isFut = actB >= cs.length;
  const lineCol = isFut
    ? "#f97316" : "#38bdf8";
  const cx = xOf(actB);
  const actP = priceAtBar(actB);

  ctx.strokeStyle = lineCol;
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(cx, 0);
  ctx.lineTo(cx, pH);
  ctx.stroke();

  if (actP >= minP && actP <= maxP) {
    const cy = yOf(actP);
    ctx.save();
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle =
      "rgba(56,189,248,0.55)";
    ctx.beginPath();
    ctx.moveTo(0, cy);
    ctx.lineTo(pW, cy);
    ctx.stroke();
    ctx.restore();

    ctx.fillStyle = lineCol;
    ctx.beginPath();
    ctx.arc(
      cx,
      cy,
      4,
      0,
      Math.PI * 2
    );
    ctx.fill();

    const pLbl = fmtAxis(actP);
    const tagY = Math.max(
      10,
      Math.min(pH - 10, cy)
    );
    ctx.fillStyle = lineCol;
    ctx.fillRect(
      pW + 2,
      tagY - 9,
      rW - 4,
      18
    );
    ctx.fillStyle = "#000";
    ctx.font =
      "bold 10px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(
      pLbl,
      pW + rW / 2,
      tagY + 3.5
    );
  }

  ctx.fillStyle = "#94a3b8";
  ctx.font = "10px sans-serif";
  ctx.textAlign = "center";
  for (let i = 0; i <= 4; i++) {
    const ratio = i / 4;
    const p =
      minP + (maxP - minP) * ratio;
    const y =
      pH -
      ratio * (pH - 16) -
      8;
    ctx.fillText(
      fmtAxis(p),
      pW + rW / 2,
      y + 3
    );
  }

  for (let i = 0; i <= 4; i++) {
    const bar =
      startB +
      Math.floor((spanB * i) / 4);
    const x = xOf(bar);
    if (x < 24 || x > pW - 24) {
      continue;
    }
    const fullD = fmtDate(
      dateMsForIndex(
        cs,
        bar,
        st.interval
      ),
      intra
    );
    const shortD = intra
      ? fullD
      : (st.interval === "1mo"
        ? fullD.slice(0, 7)
        : fullD.slice(5));
    ctx.fillText(
      shortD,
      x,
      pH + 18
    );
  }

  const dFull = fmtDate(
    dateMsForIndex(
      cs,
      actB,
      st.interval
    ),
    intra
  );
  const pillW = intra ? 132 : 116;
  const pillH = 22;
  const btnW = 22;
  const pillX = Math.max(
    pillW / 2 + 2,
    Math.min(
      pW - pillW / 2 - 2,
      cx
    )
  );
  const boxL = pillX - pillW / 2;
  const boxT = pH + 4;
  st.pillBox = {
    x: boxL,
    y: boxT,
    w: pillW,
    h: pillH,
    btnW
  };

  ctx.fillStyle = lineCol;
  ctx.fillRect(
    boxL,
    boxT,
    pillW,
    pillH
  );
  ctx.fillStyle = "#000";
  ctx.font =
    "bold 10px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(
    "<",
    boxL + btnW / 2,
    boxT + 14.5
  );
  ctx.fillText(
    dFull,
    pillX,
    boxT + 14.5
  );
  ctx.fillText(
    ">",
    boxL + pillW - btnW / 2,
    boxT + 14.5
  );
  ctx.textAlign = "left";

  let pTxt = "";
  if (actB < cs.length) {
    pTxt =
      "收 " +
      fmt(cs[actB].close);
  } else {
    pTxt =
      "未來+" +
      (actB - lastH) +
      unitName(st.interval);
  }
  const gTxt = r
    ? " | 1x1:" + fmt(actP)
    : "";
  const head = st.name
    ? st.name + " "
    : st.code + " ";
  document.getElementById(
    "hudTxt"
  ).textContent =
    head + dFull + " " + pTxt + gTxt;
}

function playWebAlarm() {
  try {
    const Ctx =
      window.AudioContext ||
      window.webkitAudioContext;
    const ctx = new Ctx();
    const now = ctx.currentTime;
    const tone = st.ringTone || "alarm";
    let freqs = [880, 1175, 880, 1175];
    let wave = "triangle";
    let step = 0.16;
    if (tone === "bell") {
      freqs = [1046.5, 1318.5, 1568, 2093];
      wave = "sine";
      step = 0.22;
    } else if (tone === "electronic") {
      freqs = [1400, 950, 1400, 950];
      wave = "sawtooth";
      step = 0.13;
    } else if (tone === "minuet") {
      freqs = [523.25, 659.25, 783.99, 1046.5];
      wave = "sine";
      step = 0.26;
    }
    for (let i = 0; i < freqs.length; i++) {
      const osc =
        ctx.createOscillator();
      const gain =
        ctx.createGain();
      osc.type = wave;
      osc.frequency.setValueAtTime(
        freqs[i],
        now + i * step
      );
      gain.gain.setValueAtTime(
        tone === "electronic" ? 0.16 : 0.26,
        now + i * step
      );
      gain.gain.exponentialRampToValueAtTime(
        0.001,
        now + i * step + step * 0.92
      );
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + i * step);
      osc.stop(now + i * step + step);
    }
  } catch (e) {}
}

function startWebRingLoop() {
  clearInterval(st.ringTimer);
  playWebAlarm();
  st.ringTimer = setInterval(
    playWebAlarm,
    2200
  );
}

function loadAlertsLocal() {
  st.barkKey =
    localStorage.getItem(BARK_KEY) || "";
  st.ringTone =
    localStorage.getItem(TONE_KEY) ||
    "alarm";
  const tSel = document.getElementById(
    "ringToneSel"
  );
  if (tSel) tSel.value = st.ringTone;
  const raw =
    localStorage.getItem(ALERT_KEY);
  if (raw) {
    try {
      st.alerts = JSON.parse(raw);
    } catch (e) {
      st.alerts = [];
    }
  }
  updateAlertBtnBadge();
}

async function syncAlertsCloud() {
  try {
    localStorage.setItem(
      BARK_KEY,
      st.barkKey
    );
    localStorage.setItem(
      TONE_KEY,
      st.ringTone
    );
    localStorage.setItem(
      ALERT_KEY,
      JSON.stringify(st.alerts)
    );
  } catch (e) {}
  updateAlertBtnBadge();
  try {
    await fetch(
      "/.netlify/functions/yahoo" +
      "?action=sync_alerts",
      {
        method: "POST",
        headers: {
          "Content-Type":
            "application/json"
        },
        body: JSON.stringify({
          barkKey: st.barkKey,
          ringTone: st.ringTone,
          alerts: st.alerts
        })
      }
    );
  } catch (e) {}
}

function updateAlertBtnBadge() {
  const cnt = st.alerts.filter(
    a => a.isEnabled && !a.isTriggered
  ).length;
  const b = document.getElementById(
    "btnAlerts"
  );
  if (b) {
    b.textContent = cnt > 0
      ? "🔔 到價(" + cnt + ")"
      : "🔔 到價";
  }
}

function openAlertModal() {
  const cs = st.candles;
  const curP = cs.length > 0
    ? cs[cs.length - 1].close : 0;
  const titleF = st.name
    ? st.code + " " + st.name
    : st.code;
  document.getElementById(
    "alCurSym"
  ).textContent = "標的：" + titleF;
  document.getElementById(
    "alCurP"
  ).textContent =
    "現價：" + fmt(curP);
  document.getElementById(
    "barkKeyInp"
  ).value = st.barkKey;
  const tInp = document.getElementById(
    "alTargetInp"
  );
  if (curP > 0) {
    tInp.value = fmt(curP);
  }
  const mSel = document.getElementById(
    "alModeSel"
  );
  mSel.value = st.market === "us"
    ? "scheduled" : "immediate";
  updateAlModeUi();

  const qBox = document.getElementById(
    "alQuickFill"
  );
  qBox.innerHTML = "";
  const addFillBtn = (lbl, val) => {
    if (!val || val <= 0) return;
    const btn =
      document.createElement("button");
    btn.className = "btn btn-c";
    btn.style.fontSize = "11px";
    btn.textContent =
      lbl + "(" + fmt(val) + ")";
    btn.onclick = () => {
      tInp.value = fmt(val);
      document.getElementById(
        "alCondSel"
      ).value = val >= curP
        ? "向上突破" : "向下跌破";
    };
    qBox.appendChild(btn);
  };

  if (st.res && cs.length > 0) {
    const r = st.res;
    const last = cs[cs.length - 1];
    const dt = barTimeDelta(
      cs,
      r.anc.index,
      last.id,
      st.interval,
      r.effMode
    );
    const s = r.isUp ? 1 : -1;
    const p1 = Math.max(
      0,
      r.anc.price + s * r.vol * dt
    );
    addFillBtn("1x1主線", p1);
    if (r.harm) {
      const hd =
        (r.harm.przLo + r.harm.przHi) /
        2;
      addFillBtn("和諧D點", hd);
    }
    if (r.stopInfo) {
      addFillBtn(
        "擺動止損",
        r.stopInfo[0]
      );
    }
  }
  renderAlertList();
  document.getElementById(
    "alertModal"
  ).style.display = "flex";
}

function renderAlertList() {
  const box = document.getElementById(
    "alListBox"
  );
  document.getElementById(
    "alListCnt"
  ).textContent =
    "監控清單 (" +
    st.alerts.length + ")";
  box.innerHTML = "";
  if (st.alerts.length === 0) {
    box.innerHTML =
      '<div class="lbl">暫無到價警報</div>';
    return;
  }
  for (const it of st.alerts) {
    const row =
      document.createElement("div");
    row.className = "al-row";
    const tStr =
      String(it.schedHour ?? 8)
        .padStart(2, "0") +
      ":" +
      String(it.schedMinute ?? 30)
        .padStart(2, "0");
    const mTag =
      it.notifyMode === "scheduled"
        ? "定時" + tStr : "即時";
    const stTxt = it.isTriggered
      ? "已觸發"
      : (it.isPendingDelivery
        ? "待" + tStr + "派發"
        : (it.isEnabled
          ? "監控中" : "已停用"));
    const stCol = it.isTriggered
      ? "#fb923c"
      : (it.isPendingDelivery
        ? "#facc15"
        : (it.isEnabled
          ? "#34d399" : "#94a3b8"));

    const top =
      document.createElement("div");
    top.style.display = "flex";
    top.style.alignItems = "center";
    top.style.gap = "6px";

    const symSp =
      document.createElement("span");
    symSp.style.color = "#facc15";
    symSp.style.fontWeight = "700";
    symSp.style.fontSize = "12px";
    symSp.textContent =
      it.symbol + " " + it.name;

    const condSp =
      document.createElement("span");
    condSp.style.color = "#38bdf8";
    condSp.style.fontSize = "12px";
    condSp.textContent =
      it.condition + " " +
      fmt(it.targetPrice);

    const modeSp =
      document.createElement("span");
    modeSp.style.fontSize = "10px";
    modeSp.style.padding = "1px 5px";
    modeSp.style.borderRadius = "4px";
    modeSp.style.background =
      "rgba(168,85,247,0.25)";
    modeSp.style.color = "#c084fc";
    modeSp.textContent = mTag;

    const sp =
      document.createElement("div");
    sp.className = "sp";

    const tag =
      document.createElement("span");
    tag.style.color = stCol;
    tag.style.fontSize = "11px";
    tag.textContent = stTxt;

    const delB =
      document.createElement("button");
    delB.className = "btn btn-del";
    delB.textContent = "刪";
    delB.onclick = () => {
      st.alerts = st.alerts.filter(
        x => x.id !== it.id
      );
      syncAlertsCloud();
      renderAlertList();
    };

    top.appendChild(symSp);
    top.appendChild(condSp);
    top.appendChild(modeSp);
    top.appendChild(sp);
    top.appendChild(tag);
    top.appendChild(delB);

    const note =
      document.createElement("div");
    note.style.fontSize = "12px";
    note.style.color = "#e2e8f0";
    note.style.whiteSpace = "pre-wrap";
    note.textContent =
      "方案：" + it.planNote;

    row.appendChild(top);
    row.appendChild(note);
    box.appendChild(row);
  }
}

function updateAlModeUi() {
  const mode = document.getElementById(
    "alModeSel"
  ).value;
  const tInp = document.getElementById(
    "alTimeInp"
  );
  const tip = document.getElementById(
    "alModeTip"
  );
  if (mode === "scheduled") {
    tInp.style.display =
      "inline-block";
    tip.textContent =
      "深夜觸價先暫存，到點派發";
    tip.style.color = "#38bdf8";
  } else {
    tInp.style.display = "none";
    tip.textContent = "到價立刻響鬧";
    tip.style.color = "#fb923c";
  }
}

async function pollWebAlerts() {
  const active = st.alerts.filter(
    a => a.isEnabled && !a.isTriggered
  );
  if (active.length === 0) return;
  try {
    await syncAlertsCloud();
    const r = await fetch(
      "/.netlify/functions/yahoo" +
      "?action=check_alerts"
    );
    if (!r.ok) return;
    const j = await r.json();
    if (Array.isArray(j.triggered) &&
      j.triggered.length > 0) {
      const hit = j.triggered[0];
      if (Array.isArray(j.alerts)) {
        st.alerts = j.alerts;
        syncAlertsCloud();
      }
      document.getElementById(
        "trigSym"
      ).textContent =
        hit.symbol + " " + hit.name;
      document.getElementById(
        "trigDetail"
      ).textContent =
        "已" + hit.condition + " " +
        fmt(hit.targetPrice) +
        "（觸發價：" +
        fmt(hit.triggeredPrice) +
        "）";
      document.getElementById(
        "trigPlan"
      ).textContent = hit.planNote;
      document.getElementById(
        "trigModal"
      ).style.display = "flex";
      startWebRingLoop();
    }
  } catch (e) {}
}

function initEvents() {
  bindSeg("mktSeg", v => {
    st.market = v;
    savePrefs();
    document.getElementById(
      "codeInp"
    ).value =
      v === "hk" ? "^HSI" : "^IXIC";
    loadSymbol();
  });

  bindSeg("stySeg", v => {
    st.style = v;
    savePrefs();
    drawChart();
  });

  bindSeg("intSeg", v => {
    st.interval = v;
    syncTimeModeVis();
    savePrefs();
    loadSymbol();
  });

  bindSeg("horSeg", v => {
    st.horizon = Number(v);
    savePrefs();
    runAnalysis();
  });

  bindSeg("dirSeg", v => {
    st.dir = v;
    savePrefs();
    runAnalysis();
  });

  bindSeg("tModeSeg", v => {
    st.timeMode = v;
    savePrefs();
    runAnalysis();
  });

  document.getElementById(
    "btnHsi"
  ).onclick = () => {
    st.market = "hk";
    setSegVal("mktSeg", "hk");
    savePrefs();
    document.getElementById(
      "codeInp"
    ).value = "^HSI";
    loadSymbol();
  };

  document.getElementById(
    "btnIxic"
  ).onclick = () => {
    st.market = "us";
    setSegVal("mktSeg", "us");
    savePrefs();
    document.getElementById(
      "codeInp"
    ).value = "^IXIC";
    loadSymbol();
  };

  document.getElementById(
    "presetSel"
  ).onchange = e => {
    const val = e.target.value;
    if (!val) return;
    const hit = st.saved.find(
      x => x.s === val
    );
    if (hit && hit.m) {
      st.market = hit.m;
      setSegVal("mktSeg", hit.m);
    }
    document.getElementById(
      "codeInp"
    ).value = val;
    loadSymbol();
  };

  document.getElementById(
    "btnDelSaved"
  ).onclick = () => {
    const sel = document.getElementById(
      "presetSel"
    );
    const target =
      sel.value || st.code;
    if (!target) return;
    st.saved = st.saved.filter(
      x => x.s !== target
    );
    persistSaved();
    fillPresets();
  };

  document.getElementById(
    "btnGo"
  ).onclick = loadSymbol;

  document.getElementById(
    "btnAlerts"
  ).onclick = () => {
    playWebAlarm();
    openAlertModal();
  };

  document.getElementById(
    "btnCloseAlert"
  ).onclick = () => {
    document.getElementById(
      "alertModal"
    ).style.display = "none";
  };

  document.getElementById(
    "btnTestRing"
  ).onclick = playWebAlarm;

  document.getElementById(
    "ringToneSel"
  ).onchange = e => {
    st.ringTone = e.target.value;
    playWebAlarm();
    syncAlertsCloud();
  };

  document.getElementById(
    "btnSaveBark"
  ).onclick = () => {
    st.barkKey = document
      .getElementById("barkKeyInp")
      .value.trim();
    syncAlertsCloud();
  };

  document.getElementById(
    "alModeSel"
  ).onchange = updateAlModeUi;

  document.getElementById(
    "btnAddAlert"
  ).onclick = () => {
    const val = parseFloat(
      document.getElementById(
        "alTargetInp"
      ).value
    );
    if (isNaN(val) || val <= 0) {
      return;
    }
    const cond = document
      .getElementById("alCondSel")
      .value;
    const mode = document
      .getElementById("alModeSel")
      .value;
    const tParts = (
      document.getElementById(
        "alTimeInp"
      ).value || "08:30"
    ).split(":");
    const sh = parseInt(
      tParts[0],
      10
    ) || 8;
    const sm = parseInt(
      tParts[1],
      10
    ) || 30;
    const note = document
      .getElementById("alNoteInp")
      .value.trim();
    st.alerts.unshift({
      id: String(Date.now()),
      symbol: st.code,
      name: st.name || st.code,
      market: st.market,
      targetPrice: val,
      condition: cond,
      notifyMode: mode,
      schedHour: sh,
      schedMinute: sm,
      planNote: note ||
        "執行既定江恩轉勢交易計劃",
      isEnabled: true,
      isTriggered: false,
      isPendingDelivery: false
    });
    document.getElementById(
      "alNoteInp"
    ).value = "";
    playWebAlarm();
    syncAlertsCloud();
    renderAlertList();
  };

  document.getElementById(
    "btnAckTrig"
  ).onclick = () => {
    clearInterval(st.ringTimer);
    document.getElementById(
      "trigModal"
    ).style.display = "none";
  };

  const inp = document.getElementById(
    "codeInp"
  );
  inp.oninput = () => {
    clearTimeout(st.acTimer);
    const val = inp.value.trim();
    if (!val) {
      renderAc([]);
      return;
    }
    st.acTimer = setTimeout(
      async () => {
        const list =
          await searchStocks(val);
        renderAc(list);
      },
      220
    );
  };

  inp.onkeydown = e => {
    if (e.key === "Enter") {
      renderAc([]);
      loadSymbol();
    }
  };

  document.addEventListener(
    "click",
    e => {
      if (!e.target.closest(
        ".ac-wrap"
      )) {
        renderAc([]);
      }
    }
  );

  const tog = (id, key, fn) => {
    const el =
      document.getElementById(id);
    el.onclick = () => {
      st[key] = !st[key];
      el.classList.toggle(
        "on",
        st[key]
      );
      savePrefs();
      fn();
    };
  };
  tog("togSwing", "showSwing", drawChart);
  tog("togGrid", "showGrid", drawChart);
  tog("togFib", "showFib", drawChart);
  tog("togHarm", "showHarm", drawChart);

  const updVol = () => {
    document.getElementById(
      "volLbl"
    ).textContent =
      "波動:" +
      st.volMult.toFixed(1) + "x";
    savePrefs();
    runAnalysis();
  };
  document.getElementById(
    "volDn"
  ).onclick = () => {
    st.volMult = Math.max(
      0.4,
      st.volMult - 0.1
    );
    updVol();
  };
  document.getElementById(
    "volUp"
  ).onclick = () => {
    st.volMult = Math.min(
      2.5,
      st.volMult + 0.1
    );
    updVol();
  };

  document.getElementById(
    "btnLocHarm"
  ).onclick = focusHarmonic;

  document.getElementById(
    "btnHistBack"
  ).onclick = () => {
    const step = Math.max(
      15,
      Math.floor(st.histBars / 3)
    );
    panBackward(step);
    drawChart();
  };

  document.getElementById(
    "btnHistFwd"
  ).onclick = () => {
    const step = Math.max(
      15,
      Math.floor(st.histBars / 3)
    );
    panForward(step);
    drawChart();
  };

  const bMode =
    document.getElementById("btnMode");
  bMode.onclick = () => {
    st.moveLine = !st.moveLine;
    bMode.textContent = st.moveLine
      ? "移動時間線" : "拖動歷史";
    bMode.classList.toggle(
      "btn-hi",
      st.moveLine
    );
    bMode.classList.toggle(
      "on",
      !st.moveLine
    );
    savePrefs();
  };

  document.getElementById(
    "btnLatest"
  ).onclick = () => {
    st.panOff = 0;
    drawChart();
  };

  document.getElementById(
    "btnZoomIn"
  ).onclick = () => {
    st.histBars = Math.max(
      45,
      st.histBars - 30
    );
    savePrefs();
    drawChart();
  };
  document.getElementById(
    "btnZoomOut"
  ).onclick = () => {
    st.histBars = Math.min(
      360,
      st.histBars + 30
    );
    savePrefs();
    drawChart();
  };

  document.getElementById(
    "btnSetAnc"
  ).onclick = () => {
    if (st.selBar != null) {
      st.customAnc = st.selBar;
      runAnalysis();
    }
  };
  document.getElementById(
    "btnAutoAnc"
  ).onclick = () => {
    st.customAnc = null;
    st.selBar = null;
    runAnalysis();
  };

  document.getElementById(
    "btnCopy"
  ).onclick = () => {
    if (!st.res) return;
    navigator.clipboard.writeText(
      st.res.report
    );
    const b = document.getElementById(
      "btnCopy"
    );
    b.textContent = "已複製";
    setTimeout(() => {
      b.textContent = "複製報告";
    }, 1500);
  };

  const cv =
    document.getElementById("cv");
  let dragging = false;
  let moved = false;
  let dragAxis = false;
  let downX = 0;
  let basePan = 0;

  const barAt = clientX => {
    const rect =
      cv.getBoundingClientRect();
    const x = clientX - rect.left;
    const {
      startB,
      endB
    } = getVisRange();
    const span = Math.max(
      1,
      endB - startB
    );
    const useW = Math.max(
      1,
      rect.width - 58 - 12
    );
    const r = (x - 6) / useW;
    const off = Math.round(r * span);
    return Math.max(
      startB,
      Math.min(endB, startB + off)
    );
  };

  const checkPillBtn = (x, y) => {
    const b = st.pillBox;
    if (!b) return 0;
    if (y < b.y - 6 ||
      y > b.y + b.h + 6) {
      return 0;
    }
    if (x >= b.x - 4 &&
      x <= b.x + b.btnW + 2) {
      return -1;
    }
    if (x >= b.x + b.w - b.btnW - 2 &&
      x <= b.x + b.w + 4) {
      return 1;
    }
    return 0;
  };

  cv.onpointerdown = e => {
    const rect =
      cv.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const stepDir = checkPillBtn(x, y);
    if (stepDir !== 0) {
      stepBar(stepDir);
      return;
    }
    dragging = true;
    moved = false;
    dragAxis = y >= rect.height - 40;
    downX = e.clientX;
    basePan = st.panOff;
    cv.setPointerCapture(e.pointerId);
    if (st.moveLine || dragAxis) {
      st.selBar = barAt(e.clientX);
      drawChart();
    }
  };

  cv.onpointermove = e => {
    if (!dragging) return;
    const dx = e.clientX - downX;
    if (Math.abs(dx) > 4) {
      moved = true;
    }
    const rect =
      cv.getBoundingClientRect();
    if (st.moveLine || dragAxis) {
      const lx = e.clientX - rect.left;
      const plotW = Math.max(
        1,
        rect.width - 58
      );
      if (lx < 24) {
        panBackward(2);
      } else if (lx > plotW - 24 &&
        st.panOff > 0) {
        panForward(2);
      }
      st.selBar = barAt(e.clientX);
      drawChart();
      return;
    }
    if (!moved) return;
    const {
      startB,
      endB
    } = getVisRange();
    const span = Math.max(
      1,
      endB - startB
    );
    const useW = Math.max(
      1,
      rect.width - 58 - 12
    );
    const dBars = Math.round(
      (dx / useW) * span
    );
    const maxP = maxPanLimit();
    st.panOff = Math.max(
      0,
      Math.min(maxP, basePan + dBars)
    );
    drawChart();
  };

  cv.onpointerup = e => {
    if (!dragging) return;
    dragging = false;
    dragAxis = false;
    if (!moved) {
      st.selBar = barAt(e.clientX);
      drawChart();
    }
  };

  cv.onwheel = e => {
    e.preventDefault();
    const step =
      e.deltaY > 0 ? 20 : -20;
    st.histBars = Math.max(
      45,
      Math.min(
        360,
        st.histBars + step
      )
    );
    savePrefs();
    drawChart();
  };

  window.onkeydown = e => {
    const tag = document
      .activeElement?.tagName;
    if (tag === "INPUT" ||
      tag === "SELECT") {
      return;
    }
    if (e.key === "ArrowLeft") {
      e.preventDefault();
      stepBar(-1);
    } else if (
      e.key === "ArrowRight"
    ) {
      e.preventDefault();
      stepBar(1);
    }
  };

  const ro = new ResizeObserver(() => {
    drawChart();
  });
  ro.observe(
    document.getElementById("cWrap")
  );
}

restoreState();
loadAlertsLocal();
fillPresets();
initEvents();
loadSymbol();
setInterval(pollWebAlerts, 45000);
</script>
